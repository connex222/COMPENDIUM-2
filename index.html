const buzz = p => C2.haptic(p);
let AC = null;
function note(freq, dur, gain, type){
  if(!C2.sound()) return;
  try{
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    if(AC.state === "suspended") AC.resume();
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type || "sine"; o.frequency.value = freq;
    g.gain.setValueAtTime(0, AC.currentTime);
    g.gain.linearRampToValueAtTime(gain, AC.currentTime + .008);
    g.gain.exponentialRampToValueAtTime(.0001, AC.currentTime + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(); o.stop(AC.currentTime + dur + .02);
  }catch(e){}
}

/* ================= the rules =================
   Mirrors the generator exactly. A cell scores its value times the chain.
   The chain grows while each value is at least the last, caps at 5, and
   drops to 1 the moment you take something smaller.
   ================================================================== */
function stepChain(v, prevV, ch){ return (prevV >= 0 && v >= prevV) ? Math.min(CAP, ch+1) : 1; }
function scorePath(vals, p){
  let s = 0, ch = 0, pv = -1;
  for(const i of p){ const v = vals[i]; ch = stepChain(v, pv, ch); s += v*ch; pv = v; }
  return s;
}

function todayIndex(){
  const now = new Date();
  const utc = Date.UTC(now.getFullYear(), now.getMonth(), now.getDate());
  const c = Math.min(DAILY_CYCLE, BOARDS);
  return ((Math.floor((utc - EPOCH)/86400000) % c) + c) % c;
}

    b.type = "button"; b.className = "cell"; b.textContent = v;
    b.dataset.i = i;
    b.setAttribute("aria-label", "Value " + v + ", row " + (((i/N)|0)+1) + " column " + (i%N+1));
    el.grid.appendChild(b);
    return b;
  });
  cells[B.start].classList.add("start");
}
function resetRun(quiet){
  path = [B.start];
  score = B.vals[B.start];
  chain = 1; prev = B.vals[B.start];
  done = false; showingBest = false;
  el.ghost.style.display = "none";
  paint();
  if(!quiet) sndBack();
}

/* ================= painting ================= */
function paint(){
  const inPath = new Set(path);
  const head = path[path.length-1];
  const canReach = new Set(done ? [] : nbrs[head].filter(i=>!inPath.has(i)));
  for(let i=0;i<CELLS;i++){
    const c = cells[i];
    c.classList.toggle("taken", inPath.has(i));
    c.classList.toggle("head", i === head && !done);
    c.classList.toggle("reach", canReach.has(i));
    c.classList.toggle("best", showingBest && B.best.indexOf(i) > -1);
  }
  drawLine(el.line, path);
  el.cScore.textContent = score;
  el.cMax.textContent = B.max;
  el.cChain.innerHTML = "&times;" + chain;
  $("chainBox").classList.toggle("hot", chain > 1);
  el.cSteps.textContent = Math.max(0, STEPS - (path.length - 1));
  $("undo").disabled = done || path.length < 2;
  $("reset").disabled = path.length < 2 && !done;
  $("again").disabled = !done;
  $("showbest").disabled = runs === 0;
  readout(canReach.size);
}
function centre(i){
  const g = el.grid.getBoundingClientRect(), r = cells[i].getBoundingClientRect();
  return [r.left - g.left + r.width/2, r.top - g.top + r.height/2];
}
function drawLine(node, p){
  if(!cells.length || !cells[0].getBoundingClientRect().width){ node.setAttribute("points",""); return; }
  node.setAttribute("points", p.map(i=>centre(i).join(",")).join(" "));
}
function readout(reach){
  if(done){
    const pct = Math.round(score / B.max * 100);
    const best = HAULS[B.i] || 0;
    let line;
    if(score >= B.max) line = "The best line there is.";
    else if(score >= best && runs > 1) line = "Your best on this field.";
    else if(reach === 0 && path.length - 1 < STEPS) line = "Boxed in with " +
      (STEPS - (path.length-1)) + " steps unspent.";
    else line = (B.max - score) + " left on the field.";
    el.read.innerHTML = "<b>" + score + "</b><span class='pts'>of " + B.max +
      "  &middot;  " + pct + "%</span><span class='hint'>" + line + "</span>";
    return;
  }
  if(path.length === 1){
    el.read.innerHTML = "<span class='hint'>Trace a line from the ringed cell. " +
      "Take a value at least as big as the last and the chain grows.</span>";
    return;
  }
  el.read.innerHTML = "<b>" + score + "</b><span class='pts'>of " + B.max +
    "</span><span class='hint'>" +
    (chain >= CAP ? "Chain at full stretch." :
     chain > 1 ? "Chain of " + chain + ". Take " + prev + " or more to keep it." :
                 "Chain broken. Build it back.") + "</span>";
}

/* ================= moves ================= */
function extend(i){
  if(done) return false;
  const head = path[path.length-1];
  if(nbrs[head].indexOf(i) < 0) return false;
  if(path.indexOf(i) > -1) return false;
  const v = B.vals[i];
  chain = stepChain(v, prev, chain);
  const gain = v * chain;
  score += gain; prev = v;
  path.push(i);
  floatGain(i, gain);
  sndStep(chain);
  if(path.length - 1 >= STEPS) finish();
  else {
    paint();
    if(!nbrs[i].some(n=>path.indexOf(n) < 0)) { sndDead(); finish(); }
  }
  return true;
}
function undo(){
  if(done || path.length < 2) return;
  path.pop();
  score = scorePath(B.vals, path);
  chain = 0; prev = -1;
  for(const i of path){ const v = B.vals[i]; chain = stepChain(v, prev, chain); prev = v; }
  sndBack(); paint();
}
function floatGain(i, gain){
  if(calm()) return;
  const s = document.createElement("span");
  s.className = "gain"; s.textContent = "+" + gain;
  cells[i].appendChild(s);
  setTimeout(()=>s.remove(), 720);
}
function finish(){
  done = true;
  runs++;
  const prevBest = HAULS[B.i] || 0;
  const beaten = score > prevBest;
  if(beaten){ HAULS[B.i] = score; saveHauls(); }
  paint(); drawStrip();
  if(score >= B.max){ sndPerf(); toast("<b>Perfect line.</b> Nothing left on the field."); }
  else if(beaten && runs > 1){ sndBeat(); toast("<b>" + score + "</b> beats your " + prevBest + "."); }
  else sndEnd();
}

/* ================= the strip ================= */
function drawStrip(){
  const best = HAULS[B.i] || 0;
  const pct = best ? Math.round(best / B.max * 100) : 0;
  el.meter.style.width = pct + "%";
  el.standing.innerHTML = P.mode === "daily"
    ? "Today's field, <strong>" + BANDS[B.band] + "</strong>"
    : "Field <strong>" + B.i + "</strong>, " + BANDS[B.band];

  const rows = [];
  rows.push(["Your best here", best ? best + " of " + B.max : "not yet run",
             best >= B.max ? "crown" : ""]);
  rows.push(["Runs on this field", String(runs), ""]);
  const played = Object.keys(HAULS).length;
  const perfect = Object.keys(HAULS).filter(k=>HAULS[k] >= board(+k).max).length;
  rows.push(["Fields worked", String(played), ""]);
  rows.push(["Perfect lines", String(perfect), perfect ? "crown" : ""]);
  el.rows.innerHTML = "";
  for(const [label, val, cls] of rows){
    const d = document.createElement("div");
    d.className = "row " + cls;
    d.innerHTML = "<span class='grow'>" + label + "</span><b>" + val + "</b>";
    el.rows.appendChild(d);
  }
}

let toastTimer;
function toast(msg){
  el.toast.innerHTML = msg;
  el.toast.classList.add("up");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.toast.classList.remove("up"), 2600);
}

/* ================= pointer: tap a cell or drag a line ================= */
let tracing = false;
function cellAt(x, y){
  const t = document.elementFromPoint(x, y);
  if(!t || !t.classList || !t.classList.contains("cell")) return -1;
  return +t.dataset.i;
}
$("fieldwrap").addEventListener("pointerdown", e=>{
  const i = cellAt(e.clientX, e.clientY);
  if(i < 0) return;
  tracing = true;
  try{ e.currentTarget.setPointerCapture(e.pointerId); }catch(err){}
  handleCell(i);
  e.preventDefault();
});
$("fieldwrap").addEventListener("pointermove", e=>{
  if(!tracing) return;
  const i = cellAt(e.clientX, e.clientY);
  if(i >= 0) handleCell(i);
});
$("fieldwrap").addEventListener("pointerup", ()=>{ tracing = false; });
$("fieldwrap").addEventListener("pointercancel", ()=>{ tracing = false; });
/* Belt and braces: if capture is refused, a release outside the board would
   never reach the handler above and the finger would keep drawing on hover. */
window.addEventListener("pointerup", ()=>{ tracing = false; });
window.addEventListener("pointercancel", ()=>{ tracing = false; });
window.addEventListener("blur", ()=>{ tracing = false; });
function handleCell(i){
  if(done) return;
  // dragging back over the cell before the head takes the step back
  if(path.length > 1 && i === path[path.length-2]){ undo(); return; }
  extend(i);
}

/* ================= keyboard ================= */
document.addEventListener("keydown", e=>{
  if(e.metaKey || e.ctrlKey || e.altKey) return;
  const onButton = document.activeElement && document.activeElement.tagName === "BUTTON";
  const head = path[path.length-1];
  const d = {ArrowUp:-N, ArrowDown:N, ArrowLeft:-1, ArrowRight:1}[e.key];
  if(d !== undefined){
    const r = (head/N)|0, c = head%N, t = head + d;
    const ok = (d === -1 && c > 0) || (d === 1 && c < N-1) ||
               (d === -N && r > 0) || (d === N && r < N-1);
    if(ok) extend(t);
    e.preventDefault();
  } else if(e.key === "Backspace"){ undo(); e.preventDefault(); }
  else if(e.key === "Escape"){ resetRun(); }
  else if(e.key === "Enter" && done && !onButton){ resetRun(); }
});

/* ================= controls ================= */
function markSeg(){
  for(const b of document.querySelectorAll(".seg button"))
    b.setAttribute("aria-pressed", b.dataset.mode === P.mode ? "true" : "false");
}
$("undo").onclick = undo;
$("reset").onclick = ()=> resetRun();
$("again").onclick = ()=> resetRun();
$("newboard").onclick = ()=>{
  P.mode = "free"; markSeg(); savePrefs();
  loadBoard(Math.floor(Math.random()*BOARDS));
};
$("showbest").onclick = ()=>{
  showingBest = !showingBest;
  if(showingBest){ drawLine(el.ghost, B.best); el.ghost.style.display = ""; }
  else el.ghost.style.display = "none";
  $("showbest").textContent = showingBest ? "Hide line" : "Best line";
  paint();
};
for(const b of document.querySelectorAll(".seg button")){
  b.onclick = ()=>{
    if(b.dataset.mode === P.mode) return;
    P.mode = b.dataset.mode; markSeg(); savePrefs();
    loadBoard(P.mode === "daily" ? todayIndex() : Math.floor(Math.random()*BOARDS));
  };
}
window.addEventListener("resize", ()=>{
  drawLine(el.line, path);
  if(showingBest) drawLine(el.ghost, B.best);
});

/* ================= share ================= */
function hashFor(i){ return "g=" + i.toString(36); }
function parseHash(h){
  const m = /^g=([0-9a-z]+)$/.exec((h || "").replace(/^#/, ""));
  if(!m) return null;
  const i = parseInt(m[1], 36);
  return (i >= 0 && i < BOARDS) ? i : null;
}
function syncHash(){ C2.setFrag(hashFor(B.i)); }
$("share").onclick = ()=>{
  const best = HAULS[B.i] || 0;
  const where = P.mode === "daily" ? "today's field" : "field " + B.i;
  const lines = best
    ? ["Glean \u2014 " + where,
       best + " of a possible " + B.max + "  (" + Math.round(best/B.max*100) + "%)",
       best >= B.max ? "Perfect line." : (B.max - best) + " still out there."]
    : ["Glean \u2014 " + where,
       "There are " + B.max + " points on this field.",
       "See how many you can lift."];
  const url = C2.link(hashFor(B.i));
  if(url){ lines.push("Same field, beat it:"); lines.push(url); }
  else lines.push("Beat that.");
  C2.share(lines);
};

C2.onPause = function(){ tracing = false; };

/* ================= display face check ================= */
function hasFace(name){
  try{
    const c = document.createElement("canvas").getContext("2d");
    if(!c || !c.measureText) return true;
    const s = "WOMwmilg1@#";
    c.font = '700 48px serif';
    const base = c.measureText(s).width;
    c.font = '700 48px "' + name + '", serif';
    return Math.abs(base - c.measureText(s).width) > 0.5;
  }catch(e){ return true; }
}
if(!(hasFace("Didot") || hasFace("Bodoni MT") || hasFace("Playfair Display")))
  document.documentElement.dataset.display = "fallback";

/* ================= boot ================= */
loadAll();
const shared = parseHash(C2.frag());
if(shared !== null){ P.mode = "free"; loadBoard(shared, true); }
else loadBoard(P.mode === "daily" ? todayIndex() : Math.floor(Math.random()*BOARDS), true);
markSeg();
drawStrip();
requestAnimationFrame(()=>drawLine(el.line, path));
if(shared !== null) setTimeout(()=>toast("Someone sent you this field. Same values, same ceiling."), 700);
<\/script>
</body>
</html>
</script>
<script type="text/plain" id="vol-bight"><!DOCTYPE html>
<html lang="en-GB" data-theme="day">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Bight</title>
<style>
/* ==================================================================
   BIGHT — one loop of rope through every square; knots say where it bends.
   §1  CANONICAL TOKEN BLOCK. Do not author local overrides.
   ================================================================== */
:root {
  --serif: "Didot", "Bodoni MT", "Playfair Display", Georgia, "Times New Roman", serif;
  --body: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --util: ui-monospace, "SF Mono", "Cascadia Mono", "Roboto Mono", Menlo, monospace;
  --tap: 52px;
  --gutter: 20px;
  --radius: 10px;
  --radius-pill: 999px;
  --radius-plate: 18px;
}
html[data-theme="day"] {
  --ground:#EFE8F8; --plate:#F8F4FD; --well:#E5DBF3;
  --ink:#241041; --ink-2:#6B5590; --hair:#7E64AC;
  --accent:#4A1D7A; --on-accent:#FFF8E9; --chip:#3A1A66; --gilt:#8E6110;
  --pip-hi:#8A72B4; --pip-lo:#180830; --pip-glow:rgba(255,255,255,.6);
  --field:
    radial-gradient(120% 90% at 50% -10%, #F5E8FF 0%, rgba(245,232,255,0) 60%),
    radial-gradient(90% 70% at 100% 110%, #FFEAD6 0%, rgba(255,234,214,0) 55%),
    linear-gradient(180deg,#F2EBFA 0%,#E7DEF3 100%);
  --h1-fill: linear-gradient(180deg,#2E1350,#7A3A9E 92%);
  --wash: rgba(74,29,122,.10); --veil: rgba(36,16,65,.55);
  --face:#FFFFFF;
  --face-ink:#180830;
  --sink: inset 1px 1px 3px rgba(36,16,65,.18), inset -1px -1px 1px rgba(255,255,255,.85);
  --raise: 0 1px 0 rgba(255,255,255,.7), 0 4px 14px rgba(36,16,65,.10);
  --ok-shadow: inset 1px 1px 3px rgba(36,16,65,.18), 0 0 18px -3px rgba(74,29,122,.50);
  --w-body:400; --w-disp:500;
}
html[data-theme="glare"] {
  --ground:#FFFFFF; --plate:#FFFFFF; --well:#FFFFFF;
  --ink:#000000; --ink-2:#000000; --hair:#000000;
  --accent:#000000; --on-accent:#FFFFFF; --chip:#000000; --gilt:#000000;
  --pip-hi:#000000; --pip-lo:#000000; --pip-glow:transparent;
  --field:#FFFFFF;
  --h1-fill: none;
  --wash: transparent; --veil: rgba(0,0,0,.65);
  --face:#FFFFFF;
  --face-ink:#000000;
  --sink: none; --raise: none; --ok-shadow: none;
  --w-body:600; --w-disp:700;
}
html[data-theme="night"] {
  --ground:#12071F; --plate:#241041; --well:#1B0A35;
  --ink:#F6F1FF; --ink-2:#B49BD8; --hair:rgba(240,195,92,.55);
  --accent:#F0C35C; --on-accent:#22093C; --chip:#F0C35C; --gilt:#F0C35C;
  --pip-hi:#FFF0C4; --pip-lo:#A76F14; --pip-glow:rgba(255,255,255,.10);
  --field:
    radial-gradient(120% 90% at 50% -10%, #4A1D7A 0%, rgba(74,29,122,0) 60%),
    radial-gradient(90% 70% at 100% 110%, #7A1D5E 0%, rgba(122,29,94,0) 55%),
    linear-gradient(180deg,#1B0B33 0%,#12071F 100%);
  --h1-fill: linear-gradient(180deg,#FFF8E9,#E7A9D8 90%);
  --wash: rgba(240,195,92,.13); --veil: rgba(18,7,32,.78);
  --face:#F2ECFF;
  --face-ink:#1B0A35;
  --sink: inset 1px 1px 3px rgba(0,0,0,.55), inset -1px -1px 1px rgba(255,255,255,.06);
  --raise: inset 0 1px 0 rgba(255,255,255,.10), 0 6px 20px rgba(0,0,0,.45);
  --ok-shadow: inset 1px 1px 3px rgba(0,0,0,.55), 0 0 22px -3px rgba(240,195,92,.60);
  --w-body:350; --w-disp:400;
}

/* §2  volume-local geometry only — no colour authored below this line */
:root{ --ease: cubic-bezier(.16,1,.3,1); }
[hidden]{display:none !important}
*{box-sizing:border-box}
html,body{height:100%; margin:0}
body{
  background:var(--ground); color:var(--ink);
  background-image:var(--field); background-attachment:fixed;
  font-family:var(--body); font-weight:var(--w-body);
  font-size:16px; line-height:1.45;
  -webkit-text-size-adjust:100%; -webkit-tap-highlight-color:transparent;
  overflow:hidden; overscroll-behavior:none;
}
.app{
  height:100vh; height:100dvh; max-width:520px; margin:0 auto;
  display:flex; flex-direction:column;
  padding:calc(env(safe-area-inset-top) + 4px) var(--gutter) 0;
}
/* ---------- counters ---------- */
.counters{flex:0 0 auto; display:flex; gap:7px; padding-bottom:12px}
.counter{
  flex:1; min-width:0; padding:8px 4px 9px; border-radius:var(--radius);
  background:var(--well); border:1px solid var(--hair); box-shadow:var(--sink);
  text-align:center;
}
.counter b{
  display:block; font-family:var(--util); font-size:1rem; font-weight:600;
  font-variant-numeric:tabular-nums; letter-spacing:-.03em; color:var(--ink);
  white-space:nowrap; overflow:hidden;
}
.counter span{display:block; font-size:.62rem; color:var(--ink-2); letter-spacing:.04em}
.counter.hot b{color:var(--gilt)}
/* ---------- the plate ---------- */
.plate{
  flex:0 0 auto; position:relative; padding:14px; margin-bottom:12px;
  background:var(--plate); border:1px solid var(--hair);
  border-radius:var(--radius-plate); box-shadow:var(--raise);
}
.boardwrap{
  position:relative; user-select:none; -webkit-user-select:none;
  container-type:inline-size;
  /* the board is square, so capping its width caps its height. --chrome is
     everything stacked above and below it in the current layout. */
  --chrome:330px;
  width:100%;
  width:max(200px, min(100%, calc(100vh - var(--chrome))));
  width:max(200px, min(100%, calc(100dvh - var(--chrome))));
  margin-inline:auto;
}
button:focus-visible{outline:2px solid var(--gilt); outline-offset:3px}
button:focus:not(:focus-visible){outline:none}
/* ---------- readout ---------- */
.read{
  min-height:3.2em; margin:12px 0 2px; text-align:center;
  font-size:.86rem; color:var(--ink-2);
}
.read b{
  display:inline-block; font-family:var(--serif); font-weight:var(--w-disp);
  font-size:1.4rem; letter-spacing:.02em; color:var(--ink); margin-right:.35em;
}
html[data-display="fallback"] .read b{font-weight:700}
.read .sub{display:block; font-size:.82rem}
/* ---------- pills ---------- */
.controls{display:flex; gap:9px; padding-top:10px}
.btn{
  flex:1; min-height:var(--tap); font:inherit; font-size:.9rem; cursor:pointer;
  padding:0 8px; border-radius:var(--radius-pill);
  background:var(--plate); color:var(--ink-2);
  border:1px solid var(--hair); box-shadow:var(--raise);
  transition:transform .12s ease, color .2s, border-color .2s;
}
.btn:hover{color:var(--ink); border-color:var(--gilt)}
.btn:active{transform:translateY(1.5px)}
.btn[disabled]{opacity:.4; cursor:default}
.btn.go{font-weight:600; background:var(--accent); border-color:var(--accent); color:var(--on-accent)}
html[data-theme="glare"] .btn.go{border-width:3px}
/* ---------- strip ---------- */
.strip{
  flex:1 1 auto; min-height:0; overflow-y:auto; overscroll-behavior:contain;
  padding:6px 0 14px; scrollbar-width:thin;
}
.strip::-webkit-scrollbar{width:3px}
.strip::-webkit-scrollbar-thumb{background:var(--hair); border-radius:3px}
.strip-head{display:flex; align-items:center; gap:8px; padding-bottom:10px}
.strip-head p{margin:0; flex:1; min-width:0; font-size:.8rem; color:var(--ink-2)}
.strip-head p strong{color:var(--ink)}
.chip{
  flex:0 0 auto; font:inherit; font-size:.76rem; padding:9px 13px; cursor:pointer;
  border-radius:var(--radius-pill); white-space:nowrap;
  background:var(--plate); color:var(--gilt);
  border:1px solid var(--hair); box-shadow:var(--raise);
}
.chip:hover{border-color:var(--gilt)}
.chip[disabled]{opacity:.4; cursor:default}
.rows{display:flex; flex-direction:column; gap:7px}
.row{
  display:flex; align-items:baseline; gap:10px; padding:9px 12px;
  border-radius:var(--radius); background:var(--well);
  border:1px solid var(--hair); box-shadow:var(--sink);
  font-size:.8rem; color:var(--ink-2);
}
.row b{font-family:var(--util); font-size:.9rem; color:var(--ink); font-variant-numeric:tabular-nums}
.row .grow{flex:1}
.row.crown{border-color:var(--gilt)}
.row.crown b{color:var(--gilt)}
/* ---------- footer ---------- */
footer{
  flex:0 0 auto; display:flex; gap:9px; align-items:center;
  padding:11px 0 calc(env(safe-area-inset-bottom) + 12px);
  border-top:1px solid var(--hair);
}
.seg{
  flex:1; display:flex; gap:5px; padding:4px; border-radius:var(--radius-pill);
  background:var(--well); border:1px solid var(--hair); box-shadow:var(--sink);
}
.seg button{
  flex:1; font:inherit; font-size:.8rem; min-height:40px; padding:0 2px; cursor:pointer;
  border:0; border-radius:var(--radius-pill); background:none; color:var(--ink-2);
  transition:background .3s var(--ease), color .3s var(--ease);
}
.seg button[aria-pressed="true"]{background:var(--accent); color:var(--on-accent); font-weight:600}
.wa{
  flex:0 0 auto; min-height:var(--tap); padding:0 15px; cursor:pointer;
  display:flex; align-items:center; gap:8px;
  font:inherit; font-size:.82rem; border-radius:var(--radius-pill);
  background:var(--plate); color:var(--gilt);
  border:1px solid var(--hair); box-shadow:var(--raise);
}
.wa svg{width:17px; height:17px; fill:none; stroke:currentColor;
  stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round}
.wa[disabled]{opacity:.4; cursor:default}
/* ---------- toast ---------- */
.toast{
  position:fixed; left:50%; z-index:60;
  bottom:calc(env(safe-area-inset-bottom) + 84px);
  transform:translate(-50%,16px) scale(.97);
  max-width:84vw; padding:12px 18px; text-align:center;
  border-radius:var(--radius-plate);
  background:var(--plate); color:var(--ink);
  border:1px solid var(--hair); box-shadow:var(--raise);
  font-size:.84rem; opacity:0; pointer-events:none;
  transition:opacity .3s var(--ease), transform .42s var(--ease);
}
.toast b{font-family:var(--serif); font-weight:var(--w-disp); color:var(--gilt)}
.toast.up{opacity:1; transform:translate(-50%,0) scale(1)}
.sr-only{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:.01ms !important; animation-iteration-count:1 !important;
    transition-duration:.01ms !important}
}

/* ---------- rules sheet ----------
   Rules live in a sheet over the board, not in the scrolling strip, so they
   can always be read in full: bottom sheet on a phone, centred card on a
   tablet or computer. Opens itself the first time a volume is played. */
.rulesbtn{display:inline-flex; align-items:center; gap:6px}
.rulesbtn svg{width:15px; height:15px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round}
.rules{
  position:fixed; inset:0; z-index:80; display:flex; align-items:flex-end; justify-content:center;
  background:var(--veil);
}
.rules-card{
  width:100%; max-width:640px; max-height:92vh; max-height:92dvh; overflow-y:auto; overscroll-behavior:contain;
  background:var(--plate); color:var(--ink); border:1px solid var(--hair); box-shadow:var(--raise);
  border-radius:var(--radius-plate) var(--radius-plate) 0 0;
  padding:22px var(--gutter) calc(env(safe-area-inset-bottom) + 18px);
  animation:rise .32s var(--ease);
}
@keyframes rise{from{transform:translateY(40px); opacity:0} to{transform:none; opacity:1}}
.rules-card h2{
  margin:0 0 4px; font-family:var(--serif); font-weight:var(--w-disp); font-size:1.6rem; line-height:1.15;
}
.rules-card .lede{margin:0 0 16px; color:var(--ink-2); font-size:1rem}
.rules-body{font-size:1.02rem; line-height:1.6}
.rules-body p{margin:0 0 12px}
.rules-body ol{margin:0 0 14px; padding-left:1.3em}
.rules-body li{margin-bottom:8px}
.rules-body b{font-weight:700}
.rules-body .key{display:grid; grid-template-columns:52px 1fr; gap:10px 14px; align-items:center; margin:6px 0 16px}
.rules-body .key > span{font-size:.98rem}
.rules-card .btn{width:100%; margin-top:8px}
html[data-theme="glare"] .rules-body, html[data-theme="glare"] .rules-card .lede{font-weight:600}

/* ---------- layouts ----------
   Phone portrait: one column, board as large as the height allows.
   Tablet portrait: one wider column, larger type.
   Landscape tablet and computer: board on the left, everything else beside it. */
@media (min-width:700px) and (orientation:portrait){
  html{font-size:17px}
  .app{max-width:680px}
  .boardwrap{--chrome:380px}
  .counter b{font-size:1.15rem}
  .counter span{font-size:.7rem}
}
@media (min-width:700px) and (orientation:landscape), (min-width:1000px){
  html{font-size:17px}
  .app{
    max-width:1180px; display:grid; column-gap:28px;
    grid-template-columns:minmax(0,1fr) minmax(300px,380px);
    grid-template-rows:auto minmax(0,1fr) auto;
    padding-top:calc(env(safe-area-inset-top) + 14px);
  }
  .plate{grid-column:1; grid-row:1 / 4; align-self:start; justify-self:center; width:100%;
    max-width:min(760px, calc(100vh - 200px)); max-width:min(760px, calc(100dvh - 200px))}
  .boardwrap{--chrome:230px}
  .counters{grid-column:2; grid-row:1}
  .strip{grid-column:2; grid-row:2}
  footer{grid-column:2; grid-row:3}
  .counter b{font-size:1.15rem}
  .counter span{font-size:.7rem}
  .toast{bottom:36px}
  .rules{align-items:center; padding:24px}
  .rules-card{border-radius:var(--radius-plate); padding-bottom:22px}
}
/* a squat window: trim the chrome so the board keeps its size */
@media (max-height:640px) and (orientation:portrait){
  :root{--tap:44px}
  .counters{padding-bottom:6px}
  .counter{padding:5px 4px 6px}
  .read{min-height:2.4em; margin:8px 0 0}
  .read b{font-size:1.15rem}
  .plate{padding:10px}
  .boardwrap{--chrome:280px}
}
@media (max-height:520px) and (orientation:landscape){
  .boardwrap{--chrome:170px}
  .read{min-height:2.2em; margin:6px 0 0}
  .plate{padding:10px}
}


/* ---------- the rope board ---------- */
#rope{display:block; width:100%; height:auto; aspect-ratio:1; touch-action:none; cursor:crosshair}
#rope .sq{fill:var(--well); stroke:var(--hair); stroke-width:.02}
#rope .sq.over{fill:var(--wash); stroke:var(--gilt); stroke-width:.06}
#rope .line{fill:none; stroke:var(--accent); stroke-width:.2; stroke-linecap:round; stroke-linejoin:round}

#rope .pearl{stroke-width:.07}
#rope .pearl.bend{fill:var(--ink); stroke:var(--ink)}
#rope .pearl.run{fill:var(--face); stroke:var(--ink)}
#rope .pearl.met{stroke:var(--gilt); stroke-width:.09}

.rules-body .knots{display:flex; gap:22px; margin:6px 0 14px; align-items:center}

.rules-body .knots span{font-size:.95rem}

<body>
<div class="app">
  <div class="counters">
    <div class="counter" id="cDoneBox"><b id="cDone">0%</b><span>laid</span></div>
    <div class="counter" id="cTimeBox"><b id="cTime">0:00</b><span>time</span></div>
    <div class="counter" id="cHintBox"><b id="cHint">0</b><span>hints</span></div>
    <div class="counter" id="cSizeBox"><b id="cSize">&ndash;</b><span>board</span></div>
  </div>
  <section class="plate" id="plate">
    <div class="boardwrap"><svg id="rope" viewBox="0 0 6 6" role="img" aria-label="The rope board"></svg></div>
    <p class="read" id="read" aria-live="polite"></p>
    <div class="controls">
      <button class="btn" id="undo">Undo</button>
      <button class="btn" id="clear">Clear</button>
      <button class="btn" id="hint">Hint</button>
    </div>
  </section>
  <section class="strip">
    <div class="strip-head">
      <p id="standing"></p>
      <button class="chip rulesbtn" id="rulesBtn"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.3a2.5 2.5 0 0 1 4.8.9c0 1.7-2.4 2.1-2.4 3.6M12 17h.01"/></svg>How to play</button>
      <button class="chip" id="fresh" hidden>New rope</button>
    </div>
    <div class="rows" id="rows"></div>
  </section>
  <footer>
    <div class="seg" role="group" aria-label="Which board">
      <button data-mode="daily" aria-pressed="true">Today</button>
      <button data-mode="free" aria-pressed="false">Free</button>
    </div>
    <button class="wa" id="share" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 8.9 8.9 0 0 1-3.8-.8L3 20.5l1.4-4.1A8.4 8.4 0 0 1 12 3.1a8.4 8.4 0 0 1 9 8.4z"/><path d="M8.8 9.2c0 3 2.2 5.2 5.2 5.2"/></svg> WhatsApp</button>
  </footer>
</div>
<div class="rules" id="rules" role="dialog" aria-modal="true" aria-labelledby="rulesTitle" hidden>
  <div class="rules-card">
    <h2 id="rulesTitle">How to play Bight</h2>
    <p class="lede">One loop of rope through every square. Knots say where it bends.</p>
    <div class="rules-body">
      <p>Lay <b>one closed loop of rope</b> that passes through <b>every square</b> exactly once, moving up, down, left and right. It never crosses itself or branches.</p>
      <p>Some squares carry a knot that tells you what the rope does there:</p>
      <div class="knots">
        <div class="kn"><svg viewBox="0 0 2 2"><rect x=".05" y=".05" width="1.9" height="1.9" rx=".2" fill="var(--well)" stroke="var(--hair)" stroke-width=".04"/><path d="M1 0v1h1" fill="none" stroke="var(--accent)" stroke-width=".28" stroke-linecap="round"/><circle cx="1" cy="1" r=".34" fill="var(--ink)"/></svg><span><b>Filled knot</b>: the rope turns a corner here.</span></div>
      </div>
      <div class="knots">
        <div class="kn"><svg viewBox="0 0 2 2"><rect x=".05" y=".05" width="1.9" height="1.9" rx=".2" fill="var(--well)" stroke="var(--hair)" stroke-width=".04"/><path d="M0 1h2" fill="none" stroke="var(--accent)" stroke-width=".28" stroke-linecap="round"/><circle cx="1" cy="1" r=".34" fill="var(--face)" stroke="var(--ink)" stroke-width=".1"/></svg><span><b>Hollow knot</b>: the rope runs straight through.</span></div>
      </div>
      <ol>
        <li><b>Drag</b> through squares to lay rope between them.</li>
        <li>Drag back over a stretch to take it up, or <b>tap</b> a square to clear the rope through it.</li>
        <li>A square holding rope in more than two directions is marked as tangled.</li>
        <li>A knot ringed in gold is satisfied. A dashed ring means it is broken.</li>
      </ol>
      <p>When the loop is closed through every square and every knot is satisfied, you are done. There is only one answer.</p>
      <p>Early in the week the board is 6 by 6, then 8 by 8 from Thursday. <b>Hint</b> fixes or lays one stretch.</p>
    </div>
    <button class="btn go" id="rulesClose">Got it</button>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

/* Contract §7 — seeded randomness. Canonical. A daily board must be identical

function seedFor(slug, date) {

/* Bight core: one closed rope loop through every cell of a 6x6 grid.

var B_N = 6, B_S = 36;
function bSize(n){ B_N = n; B_S = n * n; }
/* Edges: H[r*N+c] joins (r,c)-(r,c+1); V[r*N+c] joins (r,c)-(r+1,c). */
function bEmpty(){ var h = [], v = []; for (var i = 0; i < B_S; i++) { h.push(0); v.push(0); } return { h: h, v: v }; }

   blocks, each block a small ring, rings merged along every tree edge. */
function bCycle(rng){

/* Count loops that fit the pearls, stopping at 2. Cells are decided in
   reading order: each cell picks its right and down edges, its left and up
   already being fixed. A union-find refuses any loop that closes early. */
function bCount(pearl, limit){

/* A board: the loop, then pearls added in a random order until the loop is
   the only fit, then pruned so every pearl left is needed. */
function bCandidate(rng){
  var e = bCycle(rng), kinds = [], order = [], i;
  for (i = 0; i < B_S; i++) { kinds.push(bKind(bSides(e, i))); order.push(i); }

/* Volume kit: the rules sheet. Shared by Reeve, Shunt, Furlong, Bight and
   Marquetry. The sheet opens itself the first time a volume is played. */
function vkRules(C2){
  var sheet = document.getElementById("rules"), btn = document.getElementById("rulesBtn"),
      close = document.getElementById("rulesClose"), last = null;
  function open(){
    last = document.activeElement;
    sheet.hidden = false;
    var card = sheet.querySelector(".rules-card");
    card.scrollTop = 0;
    try { close.focus({ preventScroll: true }); } catch (e) { close.focus(); }
    card.scrollTop = 0;
  }
  function shut(){
    sheet.hidden = true;
    C2.write("taught", true);
    if (last && last.focus) last.focus();
  }
  btn.addEventListener("click", open);
  close.addEventListener("click", shut);
  sheet.addEventListener("click", function (e) { if (e.target === sheet) shut(); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !sheet.hidden) { e.stopPropagation(); shut(); } }, true);
  if (!C2.read("taught", false)) setTimeout(open, 250);
  return { open: open, shut: shut, isOpen: function () { return !sheet.hidden; } };
}

/* ── shared helpers for the volumes built on this kit ───────────── */
function vkToday() {

function vkYesterdayOf(s) {

  var p = s.split("-"), d = new Date(+p[0], +p[1] - 1, +p[2]);
  try { return d.toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short" }); }
  catch (e) { return s; }
}
function vkClock(ms) { var s = Math.floor(ms / 1000); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); }
var vkAC = null;
function vkNote(f, dur, gain, type) {
  if (!C2.sound()) return;
  try {
    vkAC = vkAC || new (window.AudioContext || window.webkitAudioContext)();
    if (vkAC.state === "suspended") vkAC.resume();
    var o = vkAC.createOscillator(), g = vkAC.createGain(), t = vkAC.currentTime;
    o.type = type || "triangle"; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(gain, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);

}
function vkChord() {
  [523.25, 659.25, 783.99, 1046.5].forEach(function (f, i) { setTimeout(function () { vkNote(f, 0.3, 0.05, "sine"); }, i * 95); });
  C2.haptic([20, 60, 20, 60, 30]);
}
function vkRead(word, line) {
  document.getElementById("read").innerHTML = "<b>" + word + "</b><span class='sub'>" + line + "</span>";
}
var vkToastTimer;
function vkToast(msg) {
  var t = document.getElementById("toast"); t.innerHTML = msg; t.classList.add("up");
  clearTimeout(vkToastTimer); vkToastTimer = setTimeout(function () { t.classList.remove("up"); }, 2600);
}
function vkSeg(mode) {
  var segs = document.querySelectorAll(".seg button");
  for (var k = 0; k < segs.length; k++) segs[k].setAttribute("aria-pressed", String(segs[k].dataset.mode === mode));
}
function vkRows(rows) {
  document.getElementById("rows").innerHTML = rows.map(function (r) {
    return "<div class='row " + (r[2] || "") + "'><span class='grow'>" + r[0] + "</span><b>" + r[1] + "</b></div>";
  }).join("");
}
var vkEmbedded = (function () { try { return window.parent !== window; } catch (e) { return false; } })();
/* A ticking clock that only runs while the board is on screen and unfinished. */
function vkClockKeeper(el, get, set) {
  var tick = null, startedAt = 0;
  return {
    start: function () {
      if (tick) return;
      startedAt = Date.now() - get();
      tick = setInterval(function () { set(Date.now() - startedAt); el.textContent = vkClock(get()); }, 500);
    },
    stop: function () { if (!tick) return; clearInterval(tick); tick = null; set(Date.now() - startedAt); },
    drop: function () { if (tick) { clearInterval(tick); tick = null; } },
    running: function () { return !!tick; }
  };
}

(function () {
  "use strict";
  var SLUG = "bight";
  /* Size and pearl count by weekday, index 0 Sunday. Fewer pearls give less
     to hold on to. Every board has exactly one loop. */
  var WEEK = [[8, 0, 15], [6, 8, 11], [6, 7, 8], [6, 0, 7], [8, 18, 99], [8, 16, 17], [8, 15, 16]];
  var FREE = [6, 0, 8];
  var CAP = 4000;
  var $ = function (id) { return document.getElementById(id); };
  var svg = $("rope");
  var B = null, G = null, mode = "daily", loadToken = 0, booted = false, stroke = null, history = [];
  var stats = C2.read("stats", null) || { plays: 0, clean: 0, streak: 0, lastDaily: null };
  var clock = vkClockKeeper($("cTime"), function () { return G ? G.elapsed : 0; }, function (v) { if (G) G.elapsed = v; });

  function generate(seed, n, lo, hi, done) {
    var token = ++loadToken, rng = rngFrom(seed), tries = 0;
    function slice() {
      if (token !== loadToken) return;
      bSize(n);
      var t0 = Date.now();
      while (Date.now() - t0 < 16) {
        tries++;
        var c = bCandidate(rng);
        if (c && c.pearls >= lo && c.pearls <= hi) { c.seed = seed; c.n = n; return done(c); }
        if (tries === CAP) { rng = rngFrom(seed); lo = 0; hi = 999; }
      }
      vkRead("&hellip;", "Coiling the rope. " + tries + " loops tried.");
      setTimeout(slice, 0);
    }
    vkRead("&hellip;", "Coiling the rope.");
    slice();
  }

  /* ── edges: H[i] joins i to its right, V[i] joins i to the one below ── */
  function edgeKey(a, b) { var n = B.n, lo = Math.min(a, b), hi = Math.max(a, b); return hi - lo === 1 ? "h" + lo : "v" + lo; }
  function has(a, b) { var k = edgeKey(a, b); return k[0] === "h" ? G.h[+k.slice(1)] : G.v[+k.slice(1)]; }
  function setE(a, b, val) { var k = edgeKey(a, b); if (k[0] === "h") G.h[+k.slice(1)] = val; else G.v[+k.slice(1)] = val; }
  function adjacent(a, b) {
    var n = B.n, ra = (a / n) | 0, rb = (b / n) | 0;
    return (ra === rb && Math.abs(a - b) === 1) || Math.abs(a - b) === n;
  }
  function degree(i) {
    var n = B.n, r = (i / n) | 0, c = i % n, d = 0;
    if (c < n - 1 && G.h[i]) d++; if (c > 0 && G.h[i - 1]) d++;
    if (r < n - 1 && G.v[i]) d++; if (r > 0 && G.v[i - n]) d++;
    return d;
  }
  function sides(i) { bSize(B.n); return bSides({ h: G.h, v: G.v }, i); }
  function solved() {
    var n = B.n, S = n * n, i;
    for (i = 0; i < S; i++) {
      if (degree(i) !== 2) return false;
      if (B.pearl[i] && bKind(sides(i)) !== B.pearl[i]) return false;
    }
    /* one loop, not several: walk it and count */
    var seen = 1, prev = -1, at = 0;
    for (var guard = 0; guard < S + 2; guard++) {
      var r = (at / n) | 0, c = at % n, nx = -1;
      var opts = [];
      if (c < n - 1 && G.h[at]) opts.push(at + 1); if (c > 0 && G.h[at - 1]) opts.push(at - 1);
      if (r < n - 1 && G.v[at]) opts.push(at + n); if (r > 0 && G.v[at - n]) opts.push(at - n);
      nx = opts[0] === prev ? opts[1] : opts[0];
      prev = at; at = nx;
      if (at === 0) break;
      seen++;
    }
    return seen === S;
  }

  /* ── drawing: one svg, cell centres at (c+.5, r+.5) ── */
  function draw() {
    var n = B.n, S = n * n, out = [], i;
    for (i = 0; i < S; i++) {
      var r = (i / n) | 0, c = i % n, d = degree(i);
      out.push('<rect class="sq' + (d > 2 ? " over" : "") + '" x="' + (c + 0.05) + '" y="' + (r + 0.05) + '" width=".9" height=".9" rx=".12"/>');
    }
    var path = "";
    for (i = 0; i < S; i++) {
      var rr = (i / n) | 0, cc = i % n;
      if (cc < n - 1 && G.h[i]) path += "M" + (cc + 0.5) + " " + (rr + 0.5) + "h1";
      if (rr < n - 1 && G.v[i]) path += "M" + (cc + 0.5) + " " + (rr + 0.5) + "v1";
    }
    out.push('<path class="line" d="' + path + '"/>');
    for (i = 0; i < S; i++) {
      if (!B.pearl[i]) continue;
      var r2 = (i / n) | 0, c2 = i % n, s = sides(i), dg = degree(i);
      var state = dg === 2 ? (bKind(s) === B.pearl[i] ? " met" : " broken") : (dg === 1 && B.pearl[i] === 2 && false ? "" : "");
      out.push('<circle class="pearl ' + (B.pearl[i] === 1 ? "bend" : "run") + state + '" cx="' + (c2 + 0.5) + '" cy="' + (r2 + 0.5) + '" r=".2"/>');
    }
    svg.setAttribute("viewBox", "0 0 " + n + " " + n);
    svg.innerHTML = out.join("");
    counters();
  }
  function counters() {
    var n = B.n, S = n * n, ok = 0;
    for (var i = 0; i < S; i++) if (degree(i) === 2) ok++;
    $("cDone").textContent = Math.round(ok / S * 100) + "%";
    $("cTime").textContent = vkClock(G.elapsed);
    $("cHint").textContent = String(G.hints);
    $("cSize").textContent = n + "\u00d7" + n;
    $("undo").disabled = G.done || !history.length;
    $("hint").disabled = G.done;
    $("share").disabled = !G.done;
  }
  function standing() {
    $("standing").innerHTML = mode === "daily"
      ? "Today&rsquo;s rope, <strong>" + vkPretty(G.date) + "</strong>"
      : "Free rope <strong>" + B.seed.toString(36) + "</strong>";
    $("fresh").hidden = mode !== "free";
    var p = B.pearl.filter(function (x) { return x; }).length;
    vkRows([["Daily streak", String(stats.streak), stats.streak > 1 ? "crown" : ""],
            ["Dailies with no hints", stats.clean + " of " + stats.plays],
            ["Knots on this board", String(p)]]);

  /* ── input: drag through cells; going back over a stretch takes it up ── */

  function toggle(a, b) {
    var v = has(a, b) ? 0 : 1;
    setE(a, b, v);
    stroke.push([a, b, v]);

  function stepTo(i) {

    if (i === at || i < 0) return;
    /* a fast finger can skip cells: walk the straight line between */
    var ra = (at / n) | 0, ca = at % n, rb = (i / n) | 0, cb = i % n;
    if (ra !== rb && ca !== cb) {
      if (Math.abs(ra - rb) + Math.abs(ca - cb) > 2) return;
      return;                                       // diagonal: wait for the next square
    }
    var step = ra === rb ? (cb > ca ? 1 : -1) : (rb > ra ? n : -n);

    if (!G || G.done) return;

  svg.addEventListener("pointermove", function (e) { if (stroke) stepTo(cellAt(e.clientX, e.clientY)); });
  function release() {
    if (!stroke) return;
    var s = stroke; stroke = null;
    if (!s.length) {                              // a tap: clear the rope through that square
      var n = B.n, i = s.from, cut = [];
      [i + 1, i - 1, i + n, i - n].forEach(function (j) { if (j >= 0 && j < n * n && adjacent(i, j) && has(i, j)) { setE(i, j, 0); cut.push([i, j, 0]); } });

  svg.addEventListener("pointerup", release);
  svg.addEventListener("pointercancel", release);
  function after() {
    draw(); save();
    if (solved()) return finish();
    var n = B.n, over = 0, i;
    for (i = 0; i < n * n; i++) if (degree(i) > 2) over++;
    if (over) vkRead("Tangled.", "A square can only take the rope in and out once. Take up the extra stretch.");
    else vkRead("&nbsp;", "Drag through squares to lay rope. Go back over it to take it up.");
  }
  function undo() {
    if (!history.length || G.done) return;
    var s = history.pop();
    for (var k = s.length - 1; k >= 0; k--) setE(s[k][0], s[k][1], s[k][2] ? 0 : 1);
    vkNote(262, 0.05, 0.035);
    draw(); save();
  }
  function hint() {
    if (G.done) return;
    var n = B.n, S = n * n, i;
    /* first take away a stretch that is wrong, else lay one that is missing */
    for (i = 0; i < S; i++) {
      var r = (i / n) | 0, c = i % n;
      if (c < n - 1 && G.h[i] && !B.e.h[i]) { G.h[i] = 0; return hinted("A stretch was wrong and has been taken up.", [[i, i + 1, 0]]); }
      if (r < n - 1 && G.v[i] && !B.e.v[i]) { G.v[i] = 0; return hinted("A stretch was wrong and has been taken up.", [[i, i + n, 0]]); }
    }
    for (i = 0; i < S; i++) {
      var r2 = (i / n) | 0, c2 = i % n;
      if (c2 < n - 1 && !G.h[i] && B.e.h[i]) { G.h[i] = 1; return hinted("One stretch laid for you.", [[i, i + 1, 1]]); }
      if (r2 < n - 1 && !G.v[i] && B.e.v[i]) { G.v[i] = 1; return hinted("One stretch laid for you.", [[i, i + n, 1]]); }
    }
  }
  function hinted(msg, rec) { G.hints++; history.push(rec); clock.start(); draw(); save(); vkRead(msg, "Hints show in your result."); if (solved()) finish(); }
  function finish() {
    G.done = true; clock.stop();
    if (G.daily && G.date === vkToday() && !G.counted) {
      G.counted = true;
      stats.plays++; if (!G.hints) stats.clean++;
      if (stats.lastDaily !== G.date) { stats.streak = stats.lastDaily === vkYesterdayOf(G.date) ? stats.streak + 1 : 1; stats.lastDaily = G.date; }
      C2.write("stats", stats);
    }
    save(); draw(); vkChord(); finishRead(); standing();
    $("plate").classList.add("closed");
  }
  function finishRead() {
    vkRead("Closed.", "One rope through every square in " + vkClock(G.elapsed) + (G.hints ? ", with " + G.hints + (G.hints === 1 ? " hint." : " hints.") : ", no hints."));
  }

  /* ── storage and loading ───────────────────────────── */
  function blank(n) { var h = [], v = []; for (var i = 0; i < n * n; i++) { h.push(0); v.push(0); } return { h: h, v: v }; }
  function present(c, saved) {
    clock.drop();

  function save() { if (G) C2.write(G.daily ? "day" : "free", G); }
  function loadDaily() {
    mode = "daily";
    var d = vkToday(), s = C2.read("day", null), w = WEEK[new Date().getDay()], seed = seedFor(SLUG, d);
    C2.setFrag("");
    generate(seed, w[0], w[1], w[2], function (c) { present(c, (s && s.date === d && s.seed === seed && Array.isArray(s.h) && s.h.length === c.n * c.n) ? s : null); });
  }
  function loadFree(seed) {
    mode = "free";
    var s = C2.read("free", null);
    if (seed === undefined) seed = (s && !s.done) ? s.seed : (Math.random() * 4294967296) >>> 0;
    C2.setFrag("k=" + seed.toString(36));
    generate(seed, FREE[0], FREE[1], FREE[2], function (c) { present(c, (s && s.seed === seed && Array.isArray(s.h) && s.h.length === c.n * c.n) ? s : null); });
  }
  function share() {
    if (!G || !G.done) return;
    var p = B.pearl.filter(function (x) { return x; }).length;
    var lines = ["Bight \u00b7 " + (G.daily ? vkPretty(G.date) : "free rope") + " \u00b7 " + B.n + "\u00d7" + B.n,
                 "Closed in " + vkClock(G.elapsed) + " \u00b7 " + p + " knots \u00b7 " + (G.hints ? G.hints + (G.hints === 1 ? " hint" : " hints") : "no hints")];
    if (G.daily && stats.streak > 1) lines.push("Streak " + stats.streak);
    var url = C2.link(G.daily ? "" : "k=" + B.seed.toString(36));
    lines.push(G.daily ? "Today\u2019s rope is the same for everyone." : "Same rope, your turn:");
    if (url) lines.push(url);
    C2.share(lines);
  }

  $("undo").addEventListener("click", undo);
  $("hint").addEventListener("click", hint);
  $("clear").addEventListener("click", function () {
    if (!G || G.done) return;
    var rec = [], n = B.n;
    for (var i = 0; i < n * n; i++) { if (G.h[i]) { rec.push([i, i + 1, 0]); G.h[i] = 0; } if (G.v[i]) { rec.push([i, i + n, 0]); G.v[i] = 0; } }
    if (rec.length) history.push(rec);
    draw(); save(); vkRead("Cleared.", "Undo puts it back.");
  });
  $("share").addEventListener("click", share);
  $("fresh").addEventListener("click", function () { C2.write("free", null); loadFree((Math.random() * 4294967296) >>> 0); });
  Array.prototype.forEach.call(document.querySelectorAll(".seg button"), function (b) {
    b.addEventListener("click", function () { if (b.dataset.mode === mode) return; clock.stop(); save(); if (b.dataset.mode === "daily") loadDaily(); else loadFree(); });
  });
  document.addEventListener("keydown", function (e) {
    if (rules.isOpen()) return;
    var k = e.key.toLowerCase();
    if ((e.ctrlKey || e.metaKey) && k === "z") { e.preventDefault(); undo(); }
    else if (k === "u") undo();
  });
  document.addEventListener("visibilitychange", function () { if (document.hidden) { clock.stop(); save(); } });
  function boot(o) {
    var f = (o && typeof o.frag === "string") ? o.frag : C2.frag();
    var m = /(?:^|\/)k=([0-9a-z]+)$/.exec(f || "");
    if (booted && !m) return;
    booted = true;
    if (m) { loadFree(parseInt(m[1], 36) >>> 0); if (o) vkToast("Someone sent you this rope. Same knots, one loop."); }
    else loadDaily();
  }
  C2.register({
    slug: SLUG, numeral: "V", name: "Bight",
    line: "One loop of rope through every square. Knots say where it bends.",
    mark: '<path d="M6 6h12v12H6z"/><circle cx="6" cy="6" r="2"/>',
    daily: true, mount: boot,
    suspend: function () { clock.stop(); save(); }
  });
  var rules = vkRules(C2);
  if (!vkEmbedded) boot(null);
  else setTimeout(function () { if (!booted) boot(null); }, 900);
})();

<\/script>
</body>

<script type="text/plain" id="vol-marquetry"><!DOCTYPE html>
<html lang="en-GB" data-theme="day">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Marquetry</title>
<style>
/* ==================================================================
   MARQUETRY — thirty veneers, one panel; set full lines and match the wood.
   §1  CANONICAL TOKEN BLOCK. Do not author local overrides.
   ================================================================== */
:root {
  --serif: "Didot", "Bodoni MT", "Playfair Display", Georgia, "Times New Roman", serif;
  --body: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --util: ui-monospace, "SF Mono", "Cascadia Mono", "Roboto Mono", Menlo, monospace;
  --tap: 52px;
  --gutter: 20px;
  --radius: 10px;
  --radius-pill: 999px;
  --radius-plate: 18px;
}
html[data-theme="day"] {
  --ground:#EFE8F8; --plate:#F8F4FD; --well:#E5DBF3;
  --ink:#241041; --ink-2:#6B5590; --hair:#7E64AC;
  --accent:#4A1D7A; --on-accent:#FFF8E9; --chip:#3A1A66; --gilt:#8E6110;
  --pip-hi:#8A72B4; --pip-lo:#180830; --pip-glow:rgba(255,255,255,.6);
  --field:
    radial-gradient(120% 90% at 50% -10%, #F5E8FF 0%, rgba(245,232,255,0) 60%),
    radial-gradient(90% 70% at 100% 110%, #FFEAD6 0%, rgba(255,234,214,0) 55%),
    linear-gradient(180deg,#F2EBFA 0%,#E7DEF3 100%);
  --h1-fill: linear-gradient(180deg,#2E1350,#7A3A9E 92%);
  --wash: rgba(74,29,122,.10); --veil: rgba(36,16,65,.55);
  --face:#FFFFFF;
  --face-ink:#180830;
  --sink: inset 1px 1px 3px rgba(36,16,65,.18), inset -1px -1px 1px rgba(255,255,255,.85);
  --raise: 0 1px 0 rgba(255,255,255,.7), 0 4px 14px rgba(36,16,65,.10);
  --ok-shadow: inset 1px 1px 3px rgba(36,16,65,.18), 0 0 18px -3px rgba(74,29,122,.50);
  --w-body:400; --w-disp:500;
}
html[data-theme="glare"] {
  --ground:#FFFFFF; --plate:#FFFFFF; --well:#FFFFFF;
  --ink:#000000; --ink-2:#000000; --hair:#000000;
  --accent:#000000; --on-accent:#FFFFFF; --chip:#000000; --gilt:#000000;
  --pip-hi:#000000; --pip-lo:#000000; --pip-glow:transparent;
  --field:#FFFFFF;
  --h1-fill: none;
  --wash: transparent; --veil: rgba(0,0,0,.65);
  --face:#FFFFFF;
  --face-ink:#000000;
  --sink: none; --raise: none; --ok-shadow: none;
  --w-body:600; --w-disp:700;
}
html[data-theme="night"] {
  --ground:#12071F; --plate:#241041; --well:#1B0A35;
  --ink:#F6F1FF; --ink-2:#B49BD8; --hair:rgba(240,195,92,.55);
  --accent:#F0C35C; --on-accent:#22093C; --chip:#F0C35C; --gilt:#F0C35C;
  --pip-hi:#FFF0C4; --pip-lo:#A76F14; --pip-glow:rgba(255,255,255,.10);
  --field:
    radial-gradient(120% 90% at 50% -10%, #4A1D7A 0%, rgba(74,29,122,0) 60%),
    radial-gradient(90% 70% at 100% 110%, #7A1D5E 0%, rgba(122,29,94,0) 55%),
    linear-gradient(180deg,#1B0B33 0%,#12071F 100%);
  --h1-fill: linear-gradient(180deg,#FFF8E9,#E7A9D8 90%);
  --wash: rgba(240,195,92,.13); --veil: rgba(18,7,32,.78);
  --face:#F2ECFF;
  --face-ink:#1B0A35;
  --sink: inset 1px 1px 3px rgba(0,0,0,.55), inset -1px -1px 1px rgba(255,255,255,.06);
  --raise: inset 0 1px 0 rgba(255,255,255,.10), 0 6px 20px rgba(0,0,0,.45);
  --ok-shadow: inset 1px 1px 3px rgba(0,0,0,.55), 0 0 22px -3px rgba(240,195,92,.60);
  --w-body:350; --w-disp:400;
}

/* §2  volume-local geometry only — no colour authored below this line */
:root{ --ease: cubic-bezier(.16,1,.3,1); }
[hidden]{display:none !important}
*{box-sizing:border-box}
html,body{height:100%; margin:0}
body{
  background:var(--ground); color:var(--ink);
  background-image:var(--field); background-attachment:fixed;
  font-family:var(--body); font-weight:var(--w-body);
  font-size:16px; line-height:1.45;
  -webkit-text-size-adjust:100%; -webkit-tap-highlight-color:transparent;
  overflow:hidden; overscroll-behavior:none;
}
.app{
  height:100vh; height:100dvh; max-width:520px; margin:0 auto;
  display:flex; flex-direction:column;
  padding:calc(env(safe-area-inset-top) + 4px) var(--gutter) 0;
}
/* ---------- counters ---------- */
.counters{flex:0 0 auto; display:flex; gap:7px; padding-bottom:12px}
.counter{
  flex:1; min-width:0; padding:8px 4px 9px; border-radius:var(--radius);
  background:var(--well); border:1px solid var(--hair); box-shadow:var(--sink);
  text-align:center;
}
.counter b{
  display:block; font-family:var(--util); font-size:1rem; font-weight:600;
  font-variant-numeric:tabular-nums; letter-spacing:-.03em; color:var(--ink);
  white-space:nowrap; overflow:hidden;
}
.counter span{display:block; font-size:.62rem; color:var(--ink-2); letter-spacing:.04em}
.counter.hot b{color:var(--gilt)}
/* ---------- the plate ---------- */
.plate{
  flex:0 0 auto; position:relative; padding:14px; margin-bottom:12px;
  background:var(--plate); border:1px solid var(--hair);
  border-radius:var(--radius-plate); box-shadow:var(--raise);
}
.boardwrap{
  position:relative; user-select:none; -webkit-user-select:none;
  container-type:inline-size;
  /* the board is square, so capping its width caps its height. --chrome is
     everything stacked above and below it in the current layout. */
  --chrome:330px;
  width:100%;
  width:max(200px, min(100%, calc(100vh - var(--chrome))));
  width:max(200px, min(100%, calc(100dvh - var(--chrome))));
  margin-inline:auto;
}
button:focus-visible{outline:2px solid var(--gilt); outline-offset:3px}
button:focus:not(:focus-visible){outline:none}
/* ---------- readout ---------- */
.read{
  min-height:3.2em; margin:12px 0 2px; text-align:center;
  font-size:.86rem; color:var(--ink-2);
}
.read b{
  display:inline-block; font-family:var(--serif); font-weight:var(--w-disp);
  font-size:1.4rem; letter-spacing:.02em; color:var(--ink); margin-right:.35em;
}
html[data-display="fallback"] .read b{font-weight:700}
.read .sub{display:block; font-size:.82rem}
/* ---------- pills ---------- */
.controls{display:flex; gap:9px; padding-top:10px}
.btn{
  flex:1; min-height:var(--tap); font:inherit; font-size:.9rem; cursor:pointer;
  padding:0 8px; border-radius:var(--radius-pill);
  background:var(--plate); color:var(--ink-2);
  border:1px solid var(--hair); box-shadow:var(--raise);
  transition:transform .12s ease, color .2s, border-color .2s;
}
.btn:hover{color:var(--ink); border-color:var(--gilt)}
.btn:active{transform:translateY(1.5px)}
.btn[disabled]{opacity:.4; cursor:default}
.btn.go{font-weight:600; background:var(--accent); border-color:var(--accent); color:var(--on-accent)}
html[data-theme="glare"] .btn.go{border-width:3px}
/* ---------- strip ---------- */
.strip{
  flex:1 1 auto; min-height:0; overflow-y:auto; overscroll-behavior:contain;
  padding:6px 0 14px; scrollbar-width:thin;
}
.strip::-webkit-scrollbar{width:3px}
.strip::-webkit-scrollbar-thumb{background:var(--hair); border-radius:3px}
.strip-head{display:flex; align-items:center; gap:8px; padding-bottom:10px}
.strip-head p{margin:0; flex:1; min-width:0; font-size:.8rem; color:var(--ink-2)}
.strip-head p strong{color:var(--ink)}
.chip{
  flex:0 0 auto; font:inherit; font-size:.76rem; padding:9px 13px; cursor:pointer;
  border-radius:var(--radius-pill); white-space:nowrap;
  background:var(--plate); color:var(--gilt);
  border:1px solid var(--hair); box-shadow:var(--raise);
}
.chip:hover{border-color:var(--gilt)}
.chip[disabled]{opacity:.4; cursor:default}
.rows{display:flex; flex-direction:column; gap:7px}
.row{
  display:flex; align-items:baseline; gap:10px; padding:9px 12px;
  border-radius:var(--radius); background:var(--well);
  border:1px solid var(--hair); box-shadow:var(--sink);
  font-size:.8rem; color:var(--ink-2);
}
.row b{font-family:var(--util); font-size:.9rem; color:var(--ink); font-variant-numeric:tabular-nums}
.row .grow{flex:1}
.row.crown{border-color:var(--gilt)}
.row.crown b{color:var(--gilt)}
/* ---------- footer ---------- */
footer{
  flex:0 0 auto; display:flex; gap:9px; align-items:center;
  padding:11px 0 calc(env(safe-area-inset-bottom) + 12px);
  border-top:1px solid var(--hair);
}
.seg{
  flex:1; display:flex; gap:5px; padding:4px; border-radius:var(--radius-pill);
  background:var(--well); border:1px solid var(--hair); box-shadow:var(--sink);
}
.seg button{
  flex:1; font:inherit; font-size:.8rem; min-height:40px; padding:0 2px; cursor:pointer;
  border:0; border-radius:var(--radius-pill); background:none; color:var(--ink-2);
  transition:background .3s var(--ease), color .3s var(--ease);
}
.seg button[aria-pressed="true"]{background:var(--accent); color:var(--on-accent); font-weight:600}
.wa{
  flex:0 0 auto; min-height:var(--tap); padding:0 15px; cursor:pointer;
  display:flex; align-items:center; gap:8px;
  font:inherit; font-size:.82rem; border-radius:var(--radius-pill);
  background:var(--plate); color:var(--gilt);
  border:1px solid var(--hair); box-shadow:var(--raise);
}
.wa svg{width:17px; height:17px; fill:none; stroke:currentColor;
  stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round}
.wa[disabled]{opacity:.4; cursor:default}
/* ---------- toast ---------- */
.toast{
  position:fixed; left:50%; z-index:60;
  bottom:calc(env(safe-area-inset-bottom) + 84px);
  transform:translate(-50%,16px) scale(.97);
  max-width:84vw; padding:12px 18px; text-align:center;
  border-radius:var(--radius-plate);
  background:var(--plate); color:var(--ink);
  border:1px solid var(--hair); box-shadow:var(--raise);
  font-size:.84rem; opacity:0; pointer-events:none;
  transition:opacity .3s var(--ease), transform .42s var(--ease);
}
.toast b{font-family:var(--serif); font-weight:var(--w-disp); color:var(--gilt)}
.toast.up{opacity:1; transform:translate(-50%,0) scale(1)}
.sr-only{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:.01ms !important; animation-iteration-count:1 !important;
    transition-duration:.01ms !important}
}

/* ---------- rules sheet ----------
   Rules live in a sheet over the board, not in the scrolling strip, so they
   can always be read in full: bottom sheet on a phone, centred card on a
   tablet or computer. Opens itself the first time a volume is played. */
.rulesbtn{display:inline-flex; align-items:center; gap:6px}
.rulesbtn svg{width:15px; height:15px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round}
.rules{
  position:fixed; inset:0; z-index:80; display:flex; align-items:flex-end; justify-content:center;
  background:var(--veil);
}
.rules-card{
  width:100%; max-width:640px; max-height:92vh; max-height:92dvh; overflow-y:auto; overscroll-behavior:contain;
  background:var(--plate); color:var(--ink); border:1px solid var(--hair); box-shadow:var(--raise);
  border-radius:var(--radius-plate) var(--radius-plate) 0 0;
  padding:22px var(--gutter) calc(env(safe-area-inset-bottom) + 18px);
  animation:rise .32s var(--ease);
}
@keyframes rise{from{transform:translateY(40px); opacity:0} to{transform:none; opacity:1}}
.rules-card h2{
  margin:0 0 4px; font-family:var(--serif); font-weight:var(--w-disp); font-size:1.6rem; line-height:1.15;
}
.rules-card .lede{margin:0 0 16px; color:var(--ink-2); font-size:1rem}
.rules-body{font-size:1.02rem; line-height:1.6}
.rules-body p{margin:0 0 12px}
.rules-body ol{margin:0 0 14px; padding-left:1.3em}
.rules-body li{margin-bottom:8px}
.rules-body b{font-weight:700}
.rules-body .key{display:grid; grid-template-columns:52px 1fr; gap:10px 14px; align-items:center; margin:6px 0 16px}
.rules-body .key > span{font-size:.98rem}
.rules-card .btn{width:100%; margin-top:8px}
html[data-theme="glare"] .rules-body, html[data-theme="glare"] .rules-card .lede{font-weight:600}

/* ---------- layouts ----------
   Phone portrait: one column, board as large as the height allows.
   Tablet portrait: one wider column, larger type.
   Landscape tablet and computer: board on the left, everything else beside it. */
@media (min-width:700px) and (orientation:portrait){
  html{font-size:17px}
  .app{max-width:680px}
  .boardwrap{--chrome:380px}
  .counter b{font-size:1.15rem}
  .counter span{font-size:.7rem}
}
@media (min-width:700px) and (orientation:landscape), (min-width:1000px){
  html{font-size:17px}
  .app{
    max-width:1180px; display:grid; column-gap:28px;
    grid-template-columns:minmax(0,1fr) minmax(300px,380px);
    grid-template-rows:auto minmax(0,1fr) auto;
    padding-top:calc(env(safe-area-inset-top) + 14px);
  }
  .plate{grid-column:1; grid-row:1 / 4; align-self:start; justify-self:center; width:100%;
    max-width:min(760px, calc(100vh - 200px)); max-width:min(760px, calc(100dvh - 200px))}
  .boardwrap{--chrome:230px}
  .counters{grid-column:2; grid-row:1}
  .strip{grid-column:2; grid-row:2}
  footer{grid-column:2; grid-row:3}
  .counter b{font-size:1.15rem}
  .counter span{font-size:.7rem}
  .toast{bottom:36px}
  .rules{align-items:center; padding:24px}
  .rules-card{border-radius:var(--radius-plate); padding-bottom:22px}
}
/* a squat window: trim the chrome so the board keeps its size */
@media (max-height:640px) and (orientation:portrait){
  :root{--tap:44px}
  .counters{padding-bottom:6px}
  .counter{padding:5px 4px 6px}
  .read{min-height:2.4em; margin:8px 0 0}
  .read b{font-size:1.15rem}
  .plate{padding:10px}
  .boardwrap{--chrome:280px}
}
@media (max-height:520px) and (orientation:landscape){
  .boardwrap{--chrome:170px}
  .read{min-height:2.2em; margin:6px 0 0}
  .plate{padding:10px}
}


/* ---------- the panel ---------- */
#panel{display:grid; grid-template-columns:repeat(7,1fr); gap:4px; aspect-ratio:1; touch-action:none; cursor:pointer}
.sq{border-radius:5px; background:var(--well); border:1px solid var(--hair); box-shadow:var(--sink); transition:transform .16s var(--ease)}
/* three woods that part without colour: hatched oak, solid walnut, dotted maple */
.w0{background-color:var(--face); background-image:repeating-linear-gradient(135deg, var(--hair) 0 2px, transparent 2px 8px); border-color:var(--ink-2); box-shadow:var(--raise)}
.w1{background-color:var(--accent); background-image:none; border-color:var(--accent); box-shadow:var(--raise)}
.w2{background-color:var(--face); background-image:radial-gradient(circle, var(--gilt) 0 18%, transparent 21%); background-size:50% 50%; border-color:var(--gilt); box-shadow:var(--raise)}
html[data-theme="glare"] .w0, html[data-theme="glare"] .w2{border-width:2px}
.sq.ghost{opacity:.62; outline:2.5px dashed var(--gilt); outline-offset:-3px}
.sq.ghost.bad{opacity:1; background:var(--wash); background-image:repeating-linear-gradient(45deg, var(--ink-2) 0 1.5px, transparent 1.5px 6px); outline-color:var(--ink-2)}
.sq.set{transform:scale(.82); outline:3px solid var(--gilt); outline-offset:-2px}
.tray{display:flex; align-items:center; gap:12px; margin-top:12px; padding:10px 12px; border-radius:var(--radius);
  background:var(--well); border:1px solid var(--hair); box-shadow:var(--sink); min-height:86px}
.tray .now{display:flex; align-items:center; gap:10px; flex:1; min-width:0}
.tray .next{display:flex; align-items:center; gap:8px; opacity:.75}
.tray .lab{font-size:.7rem; color:var(--ink-2); margin-right:2px}
.mini{display:grid; gap:2px}
.mini i{border-radius:3px; display:block}
.mini.big{height:62px}
.mini.small{height:30px}
.woodname{font-family:var(--serif); font-weight:var(--w-disp); font-size:1.15rem; text-transform:capitalize}
.trayword{font-size:.9rem; color:var(--ink-2)}
.controls .btn{flex:1}
.rules-body .woods{display:grid; grid-template-columns:44px 1fr; gap:10px 12px; align-items:center; margin:6px 0 14px}
.rules-body .woods i{display:block; width:44px; height:44px; border-radius:6px; border:1px solid var(--hair)}
@media (min-width:700px) and (orientation:landscape), (min-width:1000px){
  .boardwrap{--chrome:330px}
}

</style>
</head>
<body>
<div class="app">
  <div class="counters">
    <div class="counter" id="cScoreBox"><b id="cScore">0</b><span>points</span></div>
    <div class="counter" id="cLinesBox"><b id="cLines">0</b><span>lines</span></div>
    <div class="counter" id="cMatchBox"><b id="cMatch">0</b><span>matched</span></div>
    <div class="counter" id="cLeftBox"><b id="cLeft">30</b><span>pieces left</span></div>
  </div>
  <section class="plate" id="plate">
    <div class="boardwrap"><div id="panel" role="grid" aria-label="The panel, seven by seven"></div></div>
    <div class="tray" aria-live="polite">
      <div class="now" id="now"></div>
      <div class="next"><span class="lab">next</span><span id="next" style="display:flex;gap:8px;align-items:center"></span></div>
    </div>
    <p class="read" id="read" aria-live="polite"></p>
    <div class="controls">
      <button class="btn" id="turn">Rotate</button>
      <button class="btn go" id="lay" disabled>Lay</button>
      <button class="btn go" id="again" hidden>Lay again</button>
    </div>
  </section>
  <section class="strip">
    <div class="strip-head">
      <p id="standing"></p>
      <button class="chip rulesbtn" id="rulesBtn"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.3a2.5 2.5 0 0 1 4.8.9c0 1.7-2.4 2.1-2.4 3.6M12 17h.01"/></svg>How to play</button>
      <button class="chip" id="fresh" hidden>New deal</button>
    </div>
    <div class="rows" id="rows"></div>
  </section>
  <footer>
    <div class="seg" role="group" aria-label="Which board">
      <button data-mode="daily" aria-pressed="true">Today</button>
      <button data-mode="free" aria-pressed="false">Free</button>
    </div>
    <button class="wa" id="share" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 8.9 8.9 0 0 1-3.8-.8L3 20.5l1.4-4.1A8.4 8.4 0 0 1 12 3.1a8.4 8.4 0 0 1 9 8.4z"/><path d="M8.8 9.2c0 3 2.2 5.2 5.2 5.2"/></svg> WhatsApp</button>
  </footer>
</div>
<div class="rules" id="rules" role="dialog" aria-modal="true" aria-labelledby="rulesTitle" hidden>
  <div class="rules-card">
    <h2 id="rulesTitle">How to play Marquetry</h2>
    <p class="lede">Thirty veneers, one panel. Set full lines; match the wood.</p>
    <div class="rules-body">
      <p>You get <b>thirty veneer pieces</b>, one at a time, and a 7 by 7 panel. Lay them to score.</p>
      <ol>
        <li><b>Tap</b> the panel to place the current piece. A ghost shows where it would go.</li>
        <li><b>Tap the ghost again</b>, or press <b>Lay</b>, to glue it down. Tap elsewhere to move it.</li>
        <li><b>Rotate</b> turns the piece. The next two pieces are shown beside it.</li>
        <li>Fill a whole <b>row or column</b> and it sets: it scores and clears, making room.</li>
      </ol>
      <p><b>The woods</b></p>
      <div class="woods">
        <i class="w0"></i><span><b>Oak</b>: hatched.</span>
        <i class="w1"></i><span><b>Walnut</b>: solid.</span>
        <i class="w2"></i><span><b>Maple</b>: dotted.</span>
      </div>
      <p><b>Scoring.</b> One point for every square laid. A set line scores 10, or <b>30 if it is all one wood</b>. Setting several lines with one piece multiplies them: two lines score double, three triple. Clearing the whole panel adds 100.</p>
      <p>The game ends after thirty pieces, or sooner if the next piece has nowhere to go.</p>
      <p>Everyone gets the same deal each day. <b>Your first finished run is your score for the day</b>; you can play again to practise, but the first run is the one you share.</p>
    </div>
    <button class="btn go" id="rulesClose">Got it</button>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

/* Contract §7 — seeded randomness. Canonical. A daily board must be identical
   on every device, so the seed comes from the slug and the date, never from
   Math.random. */
function seedFor(slug, date) {

  return h >>> 0;

var M_SHAPES = [
  { id: "D2", w: 3, cells: [[0,0],[0,1]] },

(function () {
