}

function ornamentArt(){
  let s = "";
  s += '<rect x="7" y="7" width="86" height="86" rx="7" fill="none" stroke="#E8B84B" stroke-opacity=".55" stroke-width="1.5"/>';
  s += '<rect x="13" y="13" width="74" height="74" rx="5" fill="none" stroke="#E8B84B" stroke-opacity=".25" stroke-width=".8"/>';
  s += '<polygon points="'+poly(4,33)+'" fill="none" stroke="#E8B84B" stroke-opacity=".5" stroke-width="1.1"/>';
  s += '<polygon points="'+poly(4,33,50,50,-45)+'" fill="none" stroke="#E8B84B" stroke-opacity=".5" stroke-width="1.1"/>';
  s += '<circle cx="50" cy="50" r="24" fill="none" stroke="#E8B84B" stroke-opacity=".3" stroke-width=".8"/>';
  [[20,20,0],[80,20,90],[80,80,180],[20,80,270]].forEach(function(p){
    s += '<path d="M0 7 Q0 0 7 0" fill="none" stroke="#E8B84B" stroke-opacity=".6" stroke-width="1.4" transform="translate('+p[0]+' '+p[1]+') rotate('+p[2]+')"/>';
  });
  s += '<polygon points="'+poly(4,12)+'" fill="#E8B84B" fill-opacity=".85"/>';
  s += '<polygon points="'+poly(4,12,50,50,-45)+'" fill="#E8B84B" fill-opacity=".4"/>';
  s += '<circle cx="50" cy="50" r="4" fill="#1B0A35"/>';
  return s;
}

/* ---------------- sound ---------------- */

const Sound = (function(){
  let ctx = null;
  const muted = () => !C2.sound();

  function ac(){
    if (!ctx){
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      ctx = new AC();
    }
    if (ctx.state === "suspended") ctx.resume();
    return ctx;
  }

  function note(freq, start, dur, opts){
    const c = ac(); if (!c) return;
    opts = opts || {};
    const t0 = c.currentTime + start;
    const osc = c.createOscillator(), gain = c.createGain();
    osc.type = opts.type || "sine";
    osc.frequency.setValueAtTime(freq, t0);
    if (opts.to) osc.frequency.exponentialRampToValueAtTime(opts.to, t0 + dur);
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(opts.gain || 0.07, t0 + 0.012);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(gain); gain.connect(c.destination);
    osc.start(t0); osc.stop(t0 + dur + 0.02);
  }

  const play = {
    flip:   () => note(760, 0, 0.09, { type:"triangle", to:520, gain:0.05 }),
    match:  () => { note(659,0,0.16,{gain:0.07}); note(988,0.07,0.24,{gain:0.055}); },
    miss:   () => { note(196,0,0.16,{type:"triangle",gain:0.06}); note(185,0.05,0.2,{type:"triangle",gain:0.05}); },
    win:    () => { [523,659,784,1047,1319].forEach((f,k)=>note(f,k*0.1,0.5,{gain:0.06})); note(262,0,1.2,{type:"triangle",gain:0.03}); },
    deal:   () => { for(let k=0;k<4;k++) note(420+k*90, k*0.05, 0.08, {type:"triangle",gain:0.035}); },
    toggle: () => note(440, 0, 0.12, { type:"triangle", gain:0.045 })
  };

  return {
    fire(name){
      if (muted) return;
      if (!ctx && (name === "deal" || name === "toggle")) return;
      const f = play[name]; if (f) try { f(); } catch(e){}
    },
    get muted(){ return muted(); },
    warm(){ if (!muted) ac(); }
  };
})();

/* ---------------- state ---------------- */

const el = id => document.getElementById(id);
const board = el("board");

let deckId = "bloom", sizeN = 4;
let cards = [], nodes = new Map();
let flipped = [], matched = new Set();
let moves = 0, hits = 0;
let startedAt = null, elapsed = 0, won = false, paused = false;
let pending = null, tick = null;
let peekOn = false, peeking = false, peekTimers = [];
let seed = 0, pendingSeed = null, challenge = null;

/* A board is fully described by deck + size + peek + shuffle seed, so a short
   code in the URL hash lets two people play the identical deal.
   #g=<deckIndex><size><peek>-<seed36>[-<seconds36>-<moves36>]                */
function readChallenge(frag){
  const m = /g=([0-4])([456])([01])-([0-9a-z]+)(?:-([0-9a-z]+)-([0-9a-z]+))?/i.exec(frag || "");
  if (!m) return null;
  const c = {
    deck: DECKS[+m[1]].id,
    size: +m[2],
    peek: m[3] === "1",
    seed: parseInt(m[4], 36) >>> 0,
    time: m[5] ? parseInt(m[5], 36) * 1000 : null,
    moves: m[6] ? parseInt(m[6], 36) : null
  };
  return isNaN(c.seed) ? null : c;
}

function boardCode(withResult){
  const d = DECKS.findIndex(x => x.id === deckId);
  let code = "g=" + d + sizeN + (peekOn ? "1" : "0") + "-" + seed.toString(36);
  if (withResult) code += "-" + Math.floor(elapsed/1000).toString(36) + "-" + moves.toString(36);
  return code;
}

function boardLink(withResult){
  return C2.link(boardCode(withResult)) || null;
}

let best = C2.read("best", {}) || {};
const saved = C2.read("prefs", {}) || {};
if (saved.deck && DECKS.some(d => d.id === saved.deck)) deckId = saved.deck;
if (saved.size && SIZES.some(s => s.n === saved.size)) sizeN = saved.size;
if (typeof saved.peek === "boolean") peekOn = saved.peek;

challenge = readChallenge(C2.frag());
if (challenge){
  deckId = challenge.deck;
  sizeN  = challenge.size;
  peekOn = challenge.peek;
  pendingSeed = challenge.seed;   // consumed by the first newGame()
}

const sizeInfo = () => SIZES.find(s => s.n === sizeN);
const deckInfo = () => DECKS.find(d => d.id === deckId);
const bestKey  = () => deckId + ":" + sizeN + (peekOn ? ":peek" : "");

const clock = ms => {
  const s = Math.floor(ms/1000);
  return String(Math.floor(s/60)).padStart(2,"0") + ":" + String(s%60).padStart(2,"0");
};

const savePrefs = () => {
  C2.write("prefs", {deck:deckId, size:sizeN, peek:peekOn});
};

const say = msg => { el("say").textContent = msg; };

/* a queued flip-back or match settle, resolvable early by the next tap */
function schedule(fn, ms){
  pending = { fn: fn, id: setTimeout(() => { pending = null; fn(); }, ms) };
}
function resolveNow(){
  if (!pending) return;
  clearTimeout(pending.id);
  const fn = pending.fn;
  pending = null;
  fn();
}

/* ---------------- board fitting ---------------- */

let fitQueued = false;
function fitBoard(){
  fitQueued = false;
  const info = sizeInfo();
  const stage = document.querySelector(".stage");
  const avail = stage.clientWidth;
  if (!avail) return;

  const gaps = info.gap * (info.n - 1);
  const byWidth = (avail - gaps) / info.n;

  // vertical room left below the board's top edge
  const top = board.getBoundingClientRect().top;
  const bottomPad = parseFloat(getComputedStyle(document.body).paddingBottom) || 18;
  const room = window.innerHeight - top - bottomPad;
  // cards are 3:4, so cell height = cell width x 4/3
  const byHeight = room > 120 ? ((room - gaps) / info.n) * 0.75 : Infinity;

  const cell = Math.min(MAX_CELL, Math.max(MIN_CELL, Math.min(byWidth, byHeight)));
  board.style.width = Math.floor(cell * info.n + gaps) + "px";
}
function queueFit(){
  if (fitQueued) return;
  fitQueued = true;
  requestAnimationFrame(fitBoard);
}

/* ---------------- build & render ---------------- */

function buildDeck(){
  const info = sizeInfo();
  const rnd = rngFrom(seed);
  const list = [];
  for (let i=0;i<info.pairs;i++) list.push({uid:i+"a", i:i}, {uid:i+"b", i:i});
  for (let k=list.length-1;k>0;k--){
    const j = Math.floor(rnd()*(k+1));
    const t = list[k]; list[k] = list[j]; list[j] = t;
  }
  if (info.ornament) list.splice(Math.floor(info.cards/2), 0, {uid:"medallion", ornament:true});
  return list;
}

function renderBoard(){
  const info = sizeInfo();
  document.documentElement.style.setProperty("--gap", info.gap + "px");
  board.style.gridTemplateColumns = "repeat(" + info.n + ", 1fr)";
  const backSvg = svgWrap(backArt());
  board.innerHTML = cards.map((c, idx) => {
    // diagonal sweep: cards nearer the top-left turn first
    const d = (Math.floor(idx / info.n) + (idx % info.n)) * 22;
    if (c.ornament)
      return '<div class="ornament" role="presentation">'+svgWrap(ornamentArt())+'</div>';
    return '<button class="scene" data-uid="'+c.uid+'" aria-label="Face-down card">'
      + '<span class="card" style="--d:'+d+'ms">'
      + '<span class="face back">'+backSvg+'</span>'
      + '<span class="face front">'+svgWrap(faceArt(deckId, c.i))+'</span>'
      + '</span></button>';
  }).join("");

  nodes.clear();
  board.querySelectorAll(".scene").forEach(n => nodes.set(n.dataset.uid, n));
  queueFit();
}

/* touch only the card that changed */
function paintCard(c){
  const node = nodes.get(c.uid);
  if (!node) return;
  const isMatched = matched.has(c.uid);
  const up = isMatched || flipped.indexOf(c.uid) > -1;
  node.firstElementChild.classList.toggle("flipped", up);
  node.classList.toggle("matched", isMatched);
  node.disabled = isMatched || won || paused || peeking;
  node.setAttribute("aria-label", up
    ? deckInfo().name + " " + (c.i + 1) + (isMatched ? ", matched" : "")
    : "Face-down card");
}
function paintCards(){ cards.forEach(c => { if (!c.ornament) paintCard(c); }); }

function paintStats(){
  const info = sizeInfo();
  el("time").textContent = clock(elapsed);
  el("moves").textContent = String(moves).padStart(2,"0");
  el("found").innerHTML = (matched.size/2) + "<i>/" + info.pairs + "</i>";
  el("note").textContent = deckInfo().blurb + " — complexity " + deckInfo().complexity + " of 5.";
  el("pause").disabled = startedAt === null || won || peeking;
  el("peekToggle").classList.toggle("on", peekOn);
  el("peekToggle").setAttribute("aria-pressed", String(peekOn));
}

function renderChips(){
  el("sizes").innerHTML = SIZES.map(s =>
    '<button class="size'+(s.n===sizeN?" on":"")+'" data-size="'+s.n+'" aria-pressed="'+(s.n===sizeN)+'">'
    + s.label + '<small>' + s.pairs + ' pairs</small></button>'
  ).join("");

  el("decks").innerHTML = DECKS.map(d =>
    '<button class="chip'+(d.id===deckId?" on":"")+'" data-deck="'+d.id+'" aria-pressed="'+(d.id===deckId)+'">'
    + '<span class="chip-art">'+svgWrap(faceArt(d.id, d.id==="facet"?4:2))+'</span>'
    + '<span class="chip-name">'+d.name+'</span>'
    + '<span class="pips" aria-label="complexity '+d.complexity+' of 5">'
    + [1,2,3,4,5].map(p => '<i class="'+(p<=d.complexity?"on":"")+'"></i>').join("")
    + '</span></button>'
  ).join("");
}

/* ---------------- opening peek ---------------- */

function clearPeek(){
  peekTimers.forEach(clearTimeout);
  peekTimers = [];
  peeking = false;
  board.classList.remove("peek", "peekout");
  el("peekbar").hidden = true;
  el("peekbar").firstElementChild.style.transition = "none";
  el("peekbar").firstElementChild.style.transform = "scaleX(1)";
}

function runPeek(){
  const info = sizeInfo();
  const hold = 1100 + info.pairs * 95;              // 8 pairs ≈ 1.9s, 18 pairs ≈ 2.8s
  const sweep = (info.n - 1) * 2 * 22 + 500;        // last card to finish turning
  peeking = true;
  paintCards();                                     // locks the board while it runs

  const bar = el("peekbar"), fill = bar.firstElementChild;
  bar.hidden = false;
  fill.style.transition = "none";
  fill.style.transform = "scaleX(1)";

  board.classList.add("peek");
  peekTimers.push(setTimeout(() => {
    fill.style.transition = "transform " + hold + "ms linear";
    fill.style.transform = "scaleX(0)";
  }, 30));

  peekTimers.push(setTimeout(endPeek, hold + sweep));
  paintStats();
}

function endPeek(){
  if (!peeking) return;
  peekTimers.forEach(clearTimeout);
  peekTimers = [];
  const sweep = (sizeInfo().n - 1) * 2 * 22 + 520;
  el("peekbar").hidden = true;
  board.classList.remove("peek");
  board.classList.add("peekout");
  Sound.fire("toggle");
  peekTimers.push(setTimeout(() => {
    board.classList.remove("peekout");
    peeking = false;
    paintCards();
    paintStats();
  }, sweep));
}

/* ---------------- game flow ---------------- */

function newGame(){
  if (pending) { clearTimeout(pending.id); pending = null; }
  if (tick) { clearInterval(tick); tick = null; }
  clearPeek();

  if (pendingSeed !== null){
    seed = pendingSeed;              // playing someone else's board
    pendingSeed = null;
  } else {
    seed = (Math.random() * 4294967296) >>> 0;
    challenge = null;                // a fresh deal ends any challenge
  }
  cards = buildDeck();
  flipped = []; matched = new Set();
  moves = 0; hits = 0; elapsed = 0; startedAt = null;
  won = false; paused = false;
  el("win").hidden = true;
  el("veil").hidden = true;
  el("pause").innerHTML = ICON_PAUSE;
  el("pause").setAttribute("aria-label", "Pause game");
  renderChips();
  renderBoard();
  paintCards();
  paintStats();
  paintChallenge();
  Sound.fire("deal");
  syncUrl();
  if (peekOn) runPeek();
}

/* the address bar always describes the board on screen, so a refresh
   (or a copied URL) replays exactly what you're looking at */
function syncUrl(){
  /* The shell owns the address bar; an srcdoc frame cannot change it. */
  C2.setFrag(boardCode(false));
}

const target = () => (challenge && challenge.time && challenge.seed === seed) ? challenge : null;

function paintChallenge(){
  const t = target();
  const n = el("chal");
  n.hidden = !t;
  if (t) n.innerHTML = ICON_FLAG
    + '<span><b>A friend\u2019s board</b>Beat ' + clock(t.time) + ' in ' + t.moves + ' moves</span>';
}

function startTimer(){
  startedAt = Date.now() - elapsed;
  if (tick) clearInterval(tick);
  tick = setInterval(() => {
    if (won || paused) return;
    elapsed = Date.now() - startedAt;
    el("time").textContent = clock(elapsed);
  }, 200);
}

function setPaused(on){
  if (won || peeking || startedAt === null || on === paused) return;
  paused = on;
  if (paused){
    if (tick) { clearInterval(tick); tick = null; }
    elapsed = Date.now() - startedAt;
  } else {
    startTimer();
  }
  el("veil").hidden = !paused;
  el("pause").innerHTML = paused ? ICON_PLAY : ICON_PAUSE;
  el("pause").setAttribute("aria-label", paused ? "Resume game" : "Pause game");
  paintCards();
  paintStats();
  Sound.fire("toggle");
}

function onFlip(uid){
  if (won || paused || peeking) return;
  resolveNow();                       // a third tap settles the previous turn at once

  const card = cards.find(c => c.uid === uid);
  if (!card || matched.has(uid) || flipped.indexOf(uid) > -1) return;

  Sound.warm();
  if (startedAt === null) { startTimer(); paintStats(); }
  Sound.fire("flip");

  flipped.push(uid);
  paintCard(card);
  if (flipped.length < 2) return;

  moves++;
  const a = cards.find(c => c.uid === flipped[0]);
  const b = cards.find(c => c.uid === flipped[1]);

  if (a.i === b.i){
    hits++;
    Sound.fire("match");
    schedule(() => {
      matched.add(a.uid); matched.add(b.uid);
      flipped = [];
      paintCard(a); paintCard(b);
      paintStats();
      say("Match. " + (matched.size/2) + " of " + sizeInfo().pairs + " found.");
      if (matched.size === sizeInfo().pairs * 2) finish();
    }, 460);
  } else {
    Sound.fire("miss");
    [a,b].forEach(c => {
      const n = nodes.get(c.uid);
      if (n){ n.classList.add("wrong"); setTimeout(() => n.classList.remove("wrong"), 420); }
    });
    schedule(() => {
      flipped = [];
      paintCard(a); paintCard(b);
    }, 900);
  }
  paintStats();
}

function finish(){
  won = true;
  if (tick) { clearInterval(tick); tick = null; }
  elapsed = startedAt ? Date.now() - startedAt : 0;
  Sound.fire("win");

  const acc = moves ? Math.round(hits / moves * 100) : 100;
  const key = bestKey(), prev = best[key];
  const better = !prev || elapsed < prev.time || (elapsed === prev.time && moves < prev.moves);
  if (better){
    best[key] = { time: elapsed, moves: moves };
    C2.write("best", best);
  }

  el("seal").innerHTML = svgWrap(faceArt(deckId, 0));
  el("wTime").textContent  = clock(elapsed);
  el("wMoves").textContent = moves;
  el("wAcc").textContent   = acc + "%";
  const t = target();
  if (t){
    const diff = t.time - elapsed;
    const gap = Math.abs(Math.round(diff/1000));
    const pretty = gap >= 60 ? Math.floor(gap/60) + "m " + (gap % 60) + "s" : gap + "s";
    el("winBest").textContent = diff > 0
      ? "You beat their board by " + pretty + "."
      : (diff === 0 ? "Dead level with their time." : pretty + " short of their " + clock(t.time) + ".");
  } else {
    el("winBest").textContent = better
      ? "New best on " + deckInfo().name + " " + sizeInfo().label + (peekOn ? " with peek." : ".")
      : "Best here: " + clock(best[key].time) + " in " + best[key].moves + " moves";
  }
  el("shared").hidden = true;
  el("shared").textContent = "";
  el("win").hidden = false;
  paintCards();
  paintStats();
  say("Round complete in " + clock(elapsed) + " and " + moves + " moves.");
  el("again").focus();
}

/* ---------------- icons ---------------- */

const SVGATTR = 'viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"';
const ICON_ON    = '<svg '+SVGATTR+'><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>';
const ICON_OFF   = '<svg '+SVGATTR+'><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="22" y1="9" x2="16" y2="15"/><line x1="16" y1="9" x2="22" y2="15"/></svg>';
const ICON_PAUSE = '<svg '+SVGATTR+'><line x1="9" y1="4" x2="9" y2="20"/><line x1="15" y1="4" x2="15" y2="20"/></svg>';
const ICON_PLAY  = '<svg '+SVGATTR+'><polygon points="7 4 20 12 7 20 7 4"/></svg>';
const ICON_FLAG  = '<svg '+SVGATTR+'><path d="M4 21V4"/><path d="M4 4h11l-1.5 3.5L15 11H4"/></svg>';
const ICON_CHAT  = '<svg '+SVGATTR+'><path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 8.9 8.9 0 0 1-3.8-.8L3 20.5l1.4-4.1A8.4 8.4 0 0 1 12 3.1a8.4 8.4 0 0 1 9 8.4z"/><path d="M8.8 9.2c0 3 2.2 5.2 5.2 5.2"/></svg>';


/* ---------------- sharing ---------------- */

function shareLines(){
  const acc = moves ? Math.round(hits / moves * 100) : 100;
  const link = boardLink(true);
  const lines = [
    "Mirrorwork — " + sizeInfo().label + ", " + deckInfo().name + " deck"
      + (peekOn ? " (with peek)" : ""),
    clock(elapsed) + " · " + moves + " moves · " + acc + "% accuracy",
    link ? "Same cards, same shuffle — your turn:" : "Think you can beat that?"
  ];
  if (link) lines.push(link);
  return lines;
}

function shareResult(){
  C2.share(shareLines());
  note("");
  function note(msg){
    const n = el("shared");
    n.textContent = msg;
    n.hidden = !msg;
  }
}

/* ---------------- input ---------------- */

board.addEventListener("click", e => {
  if (peeking) { endPeek(); return; }          // tap anywhere to start early
  const btn = e.target.closest(".scene");
  if (btn) onFlip(btn.dataset.uid);
});

board.addEventListener("keydown", e => {
  const info = sizeInfo();
  const step = { ArrowRight:1, ArrowLeft:-1, ArrowDown:info.n, ArrowUp:-info.n }[e.key];
  if (step === undefined) return;
  const kids = Array.from(board.children);
  const active = document.activeElement.closest ? document.activeElement.closest(".scene") : null;
  const here = kids.indexOf(active);
  if (here < 0) return;
  e.preventDefault();
  let t = here + step;
  while (t >= 0 && t < kids.length && !(kids[t].matches(".scene") && !kids[t].disabled)) t += step;
  if (t >= 0 && t < kids.length) kids[t].focus();
});

el("sizes").addEventListener("click", e => {
  const btn = e.target.closest(".size");
  if (btn){ sizeN = Number(btn.dataset.size); savePrefs(); newGame(); }
});
el("decks").addEventListener("click", e => {
  const btn = e.target.closest(".chip");
  if (btn){ deckId = btn.dataset.deck; savePrefs(); newGame(); }
});
el("peekToggle").addEventListener("click", () => {
  peekOn = !peekOn;
  savePrefs();
  newGame();
});
el("shuffle").addEventListener("click", newGame);
el("again").addEventListener("click", newGame);
el("share").addEventListener("click", shareResult);
el("veil").addEventListener("click", () => setPaused(false));
el("pause").addEventListener("click", () => setPaused(!paused));

document.addEventListener("keydown", e => {
  if (e.target.closest(".scene")) return;         // let the grid handle its own keys
  const k = e.key.toLowerCase();
  if (peeking && (e.key === " " || e.key === "Enter" || e.key === "Escape")) { e.preventDefault(); endPeek(); return; }
  if (e.key === "Escape" || k === "p") setPaused(!paused);
  else if (k === "n") newGame();
  else if (k === "m") { Sound.toggle();  }
});

/* auto-pause when the game leaves the screen */
document.addEventListener("visibilitychange", () => { if (document.hidden) setPaused(true); });

/* keep the board inside the viewport on every layout change */
window.addEventListener("resize", queueFit, { passive:true });
window.addEventListener("orientationchange", () => setTimeout(fitBoard, 250));
if (window.visualViewport) window.visualViewport.addEventListener("resize", queueFit, { passive:true });
window.addEventListener("load", fitBoard);

/* ---------------- go ---------------- */

el("pause").innerHTML = ICON_PAUSE;
el("pause").setAttribute("aria-label", "Pause game");
el("share").innerHTML = ICON_CHAT + "<span>Share on WhatsApp</span>";

newGame();
<\/script>
</body>
</html>
</script>
<script type="text/plain" id="vol-riffle"><!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12071F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="description" content="Riffle — a word scramble and anagram puzzle. Offline, single file.">
<title>Riffle</title>
<style>
/* ==================================================================
   RIFFLE — word scramble and anagram puzzle

   §1  CANONICAL TOKEN BLOCK. Palette and type changes belong here and
       propagate to every volume. Do not author local overrides.
       This is the Mirrorwork palette, shared with FELL v5.
       All three themes must define every token — day, glare, night.
   ================================================================== */
:root {
  --serif: "Didot", "Bodoni MT", "Playfair Display", Georgia, "Times New Roman", serif;
  --body: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --util: ui-monospace, "SF Mono", "Cascadia Mono", "Roboto Mono", Menlo, monospace;
  --tap: 52px;
  --gutter: 20px;
  --radius: 10px;
  --radius-pill: 999px;
  --radius-plate: 18px;
}
html[data-theme="day"] {
  --ground:#EFE8F8; --plate:#F8F4FD; --well:#E5DBF3;
  --ink:#241041; --ink-2:#6B5590; --hair:#7E64AC;
  --accent:#4A1D7A; --on-accent:#FFF8E9; --chip:#3A1A66; --gilt:#8E6110;
  --pip-hi:#8A72B4; --pip-lo:#180830; --pip-glow:rgba(255,255,255,.6);
  --field:
    radial-gradient(120% 90% at 50% -10%, #F5E8FF 0%, rgba(245,232,255,0) 60%),
    radial-gradient(90% 70% at 100% 110%, #FFEAD6 0%, rgba(255,234,214,0) 55%),
    linear-gradient(180deg,#F2EBFA 0%,#E7DEF3 100%);
  --h1-fill: linear-gradient(180deg,#2E1350,#7A3A9E 92%);
  --wash: rgba(74,29,122,.10); --veil: rgba(36,16,65,.55);
  --face:#FFFFFF;
  --face-ink:#180830;
  --sink: inset 1px 1px 3px rgba(36,16,65,.18), inset -1px -1px 1px rgba(255,255,255,.85);
  --raise: 0 1px 0 rgba(255,255,255,.7), 0 4px 14px rgba(36,16,65,.10);
  --ok-shadow: inset 1px 1px 3px rgba(36,16,65,.18), 0 0 18px -3px rgba(74,29,122,.50);
  --w-body:400; --w-disp:500;
}
html[data-theme="glare"] {
  --ground:#FFFFFF; --plate:#FFFFFF; --well:#FFFFFF;
  --ink:#000000; --ink-2:#000000; --hair:#000000;
  --accent:#000000; --on-accent:#FFFFFF; --chip:#000000; --gilt:#000000;
  --pip-hi:#000000; --pip-lo:#000000; --pip-glow:transparent;
  --field:#FFFFFF;
  --h1-fill: none;
  --wash: transparent; --veil: rgba(0,0,0,.65);
  --face:#FFFFFF;
  --face-ink:#000000;
  --sink: none; --raise: none; --ok-shadow: none;
  --w-body:600; --w-disp:700;
}
html[data-theme="night"] {
  --ground:#12071F; --plate:#241041; --well:#1B0A35;
  --ink:#F6F1FF; --ink-2:#B49BD8; --hair:rgba(240,195,92,.55);
  --accent:#F0C35C; --on-accent:#22093C; --chip:#F0C35C; --gilt:#F0C35C;
  --pip-hi:#FFF0C4; --pip-lo:#A76F14; --pip-glow:rgba(255,255,255,.10);
  --field:
    radial-gradient(120% 90% at 50% -10%, #4A1D7A 0%, rgba(74,29,122,0) 60%),
    radial-gradient(90% 70% at 100% 110%, #7A1D5E 0%, rgba(122,29,94,0) 55%),
    linear-gradient(180deg,#1B0B33 0%,#12071F 100%);
  --h1-fill: linear-gradient(180deg,#FFF8E9,#E7A9D8 90%);
  --wash: rgba(240,195,92,.13); --veil: rgba(18,7,32,.78);
  --face:#F2ECFF;
  --face-ink:#1B0A35;
  --sink: inset 1px 1px 3px rgba(0,0,0,.55), inset -1px -1px 1px rgba(255,255,255,.06);
  --raise: inset 0 1px 0 rgba(255,255,255,.10), 0 6px 20px rgba(0,0,0,.45);
  --ok-shadow: inset 1px 1px 3px rgba(0,0,0,.55), 0 0 22px -3px rgba(240,195,92,.60);
  --w-body:350; --w-disp:400;
}

/* §2  volume-local geometry only — no colour authored below this line */
:root{
  --tile: clamp(40px, 12vw, 58px);
  --tile-h: calc(var(--tile) * 1.16);
  --gap: clamp(5px, 1.7vw, 9px);
  --ease: cubic-bezier(.16,1,.3,1);
}

/* The hidden attribute must win. A class rule carrying `display` has the same
   specificity as the browser's own `[hidden]` rule and, coming later, beats it
   — so `el.hidden = true` silently does nothing and the element stays put. An
   overlay that stays put swallows every press behind it. */
[hidden]{display:none !important}

*{box-sizing:border-box}
html,body{height:100%; margin:0}
body{
  background:var(--ground); color:var(--ink);
  background-image:var(--field); background-attachment:fixed;
  font-family:var(--body); font-weight:var(--w-body);
  font-size:16px; line-height:1.45;
  -webkit-text-size-adjust:100%; -webkit-tap-highlight-color:transparent;
  overflow:hidden; overscroll-behavior:none;
}
.app{
  height:100vh; height:100dvh;
  max-width:560px; margin:0 auto;
  display:flex; flex-direction:column;
  padding:0 var(--gutter);
}

/* ---------- masthead ---------- */
header{
  flex:0 0 auto; display:flex; align-items:center; gap:10px;
  padding:calc(env(safe-area-inset-top) + 14px) 0 8px;
}
h1{
  flex:1; margin:0;
  font-family:var(--serif); font-weight:var(--w-disp);
  font-size:clamp(1.9rem, 8.4vw, 2.5rem); line-height:.95; letter-spacing:.03em;
  background:var(--h1-fill); -webkit-background-clip:text; background-clip:text;
  color:transparent;
}
html[data-theme="glare"] h1{background:none; color:var(--ink)}
.icon{
  flex:0 0 auto; width:40px; height:40px; padding:0; cursor:pointer;
  display:grid; place-items:center; border-radius:var(--radius-pill);
  background:var(--plate); color:var(--gilt);
  border:1px solid var(--hair); box-shadow:var(--raise);
}
.icon svg{width:17px; height:17px; fill:none; stroke:currentColor;
  stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round}
.icon.off{color:var(--ink-2); opacity:.6}

/* ---------- counters ---------- */
.counters{flex:0 0 auto; display:flex; gap:7px; padding-bottom:12px}
.counter{
  flex:1; min-width:0; padding:8px 4px 9px; border-radius:var(--radius);
  background:var(--well); border:1px solid var(--hair); box-shadow:var(--sink);
  text-align:center;
}
.counter b{
  display:block; font-family:var(--util); font-size:1rem; font-weight:600;
  font-variant-numeric:tabular-nums; letter-spacing:-.03em; color:var(--ink);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.counter span{display:block; font-size:.62rem; color:var(--ink-2); letter-spacing:.04em}
.counter.hot b{color:var(--gilt)}

/* ---------- plate ---------- */
.plate{
  flex:0 0 auto; position:relative;
  padding:16px 14px 14px; margin-bottom:12px;
  background:var(--plate); border:1px solid var(--hair);
  border-radius:var(--radius-plate); box-shadow:var(--raise);
}
.stick{
  display:flex; justify-content:center; gap:var(--gap);
  padding:var(--gap); border-radius:var(--radius);
  background:var(--well); border:1px solid var(--hair); box-shadow:var(--sink);
  transition:border-color .28s var(--ease), box-shadow .28s var(--ease), transform .13s ease;
}
.stick.ok{border-color:var(--accent); border-width:2px; box-shadow:var(--ok-shadow)}
.stick.no{border-style:dashed; border-color:var(--ink-2)}
html[data-theme="glare"] .stick.ok{border-width:3px}
.stick.press{transform:translateY(3px) scale(.995)}
.stick.shake{animation:shake .26s ease}
@keyframes shake{
  0%,100%{transform:translateX(0)} 22%{transform:translateX(-6px)}
  55%{transform:translateX(5px)} 82%{transform:translateX(-2px)}
}
.cell{
  width:var(--tile); height:var(--tile-h); flex:0 0 auto;
  border-radius:calc(var(--radius) - 3px);
  border:1px dashed var(--hair); opacity:.55;
}

/* ---------- letters, as Mirrorwork cards ---------- */
.tile{
  width:var(--tile); height:var(--tile-h); flex:0 0 auto;
  display:flex; align-items:center; justify-content:center;
  padding:0; border-radius:calc(var(--radius) - 3px);
  background:var(--plate); background-image:var(--field);
  border:1px solid var(--hair); box-shadow:var(--raise);
  font-family:var(--serif); font-weight:var(--w-disp);
  font-size:calc(var(--tile) * .56); line-height:1;
  text-transform:uppercase; letter-spacing:.02em;
  cursor:grab; touch-action:none; user-select:none;
  transition:border-color .2s var(--ease), box-shadow .2s var(--ease);
}
.tile em{
  font-style:normal; display:block; padding-top:.06em;
  background:var(--h1-fill); -webkit-background-clip:text; background-clip:text;
  color:transparent;
}
html[data-theme="glare"] .tile{background-image:none; border-width:2px}
html[data-theme="glare"] .tile em{background:none; color:var(--ink)}
/* Didot and Bodoni MT are absent on most Android and Linux. Georgia carries
   the gradient poorly at tile size, so solid ink and more weight instead. */
html[data-display="fallback"] .tile em{
  background:none; color:var(--ink); font-weight:700; letter-spacing:0;
}
html[data-display="fallback"] .tile{font-size:calc(var(--tile) * .5)}
.tile:hover{border-color:var(--gilt)}
.tile:focus-visible, button:focus-visible{outline:2px solid var(--gilt); outline-offset:3px}
button:focus:not(:focus-visible){outline:none}
.tile.dragging{opacity:.18; box-shadow:none; transition:none}
.floater{
  position:fixed; z-index:99; margin:0; pointer-events:none;
  transform:translate(-50%,-54%) scale(1.12) rotate(-2deg);
  box-shadow:0 18px 34px rgba(0,0,0,.45); border-color:var(--gilt);
}
.flip{transition:transform .24s var(--ease)}
.tile.deal{animation:deal .5s var(--ease) backwards; animation-delay:calc(var(--i) * 55ms)}
@keyframes deal{
  from{opacity:0; transform:translateY(-18px) rotate(-5deg) scale(.9)}
  to{opacity:1; transform:none}
}

/* ---------- readout ---------- */
.read{
  min-height:3.3em; margin:14px 0 4px; text-align:center;
  font-size:.86rem; color:var(--ink-2);
}
.read b{
  display:inline-block; margin-right:.4em;
  font-family:var(--serif); font-weight:var(--w-disp);
  font-size:1.5rem; letter-spacing:.1em; text-transform:uppercase; color:var(--ink);
}
html[data-display="fallback"] .read b{font-weight:700; font-size:1.4rem}
.read .pts{
  font-family:var(--util); font-size:.9rem; font-weight:600;
  color:var(--gilt); font-variant-numeric:tabular-nums;
}
.read .hint{display:block; font-size:.82rem}

.rack{
  display:flex; flex-wrap:wrap; justify-content:center; align-content:center;
  gap:var(--gap); min-height:var(--tile-h); padding:6px 0 2px;
}

/* ---------- pills ---------- */
.controls{display:flex; gap:9px; padding-top:14px}
.btn{
  flex:1; min-height:var(--tap); font:inherit; font-size:.9rem; cursor:pointer;
  padding:0 10px; border-radius:var(--radius-pill);
  background:var(--plate); color:var(--ink-2);
  border:1px solid var(--hair); box-shadow:var(--raise);
  transition:transform .12s ease, color .2s, border-color .2s;
}
.btn:hover{color:var(--ink); border-color:var(--gilt)}
.btn:active{transform:translateY(1.5px)}
.btn.go{flex:1.3; font-weight:600}
.btn.go.live{background:var(--accent); border-color:var(--accent); color:var(--on-accent)}
html[data-theme="glare"] .btn.go.live{border-width:3px}

/* ---------- ledger ---------- */
.ledger{
  flex:1 1 auto; min-height:0; overflow-y:auto; overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch; padding-top:4px; scrollbar-width:thin;
}
.ledger::-webkit-scrollbar{width:3px}
.ledger::-webkit-scrollbar-thumb{background:var(--hair); border-radius:3px}
.ledger-head{display:flex; align-items:center; gap:8px; padding-bottom:9px}
.ledger-head p{margin:0; flex:1; min-width:0; font-size:.8rem; color:var(--ink-2)}
.ledger-head p strong{font-family:var(--util); color:var(--ink); font-variant-numeric:tabular-nums}
.chip{
  flex:0 0 auto; font:inherit; font-size:.76rem; padding:9px 13px; cursor:pointer;
  border-radius:var(--radius-pill); white-space:nowrap;
  background:var(--plate); color:var(--gilt);
  border:1px solid var(--hair); box-shadow:var(--raise);
}
.chip:hover{border-color:var(--gilt)}
.chip[disabled]{opacity:.4; cursor:default}
.meter{
  height:3px; margin-bottom:16px; border-radius:var(--radius-pill);
  background:var(--well); box-shadow:var(--sink); overflow:hidden;
}
.meter i{
  display:block; height:100%; width:0; border-radius:var(--radius-pill);
  background:var(--accent); transition:width .55s var(--ease);
}
.group{margin-bottom:18px}
.group h2{
  display:flex; justify-content:space-between; align-items:baseline;
  margin:0 0 9px; padding-bottom:6px; border-bottom:1px solid var(--hair);
  font-family:var(--body); font-size:.76rem; font-weight:var(--w-body);
  color:var(--ink-2); letter-spacing:.05em;
}
.group h2 em{font-style:normal; font-family:var(--util); font-size:.8rem;
  color:var(--gilt); font-variant-numeric:tabular-nums}
.slugs{display:flex; flex-wrap:wrap; gap:6px}
.slug{
  min-width:calc(var(--l) * .8em + 22px);
  padding:7px 10px; border-radius:calc(var(--radius) - 2px);
  font-family:var(--serif); font-size:.86rem; font-weight:var(--w-disp);
  letter-spacing:.12em; text-transform:uppercase; text-align:center;
  background:var(--well); color:var(--ink-2);
  border:1px solid var(--hair); box-shadow:var(--sink);
}
html[data-display="fallback"] .slug{font-weight:700}
.slug.got{
  background:var(--accent); color:var(--on-accent);
  border-color:var(--accent); box-shadow:var(--raise);
}
.slug.lit{color:var(--gilt); border-color:var(--gilt)}
.slug.new{animation:stamp .42s var(--ease)}
@keyframes stamp{
  0%{transform:translateY(-9px) scale(1.15); opacity:0}
  55%{transform:translateY(0) scale(.97); opacity:1}
  100%{transform:none}
}

/* ---------- footer ---------- */
footer{
  flex:0 0 auto; display:flex; gap:9px; align-items:center;
  padding:11px 0 calc(env(safe-area-inset-bottom) + 12px);
  border-top:1px solid var(--hair);
}
.seg{
  flex:1; display:flex; gap:5px; padding:4px; border-radius:var(--radius-pill);
  background:var(--well); border:1px solid var(--hair); box-shadow:var(--sink);
}
.seg button{
  flex:1; font:inherit; font-size:.78rem; padding:9px 2px; cursor:pointer;
  border:0; border-radius:var(--radius-pill); background:none; color:var(--ink-2);
  transition:background .3s var(--ease), color .3s var(--ease);
}
.seg button[aria-pressed="true"]{background:var(--accent); color:var(--on-accent); font-weight:600}
.wa{
  flex:0 0 auto; min-height:var(--tap); padding:0 16px; cursor:pointer;
  display:flex; align-items:center; gap:8px;
  font:inherit; font-size:.82rem; border-radius:var(--radius-pill);
  background:var(--plate); color:var(--gilt);
  border:1px solid var(--hair); box-shadow:var(--raise);
  transition:transform .12s ease, border-color .2s;
}
.wa svg{width:17px; height:17px; fill:none; stroke:currentColor;
  stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round}
.wa:hover{border-color:var(--gilt)}
.wa:active{transform:translateY(1.5px)}

/* ---------- toast ---------- */
.toast{
  position:fixed; left:50%; z-index:60;
  bottom:calc(env(safe-area-inset-bottom) + 84px);
  transform:translate(-50%,16px) scale(.97);
  max-width:84vw; padding:12px 18px; text-align:center;
  border-radius:var(--radius-plate);
  background:var(--plate); color:var(--ink);
  border:1px solid var(--hair); box-shadow:var(--raise);
  font-size:.84rem;
  opacity:0; pointer-events:none;
  transition:opacity .3s var(--ease), transform .42s var(--ease);
}
.toast b{font-family:var(--serif); font-weight:var(--w-disp); letter-spacing:.09em; color:var(--gilt)}
.toast.up{opacity:1; transform:translate(-50%,0) scale(1)}

/* ---------- two panes from tablet up ---------- */
@media (min-width:900px){
  :root{--tile:64px; --tile-h:74px; --gap:10px}
  .app{
    max-width:1120px; display:grid; column-gap:30px;
    grid-template-columns:minmax(0,1fr) minmax(0,1fr);
    grid-template-rows:auto auto minmax(0,1fr) auto;
  }
  header{grid-column:1 / -1; grid-row:1}
  h1{font-size:2.6rem}
  .counters{grid-column:1; grid-row:2}
  .plate{grid-column:1; grid-row:3; align-self:start; padding:22px 20px 18px}
  footer{grid-column:1; grid-row:4}
  .ledger{grid-column:2; grid-row:2 / 5; padding-bottom:20px}
  .read{min-height:3.6em}
  .toast{bottom:34px}
}
@media (min-width:1240px){
  .app{max-width:1240px; column-gap:44px}
}

@media (prefers-reduced-motion: reduce){
  *{animation-duration:.01ms !important; animation-iteration-count:1 !important;
    transition-duration:.01ms !important}
}
@media (max-height:700px) and (max-width:899px){
  :root{--tile:clamp(37px,11vw,50px)}
  h1{font-size:1.7rem}
  .counters{padding-bottom:9px}
  .plate{padding:12px 12px 11px}
  .read{min-height:3em; margin:9px 0 2px}
  .read b{font-size:1.3rem}
  .controls{padding-top:10px}
}
</style>
</head>
<body>
<div class="app">
  <div class="counters">

    <div class="counter" id="streakBox" title="Rises with each word set on this rack. A hint resets it."><b id="cStreak">&times;1</b><span>streak</span></div>
    <div class="counter"><b id="cMax">0</b><span>possible</span></div>
  </div>

  <section class="plate">
    <div class="stick" id="stick" aria-label="The word you are setting"></div>
    <p class="read" id="read" aria-live="polite"></p>
    <div class="rack" id="rack" aria-label="Your letters"></div>
    <div class="controls">
      <button class="btn" id="shuffle">Shuffle</button>
      <button class="btn" id="clear">Clear</button>
      <button class="btn go" id="go" disabled>Enter</button>
    </div>
  </section>

  <section class="ledger" id="ledger">
    <div class="ledger-head">
      <p id="progress"></p>
      <button class="chip" id="hint">Hint &minus;40</button>
      <button class="chip" id="next">New rack</button>
    </div>
    <div class="meter" aria-hidden="true"><i id="meter"></i></div>
    <div id="groups"></div>
  </section>

  <footer>
    <div class="seg" role="group" aria-label="Rack size">
      <button data-len="5">5</button>
      <button data-len="6">6</button>
      <button data-len="7">7</button>
    </div>
    <button class="wa" id="share">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 11.5a8.4 8.4 0 0 1-8.5 8.3 8.7 8.7 0 0 1-3.9-.9L4 20.4l1.6-4.3A8.2 8.2 0 0 1 4 11.5 8.4 8.4 0 0 1 12.5 3.2 8.4 8.4 0 0 1 21 11.5z"/></svg>

  </footer>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";
/* ================= bundled data =================
   RACKS[n] is stable and APPEND-ONLY. Share links encode a rack by its
   index in this array, so reordering or removing an entry would silently
   repoint every link ever sent. Add to the end, never in the middle.
   ================================================================== */
window.C2 = (function () {
  "use strict";
  var slug = null, listeners = [];
  var set = { mode: "auto", sound: true, haptic: true };
  /* An srcdoc iframe has no URL of its own, so a volume cannot read or write
     a share fragment directly. The shell owns the address bar and passes the
     fragment down; the volume asks for it, and asks for it to be updated. */

    register: function (v) {

    read: function (key, fallback) { return readRaw("v." + slug + "." + key, fallback); },

/* Contract §7 — seeded randomness. Canonical. A daily board must be identical

   Math.random. */

    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;

C2.register({

const DICT = new Set(DICT_RAW.split(" "));
const RACKS = {5:RACK_RAW[5].split(" "), 6:RACK_RAW[6].split(" "), 7:RACK_RAW[7].split(" ")};
const POINTS = {3:30, 4:60, 5:110, 6:180, 7:300};
const HINT_COST = 40, SWEEP_BONUS = 250, STREAK_CAP = 2;
const rackKey = n => "rack" + n;

const NAMES = {3:"three letters", 4:"four letters", 5:"five letters", 6:"six letters", 7:"seven letters"};

/* ================= state =================
   P — preferences and the all-time total, one key.
   R — the rack in play. Stored under its own key per size, so switching
       between 5, 6 and 7 letters never discards a rack in progress.
   ================================================================== */
let P = {len:6, score:0, best:0, racks:0};
let R = {word:"", order:[], found:[], hints:{}, streak:0, rackScore:0, longDone:false};
let tiles = [], rack = [], stick = [];
let solutions = [], byLen = {}, rackMax = 0;
let shown = 0, tallyRaf = null;

const $ = id => document.getElementById(id);
const el = { stick:$("stick"), rack:$("rack"), read:$("read"), go:$("go"),
             groups:$("groups"), progress:$("progress"), toast:$("toast"),
             meter:$("meter"), cScore:$("cScore"), cFound:$("cFound"),
             cStreak:$("cStreak"), cHaul:$("cHaul"), cMax:$("cMax"), hint:$("hint") };
const calm = () => typeof matchMedia === "function" &&
                   matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ================= persistence ================= */
function savePrefs(){ C2.write("state", P); }
function saveRack(){ C2.write(rackKey(P.len), R); }
function readRack(n){
  try{
    const r = C2.read(rackKey(n), null);
    if(!r || typeof r.word !== "string" || r.word.length !== n) return null;
    if(!Array.isArray(r.order) || r.order.length !== n) return null;
    if(RACKS[n].indexOf(r.word) < 0) return null;      // pool changed under it
    r.found = Array.isArray(r.found) ? r.found : [];
    r.hints = (r.hints && typeof r.hints === "object") ? r.hints : {};
    r.streak = r.streak|0; r.rackScore = r.rackScore|0;
    return r;
  }catch(e){ return null; }
}
function loadPrefs(){
  P = Object.assign(P, C2.read("state", {}) || {});
  if([5,6,7].indexOf(P.len) < 0) P.len = 6;
}

/* ================= share links =================
   #r=<size>-<index in base 36>. Index, not the word itself — the word is
   the answer, and a link that spells it out in the address bar is a spoiler.
   ================================================================== */
function hashFor(len, word){
  const i = RACKS[len].indexOf(word);
  return i < 0 ? "" : "r=" + len + "-" + i.toString(36);
}
function parseHash(h){
  const m = /^r=([567])-([0-9a-z]+)$/.exec((h || "").replace(/^#/, ""));
  if(!m) return null;
  const len = +m[1], i = parseInt(m[2], 36);
  if(!(i >= 0) || i >= RACKS[len].length) return null;
  return {len, word:RACKS[len][i]};
}
function syncHash(){
  const h = hashFor(P.len, R.word);
  if(h) C2.setFrag(h);
}

/* ================= sound and haptics ================= */
const buzz = p => C2.haptic(p);
let AC = null;
function note(freq, dur, gain, type){
  if(!C2.sound()) return;
  try{
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    if(AC.state === "suspended") AC.resume();
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type || "sine"; o.frequency.value = freq;
    g.gain.setValueAtTime(0, AC.currentTime);
    g.gain.linearRampToValueAtTime(gain, AC.currentTime + .008);
    g.gain.exponentialRampToValueAtTime(.0001, AC.currentTime + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(); o.stop(AC.currentTime + dur + .02);
  }catch(e){}
}
const sndSet   = ()=>{ note(392, .05, .05, "triangle"); buzz(7); };
const sndBack  = ()=>{ note(262, .05, .035, "triangle"); buzz(5); };
const sndGood  = ()=>{ note(587.33, .16, .06); setTimeout(()=>note(880, .3, .05), 85); buzz(16); };
const sndBonus = ()=>{ note(659.25, .18, .06); setTimeout(()=>note(987.77, .34, .055), 110); buzz([14,50,20]); };
const sndNo    = ()=>{ note(160, .12, .045, "sawtooth"); buzz([10,45,10]); };
const sndHint  = ()=>{ note(440, .09, .04, "triangle"); setTimeout(()=>note(330, .14, .035, "triangle"), 90); buzz(9); };

/* ================= words ================= */
function canMake(word, pool){
  const c = {};
  for(const ch of pool) c[ch] = (c[ch]||0)+1;
  for(const ch of word){ if(!c[ch]) return false; c[ch]--; }
  return true;
}
function solve(word){
  const out = [];
  for(const w of DICT) if(w.length>=3 && w.length<=word.length && canMake(w, word)) out.push(w);
  out.sort((a,b)=> a.length-b.length || a.localeCompare(b));
  return out;
}
function shuffled(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
// R.streak counts words set on this rack since the last hint. It only falls
// when a hint is taken, which is the one thing the player chooses to do.
const multiplier = () => Math.min(STREAK_CAP, 1 + 0.2 * R.streak);
const multAt = k => Math.min(STREAK_CAP, 1 + 0.2 * k);

/* The best haul a rack can yield. Position k carries multiplier multAt(k),
   which never decreases, so pairing the cheapest words with the earliest
   positions maximises the sum. The only other choice is where to put the
   full-rack word, whose bonus falls the longer you leave it, so try every
   position for it and keep the best. Racks routinely hold more than one
   full-length anagram and only the first one set pays the bonus, which
   tally() accounts for. No hints, because a hint costs points and resets
   the streak. Returns the order too, so it can be replayed and checked
   rather than trusted. */
function ceiling(words, len){
  const n = words.length;
  if(!n) return {max:0, order:[]};
  const asc = words.slice().sort((a,b)=>POINTS[a.length]-POINTS[b.length]);
  const fullIdx = asc.findIndex(w => w.length === len);
  if(fullIdx < 0) return {max:tally(asc, len), order:asc};
  const full = asc[fullIdx];
  const rest = asc.slice(0, fullIdx).concat(asc.slice(fullIdx+1));
  let bestTotal = -1, bestOrder = null;
  for(let p = 0; p < n; p++){
    const order = rest.slice();
    order.splice(p, 0, full);
    const t = tally(order, len);
    if(t > bestTotal){ bestTotal = t; bestOrder = order; }
  }
  return {max:bestTotal, order:bestOrder};
}
/* Scores a whole rack played in the given order, by the same arithmetic
   submit() uses. One source of truth for what a run is worth. */
function tally(order, len){
  let total = 0, bonusTaken = false;
  for(let k = 0; k < order.length; k++){
    const w = order[k];
    total += Math.round(POINTS[w.length] * multAt(k));
    // a rack can hold several full-length anagrams; only the first pays
    if(w.length === len && !bonusTaken){
      bonusTaken = true;
      total += (k === 0 ? 250 : (k < 3 ? 200 : 150));
    }
  }
  return total + SWEEP_BONUS;
}
const fmtMult = m => "\u00d7" + (m % 1 === 0 ? m : m.toFixed(1));

/* ================= rack lifecycle ================= */
function freshRack(word){
  R = {word, order:shuffled(word.split("")), found:[], hints:{},
       streak:0, rackScore:0, longDone:false};
}
function newRack(){
  const pool = RACKS[P.len];
  let w;
  do { w = pool[Math.floor(Math.random()*pool.length)]; } while(pool.length>1 && w===R.word);
  freshRack(w);
  buildRack(true);
  saveRack(); savePrefs(); syncHash();
}
function switchLen(n){
  P.len = n;
  const stored = readRack(n);
  if(stored) R = stored; else freshRack(RACKS[n][Math.floor(Math.random()*RACKS[n].length)]);
  markSeg();
  buildRack(true);
  saveRack(); savePrefs(); syncHash();
}
function buildRack(animate){
  solutions = solve(R.word);
  byLen = {};
  for(const w of solutions){ (byLen[w.length] = byLen[w.length]||[]).push(w); }
  rackMax = ceiling(solutions, P.len).max;
  R.found = R.found.filter(w => solutions.indexOf(w) > -1);
  R.longDone = R.found.indexOf(R.word) > -1;

  el.stick.innerHTML = ""; el.rack.innerHTML = "";
  tiles = R.order.map((ch,i)=>{
    const b = document.createElement("button");
    b.className = "tile"; b.type = "button";
    b.innerHTML = "<em>" + ch + "</em>";
    b.setAttribute("aria-label", "Letter " + ch.toUpperCase());
    b.dataset.id = i;
    b.style.setProperty("--i", i);
    b.addEventListener("pointerdown", onDown);
    return {id:i, ch, el:b};
  });
  rack = tiles.map(t=>t.id);
  stick = [];
  for(let i=0;i<P.len;i++){
    const c = document.createElement("div");
    c.className = "cell";
    el.stick.appendChild(c);
  }
  render(true);
  if(animate && !calm()){
    for(const t of tiles){
      t.el.classList.add("deal");
      t.el.addEventListener("animationend", ()=>t.el.classList.remove("deal"), {once:true});
    }
  }
  drawLedger();
  $("ledger").scrollTop = 0;
}

/* ================= rendering ================= */
function rects(){
  const m = new Map();
  for(const t of tiles) m.set(t.id, t.el.getBoundingClientRect());
  return m;
}
function flip(before){
  if(calm()) return;
  for(const t of tiles){
    const a = before.get(t.id), b = t.el.getBoundingClientRect();
    if(!a || (a.left===b.left && a.top===b.top)) continue;
    t.el.classList.remove("flip");
    t.el.style.transform = `translate(${a.left-b.left}px,${a.top-b.top}px)`;
    requestAnimationFrame(()=>{ t.el.classList.add("flip"); t.el.style.transform = ""; });
  }
}
function render(skipFlip){
  const before = skipFlip ? null : rects();
  const cells = el.stick.children;
  for(let i=0;i<cells.length;i++){
    const want = stick[i];
    const cur = cells[i].firstElementChild;
    if(want === undefined){ if(cur) cur.remove(); continue; }
    const t = tiles[want];
    if(cur !== t.el){ if(cur) cur.remove(); cells[i].appendChild(t.el); }
  }
  rack.forEach(id => el.rack.appendChild(tiles[id].el));
  if(before) flip(before);
  readout();
}
const current = () => stick.map(id=>tiles[id].ch).join("");

function readout(){
  const w = current();
  el.stick.classList.remove("ok","no");
  el.go.classList.remove("live");
  el.go.disabled = true;

  if(!w){
    el.read.innerHTML = "<span class='hint'>" +
      (rack.length === P.len ? "Tap a letter, or drag it into the row."
                             : "Keep going.") + "</span>";
    return;
  }
  if(w.length < 3){
    el.read.innerHTML = "<b>"+w+"</b><span class='hint'>Three letters or more.</span>";
    return;
  }
  if(R.found.indexOf(w) > -1){
    el.read.innerHTML = "<b>"+w+"</b><span class='hint'>Already in the ledger.</span>";
    el.stick.classList.add("no");
    return;
  }
  if(solutions.indexOf(w) > -1){
    const m = multiplier();
    const pts = Math.round(POINTS[w.length] * m);
    el.read.innerHTML = "<b>"+w+"</b><span class='pts'>+"+pts+
      (m > 1 ? " (" + fmtMult(m) + ")" : "") +
      "</span><span class='hint'>Press enter to set it.</span>";
    el.stick.classList.add("ok");
    el.go.classList.add("live");
    el.go.disabled = false;
    return;
  }
  el.read.innerHTML = "<b>"+w+"</b><span class='hint'>Not a word in this rack.</span>";
  el.stick.classList.add("no");
}

function paintScore(to){
  if(tallyRaf) cancelAnimationFrame(tallyRaf);
  if(calm() || Math.abs(to - shown) < 2){
    shown = to; el.cScore.textContent = to.toLocaleString("en-GB"); return;
  }
  const from = shown, t0 = performance.now(), ms = 520;
  (function step(now){
    const p = Math.min(1, (now - t0)/ms);
    shown = Math.round(from + (to - from) * (1 - Math.pow(1-p, 3)));
    el.cScore.textContent = shown.toLocaleString("en-GB");
    tallyRaf = p < 1 ? requestAnimationFrame(step) : null;
  })(t0);
}

function slugFace(w){
  const n = R.hints[w] || 0;
  return n ? w.slice(0, n) + "\u00b7".repeat(w.length - n) : "\u00b7".repeat(w.length);
}
function drawLedger(fresh){
  const lens = Object.keys(byLen).map(Number).sort((a,b)=>a-b);
  el.groups.innerHTML = "";
  for(const L of lens){
    const words = byLen[L];
    let got = 0;
    const g = document.createElement("div");
    g.className = "group";
    const box = document.createElement("div");
    box.className = "slugs";
    for(const w of words){
      const has = R.found.indexOf(w) > -1;
      if(has) got++;
      const s = document.createElement("div");
      s.className = "slug" + (has ? " got" : (R.hints[w] ? " lit" : "")) +
                    (has && w===fresh ? " new" : "");
      s.style.setProperty("--l", L);
      s.textContent = has ? w : slugFace(w);
      if(!has) s.setAttribute("aria-label", NAMES[L] + ", not yet set");
      box.appendChild(s);
    }
    g.innerHTML = "<h2>"+NAMES[L]+"<em>"+got+" / "+words.length+"</em></h2>";
    g.appendChild(box);
    el.groups.appendChild(g);
  }
  el.progress.innerHTML = "<strong>"+R.found.length+"</strong> of <strong>"+solutions.length+
    "</strong> set" + (R.longDone ? "" : ", full rack hiding") +
    (P.best ? " &middot; best rack <strong>"+P.best.toLocaleString("en-GB")+"</strong>" : "");
  el.meter.style.width = (solutions.length ? (R.found.length/solutions.length*100) : 0) + "%";
  el.cHaul.textContent = R.rackScore.toLocaleString("en-GB");
  el.cMax.textContent = rackMax.toLocaleString("en-GB");
  const m = multiplier();
  el.cStreak.innerHTML = fmtMult(m);
  $("streakBox").classList.toggle("hot", m > 1);
  $("streakBox").setAttribute("aria-label",
    "Streak multiplier " + fmtMult(m) + ", from " + R.streak + " words set since the last hint");
  el.hint.disabled = !nextHint();
  paintScore(P.score);
}

let toastTimer;
function toast(msg){
  el.toast.innerHTML = msg;
  el.toast.classList.add("up");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.toast.classList.remove("up"), 2600);
}

/* ================= moves ================= */
function toStick(id, index){
  const i = rack.indexOf(id); if(i>-1) rack.splice(i,1);
  const j = stick.indexOf(id); if(j>-1) stick.splice(j,1);
  if(index===undefined || index>stick.length) index = stick.length;
  stick.splice(index,0,id);
  if(stick.length > P.len) rack.push(stick.pop());
}
function toRack(id, index){
  const j = stick.indexOf(id); if(j>-1) stick.splice(j,1);
  const i = rack.indexOf(id); if(i>-1) rack.splice(i,1);
  if(index===undefined || index>rack.length) index = rack.length;
  rack.splice(index,0,id);
}
function clearStick(){
  while(stick.length) rack.push(stick.pop());
  render();
}
function submit(){
  const w = current();
  // Defensive only. Live validation disables Enter for anything invalid or
  // already set, so this path is not reachable through the interface.
  if(solutions.indexOf(w) < 0 || R.found.indexOf(w) > -1){
    el.stick.classList.add("shake");
    setTimeout(()=>el.stick.classList.remove("shake"), 300);
    sndNo();
    return;
  }
  const m = multiplier();
  let gained = Math.round(POINTS[w.length] * m);
  const notes = [];
  if(m > 1) notes.push(fmtMult(m) + " streak");

  if(w.length === P.len && !R.longDone){
    R.longDone = true;
    // finding the full rack early is worth more than grinding to it
    const bonus = R.found.length === 0 ? 250 : (R.found.length < 3 ? 200 : 150);
    gained += bonus;
    notes.push("full rack, +" + bonus);
  }
  R.found.push(w);
  R.streak++;
  const swept = R.found.length === solutions.length;
  if(swept){ gained += SWEEP_BONUS; notes.push("clean sweep, +" + SWEEP_BONUS); }

  P.score += gained;
  R.rackScore += gained;
  if(R.rackScore > P.best) P.best = R.rackScore;

  el.stick.classList.add("press");
  setTimeout(()=>el.stick.classList.remove("press"), 150);
  notes.length > 1 || swept ? sndBonus() : sndGood();

  clearStick();
  drawLedger(w);
  saveRack(); savePrefs();
  if(notes.length) toast("<b>"+w.toUpperCase()+"</b> &mdash; "+notes.join(", "));
  if(swept) setTimeout(()=>toast("Every word set. Take a new rack when you like."), 2700);
}

/* ================= hints =================
   Reveals one more opening letter of the shortest word still missing, and
   never the last letter — you always set the word yourself. A hint also
   breaks the streak, so it costs more than the 40 points on the button.
   ================================================================== */
function nextHint(){
  let best = null;
  for(const w of solutions){
    if(R.found.indexOf(w) > -1) continue;
    if((R.hints[w] || 0) >= w.length - 1) continue;
    if(!best || w.length < best.length) best = w;
  }
  return best;
}
function takeHint(){
  const w = nextHint();
  if(!w){ toast("No hints left on this rack."); return; }
  R.hints[w] = (R.hints[w] || 0) + 1;
  P.score = Math.max(0, P.score - HINT_COST);
  R.rackScore = Math.max(0, R.rackScore - HINT_COST);
  R.streak = 0;
  sndHint();
  drawLedger();
  saveRack(); savePrefs();
  toast("<b>" + slugFace(w).toUpperCase() + "</b> &mdash; " +
        NAMES[w.length] + ", &minus;" + HINT_COST);
}

/* ================= drag and tap ================= */
let drag = null;
/* The move and release listeners go on the window, not the tile.
   render() moves a tile between the rack and the stick, which detaches the
   element for an instant, and a detached element loses pointer capture. Touch
   has implicit capture and survives that; a mouse does not, so listeners bound
   to the tile stop hearing anything — the ghost freezes mid-air over the rack
   and never clears, because pointerup never arrives either. */
function onDown(e){
  if(e.button !== undefined && e.button > 0) return;
  const node = e.currentTarget;
  drag = {id:+node.dataset.id, x:e.clientX, y:e.clientY, moved:false, ghost:null, el:node, sig:null};
  window.addEventListener("pointermove", onMove);
  window.addEventListener("pointerup", onUp);
  window.addEventListener("pointercancel", onUp);
  window.addEventListener("blur", onUp);
  e.preventDefault();
}
function onMove(e){
  if(!drag) return;
  if(!drag.moved){
    if(Math.hypot(e.clientX-drag.x, e.clientY-drag.y) < 7) return;
    drag.moved = true;
    const g = drag.el.cloneNode(true);
    g.classList.add("floater");
    g.style.width = drag.el.offsetWidth + "px";
    g.style.height = drag.el.offsetHeight + "px";
    document.body.appendChild(g);
    drag.ghost = g;
    drag.el.classList.add("dragging");
    buzz(6);
  }
  drag.ghost.style.left = e.clientX + "px";
  drag.ghost.style.top = e.clientY + "px";

  const target = hit(e.clientX, e.clientY);
  if(!target) return;
  const sig = target.zone + ":" + target.index;
  if(sig === drag.sig) return;
  drag.sig = sig;
  target.zone === "stick" ? toStick(drag.id, target.index) : toRack(drag.id, target.index);
  render();
}
function onUp(){
  window.removeEventListener("pointermove", onMove);
  window.removeEventListener("pointerup", onUp);
  window.removeEventListener("pointercancel", onUp);
  window.removeEventListener("blur", onUp);
  if(!drag) return;
  const d = drag; drag = null;
  if(d.ghost) d.ghost.remove();
  d.el.classList.remove("dragging");
  if(!d.moved){
    if(rack.indexOf(d.id) > -1){ toStick(d.id); sndSet(); }
    else { toRack(d.id); sndBack(); }
    render();
  } else sndSet();
}
function hit(x, y){
  const pad = 28;
  const sr = el.stick.getBoundingClientRect();
  const rr = el.rack.getBoundingClientRect();
  const inStick = x>sr.left-pad && x<sr.right+pad && y>sr.top-pad && y<sr.bottom+pad;
  const inRack  = x>rr.left-pad && x<rr.right+pad && y>rr.top-pad && y<rr.bottom+pad;
  let zone = null;
  if(inStick && inRack)
    zone = Math.abs(y-(sr.top+sr.height/2)) < Math.abs(y-(rr.top+rr.height/2)) ? "stick" : "rack";
  else if(inStick) zone = "stick";
  else if(inRack) zone = "rack";
  if(!zone) return null;
  const ids = zone === "stick" ? stick : rack;
  let index = 0;
  for(const id of ids){
    if(id === drag.id) continue;
    const r = tiles[id].el.getBoundingClientRect();
    if(y > r.bottom || (y > r.top - 4 && x > r.left + r.width/2)) index++;
  }
  return {zone, index};
}

/* ================= keyboard ================= */
document.addEventListener("keydown", e=>{
  if(e.metaKey || e.ctrlKey || e.altKey) return;
  const onButton = document.activeElement && document.activeElement.tagName === "BUTTON";
  const k = e.key;
  if(/^[a-zA-Z]$/.test(k)){
    const id = rack.find(i=>tiles[i].ch === k.toLowerCase());
    if(id !== undefined){ toStick(id); render(); sndSet(); }
    e.preventDefault();
  } else if(k === "Backspace"){
    if(stick.length){ toRack(stick[stick.length-1]); render(); sndBack(); }
    e.preventDefault();
  } else if(k === "Enter" && !onButton){
    if(!el.go.disabled) submit();
    e.preventDefault();
  } else if(k === " " && !onButton){
    doShuffle(); e.preventDefault();
  } else if(k === "Escape"){
    clearStick();
  } else if(k === "?" && !onButton){
    if(!el.hint.disabled) takeHint();
  }
});

/* ================= controls ================= */
function doShuffle(){
  rack = shuffled(rack);
  render();
  note(330, .04, .035, "triangle"); buzz(5);
}
function markSeg(){
  for(const b of document.querySelectorAll(".seg button"))
    b.setAttribute("aria-pressed", (+b.dataset.len === P.len) ? "true" : "false");
}
$("shuffle").onclick = doShuffle;
$("clear").onclick = ()=>{ if(stick.length) sndBack(); clearStick(); };
$("go").onclick = submit;
$("hint").onclick = takeHint;
$("next").onclick = ()=>{
  if(!R.longDone && R.word) toast("The full rack was <b>"+R.word.toUpperCase()+"</b>.");
  P.racks++;
  newRack();
};
for(const b of document.querySelectorAll(".seg button")){
  b.onclick = ()=>{ if(+b.dataset.len !== P.len) switchLen(+b.dataset.len); };
}
function openFrag(f){
  const ref = parseHash(f);
  if(!ref || (ref.len === P.len && ref.word === R.word)) return;
  P.len = ref.len;
  const stored = readRack(ref.len);
  if(stored && stored.word === ref.word) R = stored; else freshRack(ref.word);
  markSeg(); buildRack(true); saveRack(); savePrefs();
}
window.addEventListener("hashchange", ()=> openFrag(location.hash));

/* ================= share ================= */
$("share").onclick = ()=>{
  const filled = solutions.length ? Math.round(R.found.length/solutions.length*10) : 0;
  const lines = [
    "Riffle \u2014 " + P.len + "-letter rack",
    "\u25C6".repeat(filled) + "\u25C7".repeat(10-filled),
    R.rackScore.toLocaleString("en-GB") + " of a possible " +
      rackMax.toLocaleString("en-GB") + "  (" +
      (rackMax ? Math.round(R.rackScore/rackMax*100) : 0) + "%)",
    R.found.length + " of " + solutions.length + " words",
    R.longDone ? "Found the full rack." : "Still hunting the full rack."
  ];
  const url = C2.link(hashFor(P.len, R.word));
  if(url){ lines.push("Play the same rack:"); lines.push(url); }
  else lines.push("Beat that.");
  C2.share(lines);
};

C2.onPause = function(){
  if(drag){
    if(drag.ghost) drag.ghost.remove();
    drag.el.classList.remove("dragging");
    drag = null; render();
  }
};

/* ================= display face check =================
   document.fonts.check reports true for any locally-installed family name,
   so it cannot answer this. Measuring the same string against the generic
   serif can: identical widths mean the family fell through.
   ================================================================== */
function hasFace(name){
  try{
    const c = document.createElement("canvas").getContext("2d");
    if(!c || !c.measureText) return true;
    const s = "WOMwmilg1@#";
    c.font = '700 48px serif';
    const base = c.measureText(s).width;
    c.font = '700 48px "' + name + '", serif';
    return Math.abs(base - c.measureText(s).width) > 0.5;
  }catch(e){ return true; }
}
function checkDisplayFace(){
  const ok = hasFace("Didot") || hasFace("Bodoni MT") || hasFace("Playfair Display");
  if(!ok) document.documentElement.dataset.display = "fallback";
}

/* ================= boot ================= */
loadPrefs();
checkDisplayFace();

const shared = parseHash(C2.frag());
let sharedNotice = false;
if(shared){
  P.len = shared.len;
  const stored = readRack(shared.len);
  if(stored && stored.word === shared.word) R = stored;
  else { freshRack(shared.word); sharedNotice = true; }
} else {
  const stored = readRack(P.len);
  if(stored) R = stored; else freshRack(RACKS[P.len][Math.floor(Math.random()*RACKS[P.len].length)]);
}
markSeg();
buildRack(true);
saveRack();
syncHash();
if(sharedNotice) setTimeout(()=>toast("Someone sent you this rack. Same letters, same words."), 700);
<\/script>
</body>
</html>
</script>
<script type="text/plain" id="vol-glean"><!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12071F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="description" content="Glean — trace one line, take the best haul. Offline, single file.">
<title>Glean</title>
<style>
/* ==================================================================
   GLEAN — one line across the field, take the best haul

   §1  CANONICAL TOKEN BLOCK. Palette and type changes belong here and
       propagate to every volume. Do not author local overrides.
       Mirrorwork palette, shared with FELL v5 and RIFFLE.
       All three themes must define every token — day, glare, night.
   ================================================================== */
:root {
  --serif: "Didot", "Bodoni MT", "Playfair Display", Georgia, "Times New Roman", serif;
  --body: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --util: ui-monospace, "SF Mono", "Cascadia Mono", "Roboto Mono", Menlo, monospace;
  --tap: 52px;
  --gutter: 20px;
  --radius: 10px;
  --radius-pill: 999px;
  --radius-plate: 18px;
}
html[data-theme="day"] {
  --ground:#EFE8F8; --plate:#F8F4FD; --well:#E5DBF3;
  --ink:#241041; --ink-2:#6B5590; --hair:#7E64AC;
  --accent:#4A1D7A; --on-accent:#FFF8E9; --chip:#3A1A66; --gilt:#8E6110;
  --pip-hi:#8A72B4; --pip-lo:#180830; --pip-glow:rgba(255,255,255,.6);
  --field:
    radial-gradient(120% 90% at 50% -10%, #F5E8FF 0%, rgba(245,232,255,0) 60%),
    radial-gradient(90% 70% at 100% 110%, #FFEAD6 0%, rgba(255,234,214,0) 55%),
    linear-gradient(180deg,#F2EBFA 0%,#E7DEF3 100%);
  --h1-fill: linear-gradient(180deg,#2E1350,#7A3A9E 92%);
  --wash: rgba(74,29,122,.10); --veil: rgba(36,16,65,.55);
  --face:#FFFFFF;
  --face-ink:#180830;
  --sink: inset 1px 1px 3px rgba(36,16,65,.18), inset -1px -1px 1px rgba(255,255,255,.85);
  --raise: 0 1px 0 rgba(255,255,255,.7), 0 4px 14px rgba(36,16,65,.10);
  --ok-shadow: inset 1px 1px 3px rgba(36,16,65,.18), 0 0 18px -3px rgba(74,29,122,.50);
  --w-body:400; --w-disp:500;
}
html[data-theme="glare"] {
  --ground:#FFFFFF; --plate:#FFFFFF; --well:#FFFFFF;
  --ink:#000000; --ink-2:#000000; --hair:#000000;
  --accent:#000000; --on-accent:#FFFFFF; --chip:#000000; --gilt:#000000;
  --pip-hi:#000000; --pip-lo:#000000; --pip-glow:transparent;
  --field:#FFFFFF;
  --h1-fill: none;
  --wash: transparent; --veil: rgba(0,0,0,.65);
  --face:#FFFFFF;
  --face-ink:#000000;
  --sink: none; --raise: none; --ok-shadow: none;
  --w-body:600; --w-disp:700;
}
html[data-theme="night"] {
  --ground:#12071F; --plate:#241041; --well:#1B0A35;
  --ink:#F6F1FF; --ink-2:#B49BD8; --hair:rgba(240,195,92,.55);
  --accent:#F0C35C; --on-accent:#22093C; --chip:#F0C35C; --gilt:#F0C35C;
  --pip-hi:#FFF0C4; --pip-lo:#A76F14; --pip-glow:rgba(255,255,255,.10);
  --field:
    radial-gradient(120% 90% at 50% -10%, #4A1D7A 0%, rgba(74,29,122,0) 60%),
    radial-gradient(90% 70% at 100% 110%, #7A1D5E 0%, rgba(122,29,94,0) 55%),
    linear-gradient(180deg,#1B0B33 0%,#12071F 100%);
  --h1-fill: linear-gradient(180deg,#FFF8E9,#E7A9D8 90%);
  --wash: rgba(240,195,92,.13); --veil: rgba(18,7,32,.78);
  --face:#F2ECFF;
  --face-ink:#1B0A35;
  --sink: inset 1px 1px 3px rgba(0,0,0,.55), inset -1px -1px 1px rgba(255,255,255,.06);
  --raise: inset 0 1px 0 rgba(255,255,255,.10), 0 6px 20px rgba(0,0,0,.45);
  --ok-shadow: inset 1px 1px 3px rgba(0,0,0,.55), 0 0 22px -3px rgba(240,195,92,.60);
  --w-body:350; --w-disp:400;
}

/* §2  volume-local geometry only — no colour authored below this line */
:root{ --ease: cubic-bezier(.16,1,.3,1); }

/* The hidden attribute must win. A class rule carrying `display` has the same
   specificity as the browser's own `[hidden]` rule and, coming later, beats it
   — so `el.hidden = true` silently does nothing and the element stays put. An
   overlay that stays put swallows every press behind it. */
[hidden]{display:none !important}

*{box-sizing:border-box}
html,body{height:100%; margin:0}
body{
  background:var(--ground); color:var(--ink);
  background-image:var(--field); background-attachment:fixed;
  font-family:var(--body); font-weight:var(--w-body);
  font-size:16px; line-height:1.45;
  -webkit-text-size-adjust:100%; -webkit-tap-highlight-color:transparent;
  overflow:hidden; overscroll-behavior:none;
}
.app{
  height:100vh; height:100dvh; max-width:520px; margin:0 auto;
  display:flex; flex-direction:column; padding:0 var(--gutter);
}

/* ---------- masthead ---------- */
header{
  flex:0 0 auto; display:flex; align-items:center; gap:10px;
  padding:calc(env(safe-area-inset-top) + 14px) 0 8px;
}
h1{
  flex:1; margin:0; font-family:var(--serif); font-weight:var(--w-disp);
  font-size:clamp(1.9rem, 8.4vw, 2.5rem); line-height:.95; letter-spacing:.03em;
  background:var(--h1-fill); -webkit-background-clip:text; background-clip:text;
  color:transparent;
}
html[data-theme="glare"] h1{background:none; color:var(--ink)}
.icon{
  flex:0 0 auto; width:40px; height:40px; padding:0; cursor:pointer;
  display:grid; place-items:center; border-radius:var(--radius-pill);
  background:var(--plate); color:var(--gilt);
  border:1px solid var(--hair); box-shadow:var(--raise);
}
.icon svg{width:17px; height:17px; fill:none; stroke:currentColor;
  stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round}
.icon.off{color:var(--ink-2); opacity:.6}

/* ---------- counters ---------- */
.counters{flex:0 0 auto; display:flex; gap:7px; padding-bottom:12px}
.counter{
  flex:1; min-width:0; padding:8px 4px 9px; border-radius:var(--radius);
  background:var(--well); border:1px solid var(--hair); box-shadow:var(--sink);
  text-align:center;
}
.counter b{
  display:block; font-family:var(--util); font-size:1rem; font-weight:600;
  font-variant-numeric:tabular-nums; letter-spacing:-.03em; color:var(--ink);
  white-space:nowrap; overflow:hidden;
}
.counter span{display:block; font-size:.62rem; color:var(--ink-2); letter-spacing:.04em}
.counter.hot b{color:var(--gilt)}

/* ---------- the field ---------- */
.plate{
  flex:0 0 auto; position:relative; padding:14px; margin-bottom:12px;
  background:var(--plate); border:1px solid var(--hair);
  border-radius:var(--radius-plate); box-shadow:var(--raise);
}
.fieldwrap{
  position:relative; touch-action:none; user-select:none;
  /* the board is square, so capping its width caps its height. 300px is the
     counters, readout, controls, footer and gutters above and below it. */
  width:100%;
  width:max(180px, min(100%, calc(100vh - 300px)));
  width:max(180px, min(100%, calc(100dvh - 300px)));
  margin-inline:auto;
}
.grid{
  display:grid; grid-template-columns:repeat(6, 1fr); gap:6px;
  position:relative; z-index:1;
}
.trace{position:absolute; inset:0; z-index:2; pointer-events:none; overflow:visible}
.trace polyline{
  fill:none; stroke:var(--on-accent); stroke-width:3; stroke-linecap:round;
  stroke-linejoin:round; opacity:.75;
}
.trace polyline.ghost{stroke:var(--gilt); stroke-dasharray:5 5; opacity:.9}
.cell{
  position:relative; aspect-ratio:1; padding:0; cursor:pointer;
  display:grid; place-items:center; border-radius:var(--radius);
  background:var(--well); border:1px solid var(--hair); box-shadow:var(--sink);
  font-family:var(--serif); font-weight:var(--w-disp);
  font-size:clamp(1.05rem, 4.9vw, 1.5rem); line-height:1; color:var(--ink);
  transition:background .16s var(--ease), color .16s var(--ease),
             border-color .16s var(--ease), transform .12s var(--ease);
}
html[data-display="fallback"] .cell{font-weight:700; font-family:var(--body)}
.cell.taken{
  background:var(--accent); color:var(--on-accent);
  border-color:var(--accent); box-shadow:var(--raise);
}
.cell.head{transform:scale(1.06); outline:2px solid var(--gilt); outline-offset:2px; z-index:3}
.cell.start::after{
  content:""; position:absolute; inset:5px; border-radius:6px;
  border:1.5px dashed var(--gilt); opacity:.85; pointer-events:none;
}
.cell.reach{border-color:var(--gilt)}
.cell.best{outline:2px dashed var(--gilt); outline-offset:2px}
.cell:focus-visible, button:focus-visible{outline:2px solid var(--gilt); outline-offset:3px}
button:focus:not(:focus-visible){outline:none}
.gain{
  position:absolute; left:50%; top:0; transform:translate(-50%,-6px);
  font-family:var(--util); font-size:.7rem; font-weight:600; color:var(--gilt);
  pointer-events:none; animation:rise .7s var(--ease) forwards;
}
@keyframes rise{
  0%{opacity:0; transform:translate(-50%,2px)}
  25%{opacity:1}
  100%{opacity:0; transform:translate(-50%,-22px)}
}

/* ---------- readout ---------- */
.read{
  min-height:3.2em; margin:14px 0 2px; text-align:center;
  font-size:.86rem; color:var(--ink-2);
}
.read b{
  display:inline-block; font-family:var(--serif); font-weight:var(--w-disp);
  font-size:1.5rem; letter-spacing:.02em; color:var(--ink); margin-right:.35em;
}
html[data-display="fallback"] .read b{font-weight:700}
.read .pts{font-family:var(--util); font-size:.9rem; font-weight:600; color:var(--gilt)}
.read .hint{display:block; font-size:.82rem}

/* ---------- pills ---------- */
.controls{display:flex; gap:9px; padding-top:12px}
.btn{
  flex:1; min-height:var(--tap); font:inherit; font-size:.9rem; cursor:pointer;
  padding:0 8px; border-radius:var(--radius-pill);
  background:var(--plate); color:var(--ink-2);
  border:1px solid var(--hair); box-shadow:var(--raise);
  transition:transform .12s ease, color .2s, border-color .2s;
}
.btn:hover{color:var(--ink); border-color:var(--gilt)}
.btn:active{transform:translateY(1.5px)}
.btn[disabled]{opacity:.4; cursor:default}
.btn.go{flex:1.25; font-weight:600; background:var(--accent);
  border-color:var(--accent); color:var(--on-accent)}
html[data-theme="glare"] .btn.go{border-width:3px}

/* ---------- board strip ---------- */
.strip{
  flex:1 1 auto; min-height:0; overflow-y:auto; overscroll-behavior:contain;
  padding-top:6px; scrollbar-width:thin;
}
.strip::-webkit-scrollbar{width:3px}
.strip::-webkit-scrollbar-thumb{background:var(--hair); border-radius:3px}
.strip-head{display:flex; align-items:center; gap:8px; padding-bottom:10px}
.strip-head p{margin:0; flex:1; min-width:0; font-size:.8rem; color:var(--ink-2)}
.strip-head p strong{font-family:var(--util); color:var(--ink)}
.chip{
  flex:0 0 auto; font:inherit; font-size:.76rem; padding:9px 13px; cursor:pointer;
  border-radius:var(--radius-pill); white-space:nowrap;
  background:var(--plate); color:var(--gilt);
  border:1px solid var(--hair); box-shadow:var(--raise);
}
.chip:hover{border-color:var(--gilt)}
.chip[disabled]{opacity:.4; cursor:default}
.meter{
  height:3px; margin-bottom:14px; border-radius:var(--radius-pill);
  background:var(--well); box-shadow:var(--sink); overflow:hidden;
}
.meter i{
  display:block; height:100%; width:0; border-radius:var(--radius-pill);
  background:var(--accent); transition:width .5s var(--ease);
}
.rows{display:flex; flex-direction:column; gap:7px}
.row{
  display:flex; align-items:baseline; gap:10px; padding:9px 12px;
  border-radius:var(--radius); background:var(--well);
  border:1px solid var(--hair); box-shadow:var(--sink);
  font-size:.8rem; color:var(--ink-2);
}
.row b{font-family:var(--util); font-size:.9rem; color:var(--ink);
  font-variant-numeric:tabular-nums}
.row .grow{flex:1}
.row.crown{border-color:var(--gilt)}
.row.crown b{color:var(--gilt)}

/* ---------- footer ---------- */
footer{
  flex:0 0 auto; display:flex; gap:9px; align-items:center;
  padding:11px 0 calc(env(safe-area-inset-bottom) + 12px);
  border-top:1px solid var(--hair);
}
.seg{
  flex:1; display:flex; gap:5px; padding:4px; border-radius:var(--radius-pill);
  background:var(--well); border:1px solid var(--hair); box-shadow:var(--sink);
}
.seg button{
  flex:1; font:inherit; font-size:.78rem; padding:9px 2px; cursor:pointer;
  border:0; border-radius:var(--radius-pill); background:none; color:var(--ink-2);
  transition:background .3s var(--ease), color .3s var(--ease);
}
.seg button[aria-pressed="true"]{background:var(--accent); color:var(--on-accent); font-weight:600}
.wa{
  flex:0 0 auto; min-height:var(--tap); padding:0 15px; cursor:pointer;
  display:flex; align-items:center; gap:8px;
  font:inherit; font-size:.82rem; border-radius:var(--radius-pill);
  background:var(--plate); color:var(--gilt);
  border:1px solid var(--hair); box-shadow:var(--raise);
}
.wa svg{width:17px; height:17px; fill:none; stroke:currentColor;
  stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round}
.wa:hover{border-color:var(--gilt)}

/* ---------- toast ---------- */
.toast{
  position:fixed; left:50%; z-index:60;
  bottom:calc(env(safe-area-inset-bottom) + 84px);
  transform:translate(-50%,16px) scale(.97);
  max-width:84vw; padding:12px 18px; text-align:center;
  border-radius:var(--radius-plate);
  background:var(--plate); color:var(--ink);
  border:1px solid var(--hair); box-shadow:var(--raise);
  font-size:.84rem; opacity:0; pointer-events:none;
  transition:opacity .3s var(--ease), transform .42s var(--ease);
}
.toast b{font-family:var(--serif); font-weight:var(--w-disp); color:var(--gilt)}
.toast.up{opacity:1; transform:translate(-50%,0) scale(1)}

@media (min-width:900px){
  .app{
    max-width:1060px; display:grid; column-gap:30px;
    grid-template-columns:minmax(0,1fr) minmax(0,1fr);
    grid-template-rows:auto auto minmax(0,1fr) auto;
  }
  header{grid-column:1 / -1; grid-row:1}
  h1{font-size:2.6rem}
  .counters{grid-column:1; grid-row:2}
  .plate{grid-column:1; grid-row:3; align-self:start}
  .fieldwrap{width:max(180px, min(100%, calc(100dvh - 250px)))}
  footer{grid-column:1; grid-row:4}
  .strip{grid-column:2; grid-row:2 / 5; padding-bottom:20px}
  .toast{bottom:34px}
}

/* A very short viewport — a landscape phone or a squat desktop window. The
   board is already capped; trim the chrome around it so the two together
   still fit and the footer stays on screen. */
@media (max-height:560px){
  :root{--tap:44px}
  .counters{padding-bottom:6px}
  .counter{padding:5px 4px 6px}
  .counter b{font-size:.9rem}
  .read{min-height:2.2em; margin:8px 0 0}
  .read b{font-size:1.15rem}
  .controls{padding-top:8px}
  .btn{min-height:44px}
}
@media (max-height:560px){
  .fieldwrap{width:max(140px, min(100%, calc(100dvh - 230px)))}
}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:.01ms !important; animation-iteration-count:1 !important;
    transition-duration:.01ms !important}
}
@media (max-height:700px) and (max-width:899px){
  h1{font-size:1.7rem}
  .plate{padding:11px}
  .read{min-height:2.9em; margin:9px 0 0}
  .read b{font-size:1.3rem}
  .controls{padding-top:9px}
}
</style>

   on every device, so the seed comes from the slug and the date, never from

function seedFor(slug, date) {
  var s = slug + "|" + date, h = 2166136261 >>> 0;
  for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }

    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };

const REC = 55, BOARDS = PACKED.length / REC;

const N = 6, CELLS = 36, STEPS = 14, CAP = 5;
const EPOCH = Date.UTC(2026, 0, 1);

function board(i){
  const r = PACKED.slice(i*REC, i*REC + REC);
  const vals = r.slice(0,36).split("").map(Number);
  const best = r.slice(36,51).split("").map(c=>parseInt(c,36));
  return {i, vals, best, start:best[0], max:+r.slice(51,54), band:+r[54]};
}
const nbrs = (function(){
  const out = [];
  for(let i=0;i<CELLS;i++){
    const r=(i/N)|0, c=i%N, a=[];
    if(r>0)a.push(i-N); if(r<N-1)a.push(i+N);
    if(c>0)a.push(i-1); if(c<N-1)a.push(i+1);
    out.push(a);
  }
  return out;
})();
