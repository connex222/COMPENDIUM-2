<body>
<div class="frame">
  <div class="rubric-wrap">
    <p class="rubric">Drop <b>one</b> chip. Any well holding four topples, one chip to each neighbour. Empty every ringed well.</p>
  </div>

  <details class="howto" id="howto">
    <summary>How this works</summary>
    <div class="howto-body">
      <p>Every well holds chips. A well that reaches <b>four</b> topples: it
         sends one chip to each of its four neighbours and keeps none.</p>
      <svg viewBox="0 0 300 130" fill="none" stroke="currentColor" stroke-width="1.6"
           stroke-linecap="round" stroke-linejoin="round" role="img"
           aria-label="A well holding four chips topples, sending one chip up, down, left and right to its neighbours, and is left empty.">
        <rect x="14" y="34" width="62" height="62" rx="2"/>
        <circle cx="32" cy="52" r="4" fill="currentColor" stroke="none"/>
        <circle cx="58" cy="52" r="4" fill="currentColor" stroke="none"/>
        <circle cx="32" cy="78" r="4" fill="currentColor" stroke="none"/>
        <circle cx="58" cy="78" r="4" fill="currentColor" stroke="none"/>
        <text x="90" y="70" font-family="ui-monospace,monospace" font-size="15" fill="currentColor" stroke="none">&#8594;</text>
        <rect x="130" y="34" width="62" height="62" rx="2" stroke-dasharray="3 3"/>
        <path d="M161 30V12M161 100v18M126 65h-18M196 65h18"/>
        <path d="M157 18l4-6 4 6M157 112l4 6 4-6M114 61l-6 4 6 4M208 61l6 4-6 4"/>
        <text x="236" y="60" font-family="ui-monospace,monospace" font-size="11" fill="currentColor" stroke="none">empty</text>
        <text x="236" y="76" font-family="ui-monospace,monospace" font-size="11" fill="currentColor" stroke="none">after</text>
      </svg>
      <ol>
        <li>You drop <b>one</b> chip, into any well. That is your whole move.</li>
        <li>Toppling cascades: a well pushed to four topples in turn, and so on
            until nothing is left holding four.</li>
        <li>Chips pushed off the edge of the plate are gone.</li>
        <li>You win if every <b>ringed</b> well ends empty. Exactly one
            well on the board does it.</li>
      </ol>
    </div>
  </details>

  <nav class="sizes" id="sizes" aria-label="Board size"></nav>

  <div class="plate">
    <div class="grid" id="grid"></div>
    <div class="legend"><span id="lg-left">—</span><span id="lg-right">—</span></div>
  </div>

  <div class="verdict" id="verdict" aria-live="polite">
    <span class="word" id="v-word">—</span>
    <span class="line" id="v-line"></span>
  </div>

  <div class="actions">
    <button class="btn" data-rank="primary" type="button" id="next">Free board</button>
    <button class="btn" data-rank="secondary" type="button" id="reveal">Show the move</button>
    <button class="btn" data-rank="secondary" type="button" id="share" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 8.9 8.9 0 0 1-3.8-.8L3 20.5l1.4-4.1A8.4 8.4 0 0 1 12 3.1a8.4 8.4 0 0 1 9 8.4z"/>
        <path d="M8.8 9.2c0 3 2.2 5.2 5.2 5.2"/>
      </svg>
      <span>Share on WhatsApp</span>
    </button>
  </div>
  <p class="shared" id="shared" hidden></p>
</div>



<script>
/* ═══ Contract §4 — settings shim. Canonical, do not edit. ═══ */
window.C2 = (function () {
  "use strict";
  var slug = null, listeners = [];
  var set = { mode: "auto", sound: true, haptic: true };
  /* An srcdoc iframe has no URL of its own, so a volume cannot read or write
     a share fragment directly. The shell owns the address bar and passes the
     fragment down; the volume asks for it, and asks for it to be updated. */
  var ctx = { base: "", frag: "" };
  var embedded = (function () { try { return window.parent !== window; } catch (e) { return false; } })();

  function resolve(m) {
    if (m && m !== "auto") return m;
    try {
      return window.matchMedia("(prefers-color-scheme: dark)").matches ? "night" : "day";
    } catch (e) { return "day"; }
  }
  function apply(s) {
    if (s) { for (var k in s) if (s.hasOwnProperty(k)) set[k] = s[k]; }
    document.documentElement.setAttribute("data-theme", resolve(set.mode));
    listeners.forEach(function (fn) { try { fn(set); } catch (e) {} });
    if (window.VOLUME && window.VOLUME.settingsChanged) {
      try { window.VOLUME.settingsChanged(set); } catch (e) {}
    }
  }
  window.addEventListener("message", function (e) {
    var m = e.data;
    if (!m || m.c2 !== 1) return;
    if (m.type === "settings") {
      if (typeof m.base === "string") ctx.base = m.base;
      if (typeof m.frag === "string") ctx.frag = m.frag;
      apply(m.settings);
    }
    if (m.type === "mount") {
      var o = m.opts || {};
      if (typeof o.frag === "string") ctx.frag = o.frag;
      if (window.VOLUME && window.VOLUME.mount) window.VOLUME.mount(o);
    }
    if (m.type === "suspend") {
      if (window.VOLUME && window.VOLUME.suspend) window.VOLUME.suspend();
      if (api.onPause) api.onPause();
    }
  });

  var api = {
    register: function (v) {
      slug = v.slug;
      window.VOLUME = v;
      apply(readRaw("prefs", null));
      if (embedded) parent.postMessage({ c2: 1, type: "ready", slug: slug }, "*");
      else document.body && document.body.classList.add("standalone");
      return api;
    },
    settings: function () { return set; },
    mode: function () { return resolve(set.mode); },
    onSettings: function (fn) { listeners.push(fn); return api; },
    read: function (key, fallback) { return readRaw("v." + slug + "." + key, fallback); },
    write: function (key, value) { return writeRaw("v." + slug + "." + key, value); },
    haptic: function (pattern) {
      if (!set.haptic) return;
      try { navigator.vibrate && navigator.vibrate(pattern); } catch (e) {}
    },
    sound: function () { return !!set.sound; },
    /* The fragment this volume was opened with, if any. */
    frag: function () {
      if (embedded) return ctx.frag;
      var h = location.hash.replace(/^#/, "");
      return h.indexOf("/") > -1 ? h.slice(h.indexOf("/") + 1) : h;
    },
    /* A full, shareable URL that reopens this volume at this fragment. */
    link: function (frag) {
      if (embedded)
        return ctx.base ? ctx.base + "#" + slug + "/" + frag : "";
      if (location.protocol !== "http:" && location.protocol !== "https:") return "";
      return location.origin + location.pathname + "#" + frag;
    },
    /* Keep the address bar in step, so a refresh returns the same board. */
    setFrag: function (frag) {
      ctx.frag = frag;
      if (embedded) { parent.postMessage({ c2: 1, type: "frag", slug: slug, frag: frag }, "*"); return; }
      try {
        if (history.replaceState)
          history.replaceState(null, "", location.pathname + location.search + "#" + frag);
      } catch (e) {}
    },
    share: function (lines) {
      if (embedded) parent.postMessage({ c2: 1, type: "share", slug: slug, lines: lines }, "*");
      else window.open("https://wa.me/?text=" + encodeURIComponent(lines.join("\n")), "_blank", "noopener");
    },
    onPause: null
  };
  function readRaw(key, fallback) {
    try {
      var raw = localStorage.getItem("c2." + key);
      if (!raw) return fallback;
      var o = JSON.parse(raw);
      if (!o || o.v !== 1) return fallback;
      return o.d;
    } catch (e) { return fallback; }
  }
  function writeRaw(key, value) {
    try { localStorage.setItem("c2." + key, JSON.stringify({ v: 1, d: value })); return true; }
    catch (e) { return false; }
  }
  return api;
})();

/* Contract §7 — seeded randomness. Canonical. A daily board must be identical
   on every device, so the seed comes from the slug and the date, never from
   Math.random. */
function seedFor(slug, date) {
  var s = slug + "|" + date, h = 2166136261 >>> 0;
  for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
  return h >>> 0;
}
function rngFrom(seed) {
  return function () {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    var t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* ═══ Volume ═══ */
(function () {
  "use strict";

  var SLUG = "fell";

  /* Board sizes. Each is its own game: its own daily, its own stats, its
     own streak. Difficulty is measured in near misses, and the near-miss
     range grows with the board — 25 cells top out around 16, 49 cells run
     past 30 — so every rung below is re-anchored per size rather than
     shared. Ladders were fitted to measured yield and then pulled back
     until the slowest rung generates inside ~450ms. */
  var BOARDS = {
    /* 5x5 is untouched from v4 — same ladder, same cap — so dailies and
       streaks already banked against it stay exactly where they were. */
    5: { n:5, week:[12, 2, 4, 6,  8, 10, 11],
         ramp:[[0,4],[0,5],[2,6],[3,8],[4,10],[6,12]], free:6, cap:400000 },
    /* 6x6 and 7x7 were fitted, not guessed: the near-miss distribution was
       sampled per size and each v4 rung mapped to the value at the same
       percentile. The cap is generous because the search is sliced across
       frames rather than run in one block. */
    6: { n:6, week:[16, 2, 5, 6,  9, 12, 14],
         ramp:[[2,5],[2,6],[2,6],[5,9],[5,12],[6,16]], free:6, cap:120000 },
    7: { n:7, week:[18, 2, 7, 9, 12, 14, 16],
         ramp:[[2,7],[2,7],[2,9],[7,12],[7,14],[9,18]], free:9, cap:120000 }
  };

  var N = 5, SIZE = 25, BOARD = BOARDS[5];

  /* Difficulty is the near-miss count, and the week has a shape — gentle
     on Monday, brutal on Sunday, the way a crossword week does.
     Index 0 is Sunday. */
  /* Arriving on a Sunday should not mean your first ever board is the
     hardest one of the week. The first six boards climb their own ladder;
     the weekday curve takes over after that. */
  /* Keys carry the size, so a 7x7 streak can never be extended by a 5x5
     board and the stored state of one size never restores onto another. */
  /* 5x5 keeps v4's unsuffixed keys and unsuffixed seed, so a player who
     already has a streak on the original board keeps it, and today's 5x5
     daily is the same board it would have been. Only the new sizes take a
     suffix. */
  var K_STATE = "", K_STATS = "";
  /* §8 the namespace is the slug; the board size is part of the key. The
     daily seed still needs a per-size tag so 5x5 and 7x7 differ. */
  function tagFor(n) { return n === 5 ? SLUG : SLUG + n; }
  function keyFor(n, what) { return "c2.v." + SLUG + "." + what + (n === 5 ? "" : n); }
  function keysFor(n) {
    K_STATE = keyFor(n, "state");
    K_STATS = keyFor(n, "stats");
  }
  keysFor(5);

  /* ── Sandpile ─────────────────────────────────────────── */
  var NEIGH = [], DIRS = [];
  function buildTopology() {
    NEIGH = []; DIRS = [];
    for (var i = 0; i < SIZE; i++) {
      var r = Math.floor(i / N), c = i % N, list = [], dirs = [];
      [[-1,0],[1,0],[0,-1],[0,1]].forEach(function (d) {
        var rr = r + d[0], cc = c + d[1], inside = rr >= 0 && rr < N && cc >= 0 && cc < N;
        dirs.push({ d: d, cell: inside ? rr * N + cc : -1 });
        if (inside) list.push(rr * N + cc);
      });
      NEIGH.push(list); DIRS.push(dirs);
    }
  }
  buildTopology();

  function cascade(grid) {
    var g = grid.slice(), order = [], stack = [], k, guard = 0;
    for (k = 0; k < SIZE; k++) if (g[k] >= 4) stack.push(k);
    while (stack.length && guard++ < 20000) {
      var cell = stack.pop();
      if (g[cell] < 4) continue;
      g[cell] -= 4; order.push(cell);
      for (var j = 0; j < NEIGH[cell].length; j++) {
        var nb = NEIGH[cell][j];
        if (++g[nb] >= 4) stack.push(nb);
      }
      if (g[cell] >= 4) stack.push(cell);
    }
    return { grid: g, order: order };
  }

  /* Contract §6 — the verifier. Brute force over all 25 moves gives
     solvability, uniqueness and a measured difficulty, not an
     estimated one. Difficulty here is the near-miss count. */
  function analyse(grid, targets) {
    var sols = [], near = 0;
    for (var cell = 0; cell < SIZE; cell++) {
      var t = grid.slice(); t[cell] += 1;
      var out = cascade(t).grid, cleared = 0;
      for (var q = 0; q < targets.length; q++) if (out[targets[q]] === 0) cleared++;
      if (cleared === targets.length) sols.push(cell);
      else if (cleared === targets.length - 1) near++;
    }
    return { sols: sols, near: near };
  }

  /* Contract §7 — every random draw comes from the injected rng.
     A stray Math.random() here breaks the daily silently. */
  function candidate(rng) {
    var grid = [], k;
    for (k = 0; k < SIZE; k++) {
      var x = rng();
      grid.push(x < .13 ? 0 : x < .28 ? 1 : x < .45 ? 2 : 3);
    }
    var filled = [];
    for (k = 0; k < SIZE; k++) if (grid[k] > 0) filled.push(k);
    if (filled.length < 4) return null;
    for (k = filled.length - 1; k > 0; k--) {
      var s = (rng() * (k + 1)) | 0, tmp = filled[k];
      filled[k] = filled[s]; filled[s] = tmp;
    }
    return { grid: grid, targets: filled.slice(0, 2 + ((rng() * 3) | 0)) };
  }

  /* Only about one candidate in five hundred is uniquely solvable, so a
     49-well board needs tens of thousands of them. Searching in slices
     keeps the frame alive and lets the count be shown rather than hidden
     behind a frozen tap. Slicing never touches the draw order, so the
     board a seed yields is identical to the one a blocking search found —
     5x5 dailies from v4 come out unchanged. */
  function generateAsync(rng, minNear, maxNear, cap, done) {
    if (maxNear === undefined) maxNear = 99;
    var tries = 0, budget = SIZE > 30 ? 900 : 2500;
    function slice() {
      for (var n = 0; n < budget && tries < cap; n++) {
        tries++;
        var c = candidate(rng);
        if (!c) continue;
        var a = analyse(c.grid, c.targets);
        if (a.sols.length === 1 && a.near >= minNear && a.near <= maxNear) {
          return done({ grid: c.grid, targets: c.targets, answer: a.sols[0],
                        near: a.near, tries: tries });
        }
      }
      if (tries >= cap) return done(null);
      verdict("\u2014", "Cutting the board\u2026 " + tries + " candidates weighed.");
      setTimeout(slice, 0);
    }
    slice();
  }

  /* Walk the difficulty ladder down until a board is found. 5x5 steps by
     two, exactly as v4 did, so its history is bit-for-bit intact. Larger
     boards take one relaxed retry: the rungs are already wide enough that
     a second failure would mean the seed, not the rung, is the problem. */
  function generateLadder(seed, lo, hi, done) {
    if (N === 5) {
      var want = lo;
      (function step() {
        if (want < 0) return done(null);
        generateAsync(rngFrom(seed), want, hi, BOARD.cap, function (p) {
          if (p) return done(p);
          want -= 2; step();
        });
      })();
      return;
    }
    generateAsync(rngFrom(seed), lo, hi, BOARD.cap, function (p) {
      if (p) return done(p);
      generateAsync(rngFrom(seed), 0, 99, BOARD.cap, done);
    });
  }

  /* ═══ Contract §8 — storage helpers. Canonical, do not edit. ═══ */
  function read(key) {
    try {
      var raw = localStorage.getItem(key);
      if (!raw) return null;
      var o = JSON.parse(raw);
      return (o && o.v === 1) ? o : null;
    } catch (e) { return null; }
  }
  function write(key, obj) {
    obj.v = 1;
    try { localStorage.setItem(key, JSON.stringify(obj)); } catch (e) {}
  }
  function today() {
    var d = new Date();                       // local date, deliberately
    return d.getFullYear() + "-" +
           String(d.getMonth() + 1).padStart(2, "0") + "-" +
           String(d.getDate()).padStart(2, "0");
  }
  function yesterdayOf(dateStr) {
    var p = dateStr.split("-"), d = new Date(+p[0], +p[1] - 1, +p[2]);
    d.setDate(d.getDate() - 1);
    return d.getFullYear() + "-" +
           String(d.getMonth() + 1).padStart(2, "0") + "-" +
           String(d.getDate()).padStart(2, "0");
  }

  var stats = read(K_STATS) || { plays: 0, firstTry: 0, streak: 0, lastDaily: null };

  /* ── DOM ──────────────────────────────────────────────── */
  var gridEl = document.getElementById("grid"), cells = [], pipsEl = [];
  var puzzle = null, isDaily = false, locked = true, resolved = false;
  var hinted = null, revealed = false, attempts = 0, solvedIt = false, lastFires = 0;
  var loadToken = 0;

  function buildGrid() {
    gridEl.innerHTML = ""; cells = []; pipsEl = [];
    gridEl.style.setProperty("--n", String(N));
    for (var c2i = 0; c2i < SIZE; c2i++) {
      var b = document.createElement("button");
      b.className = "cell"; b.type = "button";
      var p = document.createElement("span");
      p.className = "pips"; p.setAttribute("data-n", "0");
      for (var d2 = 0; d2 < 7; d2++) p.appendChild(document.createElement("i"));
      b.appendChild(p);
      (function (idx) { b.addEventListener("click", function () { play(idx); }); })(c2i);
      gridEl.appendChild(b); cells.push(b); pipsEl.push(p);
    }
  }
  buildGrid();

  function paint(grid, targets, showCleared) {
    for (var k = 0; k < SIZE; k++) {
      var n = Math.max(0, Math.min(7, grid[k])), p = pipsEl[k];
      p.setAttribute("data-n", String(n));
      for (var j = 0; j < 7; j++) p.children[j].style.display = j < n ? "block" : "none";
      var el = cells[k], isT = targets.indexOf(k) !== -1;
      el.setAttribute("data-armed", (hinted === k && !resolved) ? "1" : "0");
      el.setAttribute("data-target", isT ? "1" : "0");
      if (grid[k] >= 4) el.setAttribute("data-unstable", "1"); else el.removeAttribute("data-unstable");
      if (isT && showCleared && grid[k] === 0) el.setAttribute("data-cleared", "1");
      else el.removeAttribute("data-cleared");
      el.setAttribute("aria-label", (isT ? "Ringed well, " : "Well, ") + grid[k] + " chips");
    }
  }
  function verdict(word, line) {
    document.getElementById("v-word").textContent = word;
    document.getElementById("v-line").innerHTML = line;
  }
  function legend() {
    document.getElementById("lg-left").textContent =
      stats.streak > 0 ? ("streak " + stats.streak) : (stats.firstTry + "/" + stats.plays + " first try");
    document.getElementById("lg-right").textContent = puzzle ? (puzzle.near + " near misses") : "—";
  }

  /* ── Voice: contract §4. One instrument, one moment. ───── */
  /* A pentatonic run, one step per row, extended as far as the tallest
     board needs. Low row at the bottom, so a cascade falling down the
     plate falls in pitch too. */
  var AC = null, master = null,
      SCALE = [220.00, 246.94, 293.66, 329.63, 392.00, 440.00, 493.88];
  function audioReady() {
    if (!C2.sound() || AC) return;
    var Ctor = window.AudioContext || window.webkitAudioContext;
    if (!Ctor) return;
    try {
      AC = new Ctor();
      master = AC.createGain(); master.gain.value = 0.5; master.connect(AC.destination);
    } catch (e) { AC = null; }
  }
  function voice(cellIndex) {
    C2.haptic(9);
    if (!C2.sound()) return;
    audioReady();
    if (!AC) return;
    if (AC.state === "suspended") AC.resume();
    var f = SCALE[N - 1 - Math.floor(cellIndex / N)], t = AC.currentTime;
    var osc = AC.createOscillator(), g = AC.createGain(), lp = AC.createBiquadFilter();
    osc.type = "triangle"; osc.frequency.setValueAtTime(f, t);
    lp.type = "lowpass"; lp.frequency.setValueAtTime(2600, t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.22, t + 0.004);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.20);
    osc.connect(lp); lp.connect(g); g.connect(master);
    osc.start(t); osc.stop(t + 0.22);
  }

  /* ── Flight ───────────────────────────────────────────── */
  function reduced() {
    try { return window.matchMedia("(prefers-reduced-motion: reduce)").matches; }
    catch (e) { return false; }
  }
  function launch(from, ms) {
    var el = cells[from];
    var sx = el.offsetLeft + el.offsetWidth / 2, sy = el.offsetTop + el.offsetHeight / 2;
    var pitch = el.offsetWidth + 7, made = [];
    DIRS[from].forEach(function (dir) {
      var f = document.createElement("span");
      f.className = "flyer";
      f.style.setProperty("--flight", ms + "ms");
      var half = Math.min(13, window.innerWidth * 0.042) / 2;
      f.style.left = (sx - half) + "px"; f.style.top = (sy - half) + "px";
      gridEl.appendChild(f); made.push(f);
      void f.offsetWidth;
      f.style.transform = "translate(" + dir.d[1] * pitch + "px," + dir.d[0] * pitch + "px)";
      if (dir.cell === -1) f.style.opacity = "0";
    });
    return made;
  }

  /* ── Play ─────────────────────────────────────────────── */
  function play(cell) { commit(cell); }

  function commit(cell) {
    if (locked || !puzzle) return;
    locked = true; hinted = null;
    audioReady();
    for (var k = 0; k < SIZE; k++) cells[k].disabled = true;

    var start = puzzle.grid.slice(); start[cell] += 1;
    var res = cascade(start.slice());
    var correct = (cell === puzzle.answer);

    attempts++;
    var counts = (attempts === 1 && !revealed);
    stats.plays++;
    if (correct && counts) stats.firstTry++;
    /* A retried or revealed board is still a solved board, but it neither
       counts as a first try nor extends the streak. A fat-thumbed tap
       costs you the streak, not the day. */
    if (isDaily && correct && counts) {
      stats.streak = (stats.lastDaily === yesterdayOf(today())) ? stats.streak + 1 : 1;
      stats.lastDaily = today();
    }
    write(K_STATS, stats);

    /* Contract §9: persisted the moment the move completes, not on
       unload. Animation state is never stored; a resumed board is
       always a settled board. */
    write(K_STATE, {
      date: today(), daily: isDaily, seed: puzzle.seed, n: N,
      grid: puzzle.grid, targets: puzzle.targets,
      answer: puzzle.answer, near: puzzle.near,
      played: cell, settled: res.grid, fires: res.order.length,
      correct: correct, revealed: revealed, attempts: attempts
    });

    var live = start.slice();
    paint(live, puzzle.targets, false);
    verdict("\u2014", "Toppling\u2026");

    if (reduced() || res.order.length === 0) { finish(res.grid, correct, res.order.length); return; }

    var per = Math.max(70, Math.min(150, 2400 / res.order.length));
    var flight = Math.round(per * 0.8), gap = Math.round(per * 0.2), step = 0;

    (function run() {
      if (step >= res.order.length) { finish(live, correct, res.order.length); return; }
      var f = res.order[step++];
      voice(f);
      live[f] -= 4;
      paint(live, puzzle.targets, false);
      var flyers = launch(f, flight);
      setTimeout(function () {
        flyers.forEach(function (n) { if (n.parentNode) n.parentNode.removeChild(n); });
        for (var j = 0; j < NEIGH[f].length; j++) live[NEIGH[f][j]] += 1;
        paint(live, puzzle.targets, false);
        setTimeout(run, gap);
      }, flight);
    })();
  }

  function finish(grid, correct, fires) {
    resolved = true; solvedIt = correct; lastFires = fires;
    var missed = 0;
    for (var t = 0; t < puzzle.targets.length; t++) if (grid[puzzle.targets[t]] !== 0) missed++;
    paint(grid, puzzle.targets, true);
    if (correct) verdict("Felled.", fires + " topples from one chip.");
    else if (missed === 1) verdict("One well short.",
      fires + " topples \u00b7 one of this board\u2019s " + puzzle.near + " near misses.");
    else verdict("Short by " + missed + ".", fires + " topples.");
    legend();
    setButtons();
  }

  /* Spoiler-safe by construction: the shared line carries the outcome and
     the shape of the board, never the cell that solves it. Two people on
     the same day already hold the same daily, so no seed needs sending. */
  function shareText() {
    var head = "Fell \u00b7 " + N + "\u00d7" + N +
               (isDaily ? " \u00b7 " + today() : " \u00b7 free board");
    var how;
    if (!solvedIt) how = "Not felled";
    else if (revealed) how = "Felled, with the move shown";
    else if (attempts === 1) how = "Felled first try";
    else how = "Felled on attempt " + attempts;

    var lines = [head, how + " \u00b7 " + lastFires + " topples \u00b7 " +
                 puzzle.near + " near misses"];
    if (isDaily && stats.streak > 0) lines.push("Streak " + stats.streak);
    lines.push(isDaily ? ("Today\u2019s " + N + "\u00d7" + N + " board is the same for everyone:")
                       : "Think you can do better?");
    if (location.protocol === "http:" || location.protocol === "https:")
      lines.push(location.href.split("#")[0]);
    return lines.join("\n");
  }

  function note(msg) {
    var n = document.getElementById("shared");
    n.textContent = msg || "";
    n.hidden = !msg;
  }

  function shareResult() {
    if (!puzzle) return;
    var text = shareText();
    C2.share(text.split("\n"));
    var w = true;
    if (w) { note(""); return; }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text)
        .then(function () { note("Result copied. Paste it into a chat."); })
        .catch(function () { note("Couldn\u2019t open WhatsApp."); });
    } else {
      note("Couldn\u2019t open WhatsApp.");
    }
  }

  function setButtons() {
    var next = document.getElementById("next"), rev = document.getElementById("reveal");
    document.getElementById("share").hidden = !resolved;
    next.textContent = isDaily ? "Free board" : "Another";
    if (resolved && !solvedIt) {
      rev.textContent = "Try again";
      rev.disabled = false;
    } else {
      rev.textContent = "Show the move";
      rev.disabled = resolved;
    }
  }

  /* ── Mount ────────────────────────────────────────────── */
  function present(p, daily) {
    puzzle = p; isDaily = daily; resolved = false; locked = false;
    hinted = null; revealed = false; attempts = 0; solvedIt = false;
    for (var k = 0; k < SIZE; k++) cells[k].disabled = false;
    note("");
    paint(p.grid, p.targets, false);
    legend();
    verdict("Ready", "One placement clears every ring. " + p.near +
            " others clear all but one.<br>Cut from " + p.tries + " candidate boards.");
    setButtons();
  }

  function restore() {
    var s = read(K_STATE);
    if (!s || !s.daily || s.date !== today()) return false;
    if (s.n && s.n !== N) return false;
    if (!s.grid || s.grid.length !== SIZE) return false;
    puzzle = { grid: s.grid, targets: s.targets, answer: s.answer, near: s.near, seed: s.seed, tries: 0 };
    isDaily = true; locked = true; hinted = null; revealed = !!s.revealed;
    attempts = s.attempts || 1; solvedIt = !!s.correct;
    for (var k = 0; k < SIZE; k++) cells[k].disabled = true;
    finish(s.settled, s.correct, s.fires);
    return true;
  }

  function searching() {
    locked = true;
    for (var k = 0; k < SIZE; k++) cells[k].disabled = true;
    document.getElementById("share").hidden = true;
    verdict("\u2014", "Cutting the board\u2026");
  }

  function loadDaily() {
    if (restore()) return;
    var seed = seedFor(tagFor(N), today());  // a distinct daily per size
    var learning = stats.plays < BOARD.ramp.length;
    var lo = learning ? BOARD.ramp[stats.plays][0] : BOARD.week[new Date().getDay()];
    var hi = learning ? BOARD.ramp[stats.plays][1] : 99;
    var token = ++loadToken;
    searching();
    generateLadder(seed, lo, hi, function (p) {
      if (token !== loadToken) return;          // a size switch overtook this search
      if (!p) { verdict("\u2014", "No board found. Tap Free board."); return; }
      p.seed = seed; p.want = lo;
      present(p, true);
    });
  }

  function loadFree() {
    var seed = (Math.random() * 4294967296) >>> 0;   // free play only, never the daily
    var token = ++loadToken;
    searching();
    generateAsync(rngFrom(seed), BOARD.free, 99, BOARD.cap, function (p) {
      if (token !== loadToken) return;
      if (!p) { verdict("\u2014", "No board found. Tap for another."); return; }
      p.seed = seed;
      present(p, false);
    });
  }

  /* Switching size rebuilds the board and reloads that size's own daily.
     Stats are re-read because each size keeps its own. */
  var sizesEl = document.getElementById("sizes");
  function renderSizes() {
    sizesEl.innerHTML = "";
    [5, 6, 7].forEach(function (n) {
      var b = document.createElement("button");
      b.type = "button";
      b.setAttribute("aria-pressed", String(n === N));
      b.innerHTML = n + "\u00d7" + n + "<small>" + (n * n) + " wells</small>";
      b.addEventListener("click", function () { setSize(n, true); });
      sizesEl.appendChild(b);
    });
  }

  function setSize(n, andLoad) {
    if (n === N) return false;
    N = n; SIZE = n * n; BOARD = BOARDS[n];
    keysFor(n);
    stats = read(K_STATS) || { plays: 0, firstTry: 0, streak: 0, lastDaily: null };
    C2.write("size", n);
    loadToken++;                     // abandon anything still searching
    buildTopology();
    buildGrid();
    renderSizes();
    note("");
    if (andLoad) loadDaily();
    return true;
  }

  try {
    var savedN = parseInt(C2.read("size", ""), 10);
    if (BOARDS[savedN] && savedN !== N) {
      N = savedN; SIZE = savedN * savedN; BOARD = BOARDS[savedN];
      keysFor(savedN);
      stats = read(K_STATS) || { plays: 0, firstTry: 0, streak: 0, lastDaily: null };
      buildTopology(); buildGrid();
    }
  } catch (e) {}
  renderSizes();

  /* The how-to opens itself once, the first time this volume is ever run,
     then stays shut. No tutorial screen, no dismiss button to hunt for. */
  var K_TAUGHT = "c2.v." + SLUG + ".taught";
  var howto = document.getElementById("howto");
  if (howto) {
    var taught = false;
    try { taught = localStorage.getItem(K_TAUGHT) === "1" || !!stats.taught; } catch (e) {}
    if (!taught) howto.setAttribute("open", "");
    howto.addEventListener("toggle", function () {
      if (!howto.hasAttribute("open") && !taught) {
        taught = true;
        try { localStorage.setItem(K_TAUGHT, "1"); } catch (e) {}
      }
    });
  }

  document.getElementById("share").addEventListener("click", shareResult);
  document.getElementById("next").addEventListener("click", loadFree);
  document.getElementById("reveal").addEventListener("click", function () {
    if (!puzzle) return;
    /* The retry has to sit ahead of the locked guard: a finished board is
       locked by definition, and the retry is the thing that unlocks it. */
    if (resolved && !solvedIt) {            // acting as Try again
      resolved = false; locked = false; hinted = null;
      for (var k = 0; k < SIZE; k++) cells[k].disabled = false;
      paint(puzzle.grid, puzzle.targets, false);
      setButtons();
      verdict("Again.", "Same board \u00b7 attempt " + (attempts + 1) +
              " \u00b7 no longer counts toward the streak.");
      return;
    }
    if (locked || resolved) return;
    revealed = true;
    hinted = puzzle.answer;
    paint(puzzle.grid, puzzle.targets, false);
    cells[puzzle.answer].focus();
    setButtons();
    verdict("Row " + (Math.floor(puzzle.answer / N) + 1) + ", column " + (puzzle.answer % N + 1) + ".",
            "Outlined \u00b7 this board no longer counts toward the streak.");
  });

  /* ── Contract §5 — the interface the shell talks to ────── */
  C2.register({
    slug: SLUG,
    numeral: "I",
    name: "Fell",
    line: "One move. The whole puzzle resolves or it does not.",
    mark: '<path d="M4 20 20 4"/><path d="M6 6h5M18 18h-5"/>',
    mount: function (opts) {
      opts = opts || {};
      if (BOARDS[opts.size]) setSize(opts.size, false);
      if (opts.mode === "free") loadFree(); else loadDaily();
    },
    status: function () {                      // cheap: reads cached stats only
      var s = read(K_STATE);
      return {
        doneToday: !!(s && s.daily && s.date === today() && (!s.n || s.n === N)),
        streak: stats.streak,
        size: N
      };
    },
    settingsChanged: function () {},           // tokens do the work; nothing to redraw
    suspend: function () { write(K_STATS, stats); }
  });

  /* ── Standalone (contract §1) ─────────────────────────
     The shim adds body.standalone and resolves the reading mode from the
     system. No settings controls here: §11 gives those to the shell. */
  if (window.self === window.top) window.VOLUME.mount({ mode: "daily" });

})();
<\/script>
</body>
</html>
</script>
<script type="text/plain" id="vol-mirrorwork"><!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12071F">
<meta name="description" content="Mirrorwork — a card-matching memory game with five procedurally drawn decks.">
<title>Mirrorwork — a memory game</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='18' fill='%232A1050'/><circle cx='50' cy='50' r='30' fill='none' stroke='%23F0C35C' stroke-width='5'/><circle cx='50' cy='50' r='11' fill='%23F0C35C'/></svg>">
<style>
  :root {
  --serif: "Didot", "Bodoni MT", "Playfair Display", Georgia, "Times New Roman", serif;
  --body: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --util: ui-monospace, "SF Mono", "Cascadia Mono", "Roboto Mono", Menlo, monospace;
  --tap: 52px;
  --gutter: 20px;
  --radius: 10px;
  --radius-pill: 999px;
  --radius-plate: 18px;
}
html[data-theme="day"] {
  --ground:#EFE8F8; --plate:#F8F4FD; --well:#E5DBF3;
  --ink:#241041; --ink-2:#6B5590; --hair:#7E64AC;
  --accent:#4A1D7A; --on-accent:#FFF8E9; --chip:#3A1A66; --gilt:#8E6110;
  --pip-hi:#8A72B4; --pip-lo:#180830; --pip-glow:rgba(255,255,255,.6);
  --field:
    radial-gradient(120% 90% at 50% -10%, #F5E8FF 0%, rgba(245,232,255,0) 60%),
    radial-gradient(90% 70% at 100% 110%, #FFEAD6 0%, rgba(255,234,214,0) 55%),
    linear-gradient(180deg,#F2EBFA 0%,#E7DEF3 100%);
  --h1-fill: linear-gradient(180deg,#2E1350,#7A3A9E 92%);
  --wash: rgba(74,29,122,.10); --veil: rgba(36,16,65,.55);
  --face:#FFFFFF;
  --face-ink:#180830;
  --sink: inset 1px 1px 3px rgba(36,16,65,.18), inset -1px -1px 1px rgba(255,255,255,.85);
  --raise: 0 1px 0 rgba(255,255,255,.7), 0 4px 14px rgba(36,16,65,.10);
  --ok-shadow: inset 1px 1px 3px rgba(36,16,65,.18), 0 0 18px -3px rgba(74,29,122,.50);
  --w-body:400; --w-disp:500;
}
html[data-theme="glare"] {
  --ground:#FFFFFF; --plate:#FFFFFF; --well:#FFFFFF;
  --ink:#000000; --ink-2:#000000; --hair:#000000;
  --accent:#000000; --on-accent:#FFFFFF; --chip:#000000; --gilt:#000000;
  --pip-hi:#000000; --pip-lo:#000000; --pip-glow:transparent;
  --field:#FFFFFF;
  --h1-fill: none;
  --wash: transparent; --veil: rgba(0,0,0,.65);
  --face:#FFFFFF;
  --face-ink:#000000;
  --sink: none; --raise: none; --ok-shadow: none;
  --w-body:600; --w-disp:700;
}
html[data-theme="night"] {
  --ground:#12071F; --plate:#241041; --well:#1B0A35;
  --ink:#F6F1FF; --ink-2:#B49BD8; --hair:rgba(240,195,92,.55);
  --accent:#F0C35C; --on-accent:#22093C; --chip:#F0C35C; --gilt:#F0C35C;
  --pip-hi:#FFF0C4; --pip-lo:#A76F14; --pip-glow:rgba(255,255,255,.10);
  --field:
    radial-gradient(120% 90% at 50% -10%, #4A1D7A 0%, rgba(74,29,122,0) 60%),
    radial-gradient(90% 70% at 100% 110%, #7A1D5E 0%, rgba(122,29,94,0) 55%),
    linear-gradient(180deg,#1B0B33 0%,#12071F 100%);
  --h1-fill: linear-gradient(180deg,#FFF8E9,#E7A9D8 90%);
  --wash: rgba(240,195,92,.13); --veil: rgba(18,7,32,.78);
  --face:#F2ECFF;
  --face-ink:#1B0A35;
  --sink: inset 1px 1px 3px rgba(0,0,0,.55), inset -1px -1px 1px rgba(255,255,255,.06);
  --raise: inset 0 1px 0 rgba(255,255,255,.10), 0 6px 20px rgba(0,0,0,.45);
  --ok-shadow: inset 1px 1px 3px rgba(0,0,0,.55), 0 0 22px -3px rgba(240,195,92,.60);
  --w-body:350; --w-disp:400;
}

/* §2  volume-local geometry and aliases only — no colour authored below.
   Mirrorwork was written before the contract with its own variable names.
   Rather than rewrite every rule, those names are re-pointed at canonical
   tokens here, once. */
:root{
  --dim: var(--ink-2);
  --gold: var(--gilt);
  --gold-dim: var(--hair);
  --mono: var(--util);
  --sans: var(--body);
  --gap:10px; --rail:460px;
  --t-label:9.5px; --t-value:17px; --t-ui:11px;
}

/* The hidden attribute must win. A class rule carrying `display` has the same
   specificity as the browser's own `[hidden]` rule and, coming later, beats it
   — so `el.hidden = true` silently does nothing and the element stays put. An
   overlay that stays put swallows every press behind it. */
[hidden]{display:none !important}
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0; min-height:100vh; min-height:100dvh;
    padding:calc(18px + env(safe-area-inset-top)) calc(14px + env(safe-area-inset-right))
            calc(18px + env(safe-area-inset-bottom)) calc(14px + env(safe-area-inset-left));
    font-family:var(--sans); color:var(--ink);
    -webkit-tap-highlight-color:transparent; -webkit-touch-callout:none;
    background:var(--ground);background-image:var(--field);
    background-attachment:fixed;
  }
  button{font-family:inherit;color:inherit;touch-action:manipulation}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

  /* ---- shell ------------------------------------------------------ */
  .shell{display:flex;flex-direction:column;align-items:center;gap:4px}
  .rail{width:100%;max-width:var(--rail)}
  .stage{width:100%;display:flex;justify-content:center}

  /* ---- header ----------------------------------------------------- */
  .head{position:relative;text-align:center;margin-bottom:12px}
  .eyebrow{margin:0 0 5px;font-size:var(--t-ui);letter-spacing:.28em;text-transform:uppercase;color:var(--gold);opacity:.85}
  h1{margin:0;font-family:var(--serif);font-weight:400;font-size:clamp(32px,8vw,44px);letter-spacing:.05em;line-height:1;
     background:var(--h1-fill);-webkit-background-clip:text;background-clip:text;color:transparent}
  .icobtn{position:absolute;top:0;width:40px;height:40px;border-radius:50%;cursor:pointer;
     border:1px solid var(--gold-dim);background:var(--well);color:var(--gold);
     display:flex;align-items:center;justify-content:center;transition:background .2s,color .2s,opacity .2s}
  .icobtn:hover{background:var(--gold);color:var(--on-accent)}
  .icobtn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
  .icobtn svg{width:17px;height:17px}
  #sound{right:0}
  #pause{left:0}
  #sound.off{color:var(--dim);opacity:.65}
  #pause:disabled{opacity:.3;cursor:default}
  #pause:disabled:hover{background:var(--well);color:var(--gold)}

  /* ---- stats ------------------------------------------------------ */
  .stats{display:flex;align-items:center;gap:8px;margin-bottom:12px;
    padding:10px 12px;border:1px solid var(--gold-dim);border-radius:14px;background:var(--well)}
  .stat{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}
  .k{font-size:var(--t-label);letter-spacing:.2em;text-transform:uppercase;color:var(--dim)}
  .v{font-family:var(--mono);font-size:var(--t-value);font-variant-numeric:tabular-nums}
  .v i{font-style:normal;font-size:.72em;color:var(--dim)}
  #shuffle{flex:0 0 auto;font-size:var(--t-ui);letter-spacing:.14em;text-transform:uppercase;color:var(--gold);
    background:transparent;border:1px solid var(--gold-dim);border-radius:999px;padding:10px 14px;cursor:pointer;
    transition:background .2s,color .2s}
  #shuffle:hover{background:var(--gold);color:var(--on-accent)}
  #shuffle:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

  .chal
  .chal{display:flex;align-items:center;gap:9px;margin:0 0 12px;padding:10px 13px;border-radius:12px;
    border:1px solid var(--hair);background:var(--wash);text-align:left}
  .chal svg{width:16px;height:16px;flex:0 0 auto;color:var(--gold)}
  .chal span{font-size:var(--t-ui);letter-spacing:.06em;line-height:1.5}
  .chal b{display:block;font-weight:400;color:var(--gold);letter-spacing:.16em;text-transform:uppercase;font-size:9.5px}

  /* ---- pickers ---------------------------------------------------- */
  .sizes{display:flex;gap:7px;margin-bottom:10px}
  .size{flex:1;min-height:46px;padding:8px 4px;border-radius:11px;cursor:pointer;font-size:12px;letter-spacing:.1em;
    color:var(--dim);background:var(--well);border:1px solid var(--hair);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transition:.2s}
  .size small{font-size:9px;letter-spacing:.12em;text-transform:uppercase;opacity:.7}
  .size.on{border-color:var(--gold);background:var(--wash);color:var(--ink)}
  .size:focus-visible,.chip:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

  .decks{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;
    scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
  .decks::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;width:84px;padding:9px 6px 8px;border-radius:14px;cursor:pointer;scroll-snap-align:center;
    background:var(--well);border:1px solid var(--hair);
    display:flex;flex-direction:column;align-items:center;gap:5px;color:var(--dim);transition:.2s}
  .chip:hover{transform:translateY(-2px)}
  .chip.on{border-color:var(--gold);background:var(--wash);color:var(--ink)}
  .chip-art{width:30px;height:30px}
  .chip-art svg{width:100%;height:100%;display:block}
  .chip-name{font-size:var(--t-ui);letter-spacing:.08em}
  .pips{display:flex;gap:2.5px}
  .pips i{width:4px;height:4px;border-radius:50%;background:var(--hair)}
  .pips i.on{background:var(--gold)}

  .opt{width:100%;margin-top:8px;min-height:44px;padding:10px 14px;border-radius:12px;cursor:pointer;
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    background:var(--well);border:1px solid var(--hair);color:var(--dim);transition:.2s}
  .opt b{font-weight:400;font-size:12px;letter-spacing:.1em}
  .opt small{display:block;font-size:9px;letter-spacing:.12em;text-transform:uppercase;opacity:.6;margin-top:2px}
  .opt .txt{text-align:left}
  .opt.on{border-color:var(--gold);background:var(--wash);color:var(--ink)}
  .sw{flex:0 0 auto;width:36px;height:20px;border-radius:999px;background:var(--well);
    position:relative;transition:background .2s}
  .sw::after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;
    background:var(--dim);transition:transform .2s,background .2s}
  .opt.on .sw{background:var(--accent)}
  .opt.on .sw::after{transform:translateX(16px);background:var(--gold)}
  .opt:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

  .note{margin:10px 0 0;text-align:center;font-size:var(--t-ui);letter-spacing:.1em;
    text-transform:uppercase;color:var(--dim);opacity:.6;line-height:1.7}

  /* ---- board ------------------------------------------------------ */
  .boardwrap{position:relative;
    /* cards are 3:4 and the grid is square in count, so the board stands about
       4/3 taller than it is wide — the width cap has to allow for that */
    width:max(160px, min(100%, calc((100vh - 300px) * 0.75)));
    width:max(160px, min(100%, calc((100dvh - 300px) * 0.75)));
    margin-inline:auto}
  #board{display:grid;gap:var(--gap);margin:0 auto}

  .scene{position:relative;aspect-ratio:3/4;padding:0;border:0;background:none;cursor:pointer;
    border-radius:var(--radius);perspective:1000px;contain:layout paint;
    touch-action:manipulation;user-select:none;-webkit-user-select:none}
  .scene:disabled{cursor:default}
  .scene:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
  .card{position:relative;display:block;width:100%;height:100%;transform-style:preserve-3d;
    transition:transform .5s cubic-bezier(.2,.85,.25,1)}
  .card.flipped{transform:rotateY(180deg)}
  .face{position:absolute;inset:0;border-radius:var(--radius);overflow:hidden;
    display:flex;align-items:center;justify-content:center;
    backface-visibility:hidden;-webkit-backface-visibility:hidden}
  .face svg{width:100%;height:100%;display:block;
    /* the deck runs to pale yellows that vanish on a light face; an outline
       carries every hue without touching the palettes */
    filter:drop-shadow(0 0 1.1px var(--face-ink)) drop-shadow(0 0 1.1px var(--face-ink))}
  .back{background:var(--plate);background-image:var(--field);
    border:1px solid var(--hair);box-shadow:var(--raise)}
  .front{transform:rotateY(180deg);padding:9%;
    background:var(--face);
    border:1px solid var(--hair);box-shadow:var(--raise)}
  .ornament{aspect-ratio:3/4;border-radius:var(--radius);overflow:hidden;pointer-events:none;
    display:flex;align-items:center;justify-content:center;padding:7%;
    background:var(--plate);background-image:var(--field);
    border:1px solid var(--hair);
    box-shadow:var(--raise)}
  .ornament svg{width:100%;height:100%;display:block}
  #board.peek .card,#board.peekout .card{transition-delay:var(--d,0ms)}
  #board.peek .card{transform:rotateY(180deg)}
  .peekbar
  .peekbar{position:absolute;left:0;right:0;bottom:-11px;height:3px;border-radius:2px;
    background:var(--wash);overflow:hidden;z-index:3}
  .peekbar i{display:block;height:100%;background:var(--gold);transform-origin:left center;
    transform:scaleX(1);transition:transform linear}

  .scene.matched{opacity:.9}
  .scene.matched .front{box-shadow:0 0 0 2px var(--accent),0 8px 26px var(--wash);
    animation:pop .45s cubic-bezier(.3,1.4,.5,1)}
  .scene.wrong .front{animation:shake .4s ease}
  @keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.07)}100%{transform:scale(1)}}
  @keyframes shake{0%,100%{transform:rotateY(180deg) translateX(0)}
    25%{transform:rotateY(180deg) translateX(-4px)}75%{transform:rotateY(180deg) translateX(4px)}}

  /* ---- pause veil -------------------------------------------------- */
  .veil
  .veil{position:absolute;inset:-8px;width:calc(100% + 16px);border:0;cursor:pointer;color:var(--ink);
    display:flex;align-items:center;justify-content:center;z-index:4;
    border-radius:18px;background:var(--veil);backdrop-filter:blur(8px)}
  .veil span{font-family:var(--serif);font-size:22px;letter-spacing:.06em}
  .veil small{display:block;margin-top:6px;font-family:var(--sans);font-size:var(--t-ui);
    letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}

  /* ---- victory ----------------------------------------------------- */

<script>
"use strict";

window.C2 = (function () {
  "use strict";
  var slug = null, listeners = [];
  var set = { mode: "auto", sound: true, haptic: true };
  /* An srcdoc iframe has no URL of its own, so a volume cannot read or write
     a share fragment directly. The shell owns the address bar and passes the
     fragment down; the volume asks for it, and asks for it to be updated. */
  var ctx = { base: "", frag: "" };
  var embedded = (function () { try { return window.parent !== window; } catch (e) { return false; } })();

  function resolve(m) {
    if (m && m !== "auto") return m;
    try {
      return window.matchMedia("(prefers-color-scheme: dark)").matches ? "night" : "day";
    } catch (e) { return "day"; }
  }
  function apply(s) {
    if (s) { for (var k in s) if (s.hasOwnProperty(k)) set[k] = s[k]; }
    document.documentElement.setAttribute("data-theme", resolve(set.mode));
    listeners.forEach(function (fn) { try { fn(set); } catch (e) {} });
    if (window.VOLUME && window.VOLUME.settingsChanged) {
      try { window.VOLUME.settingsChanged(set); } catch (e) {}
    }
  }
  window.addEventListener("message", function (e) {
    var m = e.data;
    if (!m || m.c2 !== 1) return;
    if (m.type === "settings") {
      if (typeof m.base === "string") ctx.base = m.base;
      if (typeof m.frag === "string") ctx.frag = m.frag;
      apply(m.settings);
    }
    if (m.type === "mount") {
      var o = m.opts || {};
      if (typeof o.frag === "string") ctx.frag = o.frag;
      if (window.VOLUME && window.VOLUME.mount) window.VOLUME.mount(o);
    }
    if (m.type === "suspend") {
      if (window.VOLUME && window.VOLUME.suspend) window.VOLUME.suspend();
      if (api.onPause) api.onPause();
    }
  });

  var api = {
    register: function (v) {
      slug = v.slug;
      window.VOLUME = v;
      apply(readRaw("prefs", null));
      if (embedded) parent.postMessage({ c2: 1, type: "ready", slug: slug }, "*");
      else document.body && document.body.classList.add("standalone");
      return api;
    },
    settings: function () { return set; },
    mode: function () { return resolve(set.mode); },
    onSettings: function (fn) { listeners.push(fn); return api; },
    read: function (key, fallback) { return readRaw("v." + slug + "." + key, fallback); },
    write: function (key, value) { return writeRaw("v." + slug + "." + key, value); },
    haptic: function (pattern) {
      if (!set.haptic) return;
      try { navigator.vibrate && navigator.vibrate(pattern); } catch (e) {}
    },
    sound: function () { return !!set.sound; },
    /* The fragment this volume was opened with, if any. */
    frag: function () {
      if (embedded) return ctx.frag;
      var h = location.hash.replace(/^#/, "");
      return h.indexOf("/") > -1 ? h.slice(h.indexOf("/") + 1) : h;
    },
    /* A full, shareable URL that reopens this volume at this fragment. */
    link: function (frag) {
      if (embedded)
        return ctx.base ? ctx.base + "#" + slug + "/" + frag : "";
      if (location.protocol !== "http:" && location.protocol !== "https:") return "";
      return location.origin + location.pathname + "#" + frag;
    },
    /* Keep the address bar in step, so a refresh returns the same board. */
    setFrag: function (frag) {
      ctx.frag = frag;
      if (embedded) { parent.postMessage({ c2: 1, type: "frag", slug: slug, frag: frag }, "*"); return; }
      try {
        if (history.replaceState)
          history.replaceState(null, "", location.pathname + location.search + "#" + frag);
      } catch (e) {}
    },
    share: function (lines) {
      if (embedded) parent.postMessage({ c2: 1, type: "share", slug: slug, lines: lines }, "*");
      else window.open("https://wa.me/?text=" + encodeURIComponent(lines.join("\n")), "_blank", "noopener");
    },
    onPause: null
  };
  function readRaw(key, fallback) {
    try {
      var raw = localStorage.getItem("c2." + key);
      if (!raw) return fallback;
      var o = JSON.parse(raw);
      if (!o || o.v !== 1) return fallback;
      return o.d;
    } catch (e) { return fallback; }
  }
  function writeRaw(key, value) {
    try { localStorage.setItem("c2." + key, JSON.stringify({ v: 1, d: value })); return true; }
    catch (e) { return false; }
  }
  return api;
})();

/* Contract §7 — seeded randomness. Canonical. A daily board must be identical
   on every device, so the seed comes from the slug and the date, never from
   Math.random. */
function seedFor(slug, date) {
  var s = slug + "|" + date, h = 2166136261 >>> 0;
  for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
  return h >>> 0;
}
function rngFrom(seed) {
  return function () {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    var t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

C2.register({
  slug: "mirrorwork",
  numeral: "II",
  name: "Mirrorwork",
  line: "Pairs, from memory, against the clock.",
  mark: '<rect x="4" y="4" width="7" height="7" rx="1.4"/><rect x="13" y="13" width="7" height="7" rx="1.4"/>',
  daily: false,
  mount: function (opts) {
    var c = readChallenge((opts && opts.frag) || C2.frag());
    if (!c) return;                                   // boot has already dealt a fresh board
    if (c.seed === seed && c.size === sizeN && c.deck === deckId) return;
    deckId = c.deck; sizeN = c.size; peekOn = c.peek;
    pendingSeed = c.seed;
    challenge = c;                                    // turns the "beat their time" banner on
    newGame();
  },
  status: function () { return { best: best[bestKey()] || null, size: sizeN, deck: deckId }; },
  /* Backgrounded mid-game: stop the clock rather than let it run on. */
  suspend: function () { try { setPaused(true); } catch (e) {} }
});

/* ---------------- decks & palettes ---------------- */

const DECKS = [
  { id:"signal",    name:"Signal",    complexity:1, blurb:"Solid discs" },
  { id:"facet",     name:"Facet",     complexity:2, blurb:"Cut polygons" },
  { id:"bloom",     name:"Bloom",     complexity:3, blurb:"Petal rosettes" },
  { id:"circuitry", name:"Circuitry", complexity:4, blurb:"Traced arms" },
  { id:"rosette",   name:"Rosette",   complexity:5, blurb:"Layered mandalas" }
];

const PALETTES = {
  signal:    ["#FF3D8B","#22D3EE","#A3E635","#FF8A3D","#A855F7","#2DD4BF","#FACC15","#F43F5E","#38BDF8","#FB7185","#4ADE80","#C084FC"],
  facet:     ["#FF6B6B","#4ECDC4","#FFD93D","#6C5CE7","#00D2FF","#FF9F1C","#B4F461","#F72585","#2EC4B6","#E4572E","#9B5DE5","#00BBF9"],
  bloom:     ["#FF7AA2","#FFB86B","#7DE2D1","#C99BFF","#8AD1FF","#FFE066","#FF6F91","#9BF6B0","#FFA5AB","#B8E0D2","#D8B4FE","#FFC9A9"],
  circuitry: ["#00F5D4","#FEE440","#FF006E","#8338EC","#3A86FF","#FB5607","#06D6A0","#EF476F","#7BF1A8","#FFD166","#4CC9F0","#F15BB5"],
  rosette:   ["#F72585","#7209B7","#4361EE","#4CC9F0","#F77F00","#06D6A0","#FFBE0B","#B5179E","#3A0CA3","#FF5400","#00BBF9","#80ED99"]
};

const SIZES = [
  { n:4, label:"4 × 4", cards:16, pairs:8,  ornament:false, gap:10 },
  { n:5, label:"5 × 5", cards:25, pairs:12, ornament:true,  gap:9  },
  { n:6, label:"6 × 6", cards:36, pairs:18, ornament:false, gap:7  }
];

const MIN_CELL = 40;    // never shrink a tap target below this
const MAX_CELL = 150;   // and never blow the cards up on a big monitor

/* ---------------- svg face generators ---------------- */

const poly = (n,r,cx,cy,rot) => {
  cx = cx===undefined?50:cx; cy = cy===undefined?50:cy; rot = rot===undefined?-90:rot;
  const out = [];
  for (let k=0;k<n;k++){
    const a = (rot + k*360/n) * Math.PI/180;
    out.push((cx + r*Math.cos(a)).toFixed(2) + "," + (cy + r*Math.sin(a)).toFixed(2));
  }
  return out.join(" ");
};

function rngFrom(seed){
  let t = seed + 0x6D2B79F5;
  return function(){
    t = Math.imul(t ^ t>>>15, t|1);
    t ^= t + Math.imul(t ^ t>>>7, t|61);
    return ((t ^ t>>>14) >>> 0) / 4294967296;
  };
}

function faceArt(deckId, i){
  const pal = PALETTES[deckId];
  const c1 = pal[i % 12], c2 = pal[(i+4) % 12], c3 = pal[(i+7) % 12];
  let s = "";

  if (deckId === "signal"){
    const ring = Math.floor(i/12) % 2 === 1;
    s += '<circle cx="50" cy="50" r="39" fill="none" stroke="'+c1+'" stroke-opacity=".28" stroke-width="2.5"/>';
    s += ring
      ? '<circle cx="50" cy="50" r="23" fill="none" stroke="'+c1+'" stroke-width="13"/>'
      : '<circle cx="50" cy="50" r="29" fill="'+c1+'"/>';
    return s;
  }

  if (deckId === "facet"){
    const n = 3 + (i % 8);
    const alt = Math.floor(i/8) % 3;
    s += '<polygon points="'+poly(n,35)+'" fill="'+c1+'"/>';
    if (alt === 1) s += '<polygon points="'+poly(n,20,50,50,-90+180/n)+'" fill="'+c2+'"/>';
    s += '<polygon points="'+poly(n, alt===2?24:19, 50,50, -90+180/n)+'" fill="none" stroke="#241041" stroke-opacity=".42" stroke-width="2.6" stroke-linejoin="round"/>';
    return s;
  }

  if (deckId === "bloom"){
    const petals = 4 + (i % 7);
    const layers = 1 + Math.floor(i/7) % 3;
    for (let k=0;k<petals;k++)
      s += '<ellipse cx="50" cy="27" rx="9" ry="20" fill="'+c1+'" opacity=".92" transform="rotate('+(k*360/petals)+' 50 50)"/>';
    if (layers > 1) for (let k=0;k<petals;k++)
      s += '<ellipse cx="50" cy="38" rx="5.5" ry="12" fill="'+c2+'" opacity=".9" transform="rotate('+(k*360/petals + 180/petals)+' 50 50)"/>';
    if (layers > 2) for (let k=0;k<petals;k++)
      s += '<ellipse cx="50" cy="44" rx="3" ry="7" fill="'+c3+'" opacity=".95" transform="rotate('+(k*360/petals)+' 50 50)"/>';
    s += '<circle cx="50" cy="50" r="'+(layers>2?7:10)+'" fill="'+(layers>1?c3:c2)+'"/>';
    return s;
  }

  if (deckId === "circuitry"){
    const arms = 3 + (i % 5);
    const r = rngFrom(i*7919 + 13);
    const a = 13 + r()*9, b = 9 + r()*13, c = 29 + r()*13;
    const flip = r() > .5 ? -1 : 1;
    const d = "M50 50 V"+(50-a).toFixed(1)+" H"+(50+b*flip).toFixed(1)+" V"+(50-c).toFixed(1);
    s += '<circle cx="50" cy="50" r="43" fill="none" stroke="'+c1+'" stroke-opacity=".25" stroke-width="1.6"/>';
    for (let k=0;k<arms;k++){
      s += '<g transform="rotate('+(k*360/arms)+' 50 50)">';
      s += '<path d="'+d+'" fill="none" stroke="'+c1+'" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>';
      s += '<circle cx="'+(50+b*flip)+'" cy="'+(50-c)+'" r="4.4" fill="'+c2+'"/>';
      s += '<circle cx="50" cy="'+(50-a)+'" r="2.4" fill="'+c2+'" opacity=".85"/>';
      s += '</g>';
    }
    s += '<circle cx="50" cy="50" r="6" fill="'+c1+'"/><circle cx="50" cy="50" r="2.4" fill="#fff" opacity=".85"/>';
    return s;
  }

  const outerN = 8 + (i % 10), midN = 5 + (i % 5), innerN = 3 + (i % 6);
  for (let k=0;k<outerN;k++){
    const ang = (k*360/outerN - 90) * Math.PI/180;
    s += '<circle cx="'+(50+44*Math.cos(ang)).toFixed(2)+'" cy="'+(50+44*Math.sin(ang)).toFixed(2)+'" r="2.7" fill="'+c2+'"/>';
  }
  s += '<circle cx="50" cy="50" r="37" fill="none" stroke="'+c3+'" stroke-opacity=".5" stroke-width="1.2"/>';
  for (let k=0;k<midN;k++)
    s += '<ellipse cx="50" cy="27" rx="6.5" ry="14" fill="'+c1+'" opacity=".92" transform="rotate('+(k*360/midN)+' 50 50)"/>';
  for (let k=0;k<midN;k++)
    s += '<ellipse cx="50" cy="36" rx="3.4" ry="8" fill="'+c3+'" opacity=".85" transform="rotate('+(k*360/midN + 180/midN)+' 50 50)"/>';
  s += '<polygon points="'+poly(innerN,13)+'" fill="'+c3+'"/>';
  s += '<polygon points="'+poly(innerN,13,50,50,-90+180/innerN)+'" fill="'+c1+'" opacity=".55"/>';
  s += '<circle cx="50" cy="50" r="3.6" fill="#FFF8E6"/>';
  return s;
}

const svgWrap = inner => '<svg viewBox="0 0 100 100" aria-hidden="true" focusable="false">'+inner+'</svg>';

function backArt(){
  let s = "";
  [43,35,27,19].forEach((r,k) => {
    s += '<circle cx="50" cy="50" r="'+r+'" fill="none" stroke="#E8B84B" stroke-width="'+(k%2?0.7:1.1)+'" stroke-opacity="'+(0.32+k*0.06)+'"/>';
  });
  for (let k=0;k<12;k++)
    s += '<line x1="50" y1="7" x2="50" y2="19" stroke="#E8B84B" stroke-opacity=".3" stroke-width=".9" transform="rotate('+(k*30)+' 50 50)"/>';
  s += '<polygon points="'+poly(4,9)+'" fill="none" stroke="#E8B84B" stroke-opacity=".75" stroke-width="1.2"/>';
  s += '<circle cx="50" cy="50" r="2.6" fill="#E8B84B" fill-opacity=".8"/>';
