      vkRead("&hellip;", "Pacing out the field. " + tries.toLocaleString("en-GB") + " layouts tried.");
      setTimeout(slice, 0);
    }
    vkRead("&hellip;", "Pacing out the field.");
    slice();
  }

  /* ── geometry ───────────────────────────────────────── */
  function rectOf(a, b) {
    var n = B.n, r1 = (a / n) | 0, c1 = a % n, r2 = (b / n) | 0, c2 = b % n;
    return { r: Math.min(r1, r2), c: Math.min(c1, c2), h: Math.abs(r1 - r2) + 1, w: Math.abs(c1 - c2) + 1 };
  }
  function cellsIn(q) { var out = []; for (var r = q.r; r < q.r + q.h; r++) for (var c = q.c; c < q.c + q.w; c++) out.push(r * B.n + c); return out; }
  function overlaps(a, b) { return a.c < b.c + b.w && b.c < a.c + a.w && a.r < b.r + b.h && b.r < a.r + a.h; }
  function clueIn(q) {
    var found = [];
    B.clues.forEach(function (k) { var r = (k.at / B.n) | 0, c = k.at % B.n; if (r >= q.r && r < q.r + q.h && c >= q.c && c < q.c + q.w) found.push(k); });
    return found;
  }
  function good(q) { var k = clueIn(q); return k.length === 1 && k[0].n === q.w * q.h; }

  /* ── drawing ────────────────────────────────────────── */
  function build() {
    var n = B.n;
    [base, lay, top].forEach(function (g) { g.style.gridTemplateColumns = "repeat(" + n + ",1fr)"; g.style.gridTemplateRows = "repeat(" + n + ",1fr)"; g.innerHTML = ""; });
    field.style.setProperty("--n", n);
    var clueAt = {}; B.clues.forEach(function (k) { clueAt[k.at] = k.n; });
    cellsTop = [];
    for (var i = 0; i < n * n; i++) {
      var s = document.createElement("div"); s.className = "plot"; base.appendChild(s);
      var b = document.createElement("button");
      b.type = "button"; b.className = "spot"; b.dataset.i = i;
      if (clueAt[i]) b.innerHTML = "<span>" + clueAt[i] + "</span>";
      b.setAttribute("aria-label", "Row " + ((i / n | 0) + 1) + " column " + (i % n + 1) + (clueAt[i] ? ", number " + clueAt[i] : ""));
      top.appendChild(b); cellsTop.push(b);

  }
  function strip(q, cls) {
    var d = document.createElement("div");
    d.className = "strip-r " + cls;

    d.style.gridColumn = (q.c + 1) + " / span " + q.w;

  }
  function paint() {

    if (drag && drag.q) {
      var g = strip(drag.q, "ghost");
      g.innerHTML = "<em>" + drag.q.w + " &times; " + drag.q.h + " = " + (drag.q.w * drag.q.h) + "</em>";

    $("cHint").textContent = String(G.hints);
    $("cSize").textContent = B.n + "\u00d7" + B.n;

      : "Free field <strong>" + B.seed.toString(36) + "</strong>";
    $("fresh").hidden = mode !== "free";
    vkRows([["Daily streak", String(stats.streak), stats.streak > 1 ? "crown" : ""],

  /* ── play ───────────────────────────────────────────── */
  function lay1(q) {
    if (q.w * q.h < 2) return;
    clock.start();
    G.placed = G.placed.filter(function (o) { return !overlaps(o, q); });
    G.placed.push({ r: q.r, c: q.c, w: q.w, h: q.h });
    var ok = good(q);
    vkNote(ok ? 523.25 : 330, 0.12, 0.05, ok ? "sine" : "triangle"); C2.haptic(ok ? 12 : 6);

  function check() {

  }
  function hint() {
    if (G.done) return;

    var miss = B.rects.filter(function (q) { return !have[key({ r: q.r, c: q.c, w: q.w, h: q.h })]; });

    if (e.detail !== 0 || !G || G.done) return;
    var b = e.target.closest(".spot"); if (b) tapCell(+b.dataset.i);
  });

    if (anchor >= 0 && anchor !== i) { var q = rectOf(anchor, i); anchor = -1; if (q.w * q.h >= 2) lay1(q); else paint(); return; }
    if (anchor === i) { anchor = -1; paint(); vkRead("&nbsp;", "Corner cleared."); return; }
    if (lift(i)) return;
    anchor = i; vkNote(392, 0.05, 0.04); C2.haptic(6);
    vkRead("Corner set.", "Tap the opposite corner, or drag from one corner to the other.");
    paint();
  }

  /* ── storage and loading ───────────────────────────── */
  function fresh(daily) { return { date: vkToday(), daily: daily, seed: B.seed, placed: [], elapsed: 0, hints: 0, done: false }; }
  function present(c, saved) {
    clock.drop();
    B = c; G = saved || fresh(mode === "daily"); anchor = -1; drag = null;
    build(); paint(); standing();

  }
  function save() { if (G) C2.write(G.daily ? "day" : "free", G); }

  }
  function share() {
    if (!G || !G.done) return;
    var lines = ["Furlong \u00b7 " + (G.daily ? vkPretty(G.date) : "free field") + " \u00b7 " + B.n + "\u00d7" + B.n,
                 "Fenced in " + vkClock(G.elapsed) + " \u00b7 " + B.clues.length + " strips \u00b7 " + (G.hints ? G.hints + (G.hints === 1 ? " hint" : " hints") : "no hints")];
    if (G.daily && stats.streak > 1) lines.push("Streak " + stats.streak);
    var url = C2.link(G.daily ? "" : "f=" + B.seed.toString(36));

    if (url) lines.push(url);

  }

  /* ── wiring ─────────────────────────────────────────── */
  $("hint").addEventListener("click", hint);
  $("clear").addEventListener("click", function () { if (!G || G.done) return; G.placed = []; anchor = -1; save(); paint(); vkRead("Cleared.", "The field is open again."); });
  $("share").addEventListener("click", share);
  $("fresh").addEventListener("click", function () { C2.write("free", null); loadFree((Math.random() * 4294967296) >>> 0); });
  Array.prototype.forEach.call(document.querySelectorAll(".seg button"), function (b) {
    b.addEventListener("click", function () { if (b.dataset.mode === mode) return; clock.stop(); save(); if (b.dataset.mode === "daily") loadDaily(); else loadFree(); });
  });

  function boot(o) {
    var f = (o && typeof o.frag === "string") ? o.frag : C2.frag();
    var m = /(?:^|\/)f=([0-9a-z]+)$/.exec(f || "");
    if (booted && !m) return;
    booted = true;
    if (m) { loadFree(parseInt(m[1], 36) >>> 0); if (o) vkToast("Someone sent you this field. Same numbers, one answer."); }
    else loadDaily();
  }
  C2.register({
    slug: SLUG, numeral: "IX", name: "Furlong",
    line: "Fence the field into strips. Each number is its strip's size.",
    mark: '<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 10h11M14 3v18M14 15h7"/>',
    daily: true, mount: boot,
    suspend: function () { clock.stop(); save(); }
  });
  var rules = vkRules(C2);
  if (!vkEmbedded) boot(null);
  else setTimeout(function () { if (!booted) boot(null); }, 900);
})();
