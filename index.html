<!DOCTYPE html>
<html lang="en-GB" data-theme="day">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EFE8F8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="description" content="The Compendium II — a shelf of puzzles. Offline, no network, no accounts.">
<title>The Compendium II</title>
<!-- Compendium II shell, build V4: all nine volumes cut. Bight, Marquetry and Furlong added; layouts for phone, tablet and computer. -->
<style>
/* ==================================================================
   THE COMPENDIUM II — the shell

   Owns all chrome: the roll, reading mode, sound, haptics, the share
   sheet, and navigation. Volumes own their boards and nothing else.
   Contract v3 §1, §4, §5, §11.

   §1  CANONICAL TOKEN BLOCK — contract v3 §2. Paste verbatim.
   ================================================================== */
:root {
  --serif: "Didot", "Bodoni MT", "Playfair Display", Georgia, "Times New Roman", serif;
  --body: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --util: ui-monospace, "SF Mono", "Cascadia Mono", "Roboto Mono", Menlo, monospace;
  --tap: 52px;
  --gutter: 20px;
  --radius: 10px;
  --radius-pill: 999px;
  --radius-plate: 18px;
}
html[data-theme="day"] {
  --ground:#EFE8F8; --plate:#F8F4FD; --well:#E5DBF3;
  --ink:#241041; --ink-2:#6B5590; --hair:#7E64AC;
  --accent:#4A1D7A; --on-accent:#FFF8E9; --chip:#3A1A66; --gilt:#8E6110;
  --pip-hi:#8A72B4; --pip-lo:#180830; --pip-glow:rgba(255,255,255,.6);
  --field:
    radial-gradient(120% 90% at 50% -10%, #F5E8FF 0%, rgba(245,232,255,0) 60%),
    radial-gradient(90% 70% at 100% 110%, #FFEAD6 0%, rgba(255,234,214,0) 55%),
    linear-gradient(180deg,#F2EBFA 0%,#E7DEF3 100%);
  --h1-fill: linear-gradient(180deg,#2E1350,#7A3A9E 92%);
  --wash: rgba(74,29,122,.10); --veil: rgba(36,16,65,.55);
  --face:#FFFFFF;
  --face-ink:#180830;
  --sink: inset 1px 1px 3px rgba(36,16,65,.18), inset -1px -1px 1px rgba(255,255,255,.85);
  --raise: 0 1px 0 rgba(255,255,255,.7), 0 4px 14px rgba(36,16,65,.10);
  --ok-shadow: inset 1px 1px 3px rgba(36,16,65,.18), 0 0 18px -3px rgba(74,29,122,.50);
  --w-body:400; --w-disp:500;
}
html[data-theme="glare"] {
  --ground:#FFFFFF; --plate:#FFFFFF; --well:#FFFFFF;
  --ink:#000000; --ink-2:#000000; --hair:#000000;
  --accent:#000000; --on-accent:#FFFFFF; --chip:#000000; --gilt:#000000;
  --pip-hi:#000000; --pip-lo:#000000; --pip-glow:transparent;
  --field:#FFFFFF;
  --h1-fill: none;
  --wash: transparent; --veil: rgba(0,0,0,.65);
  --face:#FFFFFF;
  --face-ink:#000000;
  --sink: none; --raise: none; --ok-shadow: none;
  --w-body:600; --w-disp:700;
}
html[data-theme="night"] {
  --ground:#12071F; --plate:#241041; --well:#1B0A35;
  --ink:#F6F1FF; --ink-2:#B49BD8; --hair:rgba(240,195,92,.55);
  --accent:#F0C35C; --on-accent:#22093C; --chip:#F0C35C; --gilt:#F0C35C;
  --pip-hi:#FFF0C4; --pip-lo:#A76F14; --pip-glow:rgba(255,255,255,.10);
  --field:
    radial-gradient(120% 90% at 50% -10%, #4A1D7A 0%, rgba(74,29,122,0) 60%),
    radial-gradient(90% 70% at 100% 110%, #7A1D5E 0%, rgba(122,29,94,0) 55%),
    linear-gradient(180deg,#1B0B33 0%,#12071F 100%);
  --h1-fill: linear-gradient(180deg,#FFF8E9,#E7A9D8 90%);
  --wash: rgba(240,195,92,.13); --veil: rgba(18,7,32,.78);
  --face:#F2ECFF;
  --face-ink:#1B0A35;
  --sink: inset 1px 1px 3px rgba(0,0,0,.55), inset -1px -1px 1px rgba(255,255,255,.06);
  --raise: inset 0 1px 0 rgba(255,255,255,.10), 0 6px 20px rgba(0,0,0,.45);
  --ok-shadow: inset 1px 1px 3px rgba(0,0,0,.55), 0 0 22px -3px rgba(240,195,92,.60);
  --w-body:350; --w-disp:400;
}

/* §2  shell geometry only — no colour authored below this line */
:root{ --ease: cubic-bezier(.16,1,.3,1); }

/* The hidden attribute must win. A class rule carrying `display` has the same
   specificity as the browser's own `[hidden]` rule and, coming later, beats it
   — so `el.hidden = true` silently does nothing and the element stays put. An
   overlay that stays put swallows every press behind it. */
[hidden]{display:none !important}
*{box-sizing:border-box}
html,body{height:100%; margin:0}
body{
  background:var(--ground); color:var(--ink);
  background-image:var(--field); background-attachment:fixed;
  font-family:var(--body); font-weight:var(--w-body);
  font-size:16px; line-height:1.45;
  -webkit-text-size-adjust:100%; -webkit-tap-highlight-color:transparent;
  overflow:hidden; overscroll-behavior:none;
}
.shell{height:100vh; height:100dvh; display:flex; flex-direction:column}

/* ---------- top bar ---------- */
.bar{
  flex:0 0 auto; display:flex; align-items:center; gap:10px;
  max-width:640px; width:100%; margin:0 auto;
  padding:calc(env(safe-area-inset-top) + 12px) var(--gutter) 10px;
}
.bar h1{
  flex:1; min-width:0; margin:0;
  font-family:var(--serif); font-weight:var(--w-disp);
  font-size:clamp(1.35rem, 6vw, 1.9rem); line-height:1.05; letter-spacing:.02em;
  background:var(--h1-fill); -webkit-background-clip:text; background-clip:text;
  color:transparent;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
html[data-theme="glare"] .bar h1{background:none; color:var(--ink)}
.icon{
  flex:0 0 auto; width:42px; height:42px; padding:0; cursor:pointer;
  display:grid; place-items:center; border-radius:var(--radius-pill);
  background:var(--plate); color:var(--gilt);
  border:1px solid var(--hair); box-shadow:var(--raise);
}
.icon svg{width:18px; height:18px; fill:none; stroke:currentColor;
  stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round}
.icon:focus-visible, button:focus-visible, a:focus-visible{
  outline:2px solid var(--gilt); outline-offset:3px}
button:focus:not(:focus-visible){outline:none}

/* ---------- the roll ---------- */
.view{flex:1 1 auto; min-height:0; display:none}
.view.on{display:flex; flex-direction:column}
#roll{overflow-y:auto; overscroll-behavior:contain}
.rollinner{max-width:640px; margin:0 auto; width:100%;
  padding:4px var(--gutter) calc(env(safe-area-inset-bottom) + 28px)}
.legend{margin:0 0 16px; font-size:.86rem; color:var(--ink-2)}
.vol{
  display:flex; align-items:center; gap:14px; width:100%; text-align:left;
  margin-bottom:10px; padding:15px 16px; cursor:pointer;
  border-radius:var(--radius-plate);
  background:var(--plate); color:var(--ink);
  border:1px solid var(--hair); box-shadow:var(--raise);
  font:inherit; min-height:var(--tap);
  transition:transform .12s ease, border-color .2s;
}
.vol:hover{border-color:var(--gilt)}
.vol:active{transform:translateY(1.5px)}
.vol .roman{
  flex:0 0 auto; width:40px; text-align:center;
  font-family:var(--serif); font-size:1.2rem; font-weight:var(--w-disp);
  color:var(--gilt);
}
.vol .text{flex:1; min-width:0}
.vol .name{
  display:block; font-family:var(--serif); font-size:1.2rem;
  font-weight:var(--w-disp); letter-spacing:.01em;
}
.vol .blurb{display:block; font-size:.82rem; color:var(--ink-2); margin-top:2px}
.vol .chev{flex:0 0 auto; width:18px; height:18px; color:var(--ink-2);
  fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round}
.vol.uncut{cursor:default; opacity:.5}
.vol.uncut:hover{border-color:var(--hair)}
.vol.uncut .blurb{font-style:italic}

/* ---------- a volume ---------- */
#stage{position:relative}
#frame{
  flex:1 1 auto; width:100%; height:100%; border:0; display:block;
  background:transparent;
}
.spinner{
  position:absolute; inset:0; display:grid; place-items:center;
  font-size:.84rem; color:var(--ink-2);
  pointer-events:none;              /* never intercept a press, shown or not */
}

/* ---------- sheets ---------- */
.scrim{
  position:fixed; inset:0; z-index:40; display:none;
  background:var(--pip-lo); opacity:0; transition:opacity .25s var(--ease);
}
.scrim.on{display:block; opacity:.55}
.sheet{
  position:fixed; left:0; right:0; bottom:0; z-index:41;
  max-width:640px; margin:0 auto;
  padding:20px var(--gutter) calc(env(safe-area-inset-bottom) + 20px);
  border-radius:var(--radius-plate) var(--radius-plate) 0 0;
  background:var(--plate); border:1px solid var(--hair);
  box-shadow:var(--raise);
  transform:translateY(102%); transition:transform .32s var(--ease);
}
.sheet.on{transform:none}
.sheet h2{
  margin:0 0 16px; font-family:var(--serif); font-weight:var(--w-disp);
  font-size:1.3rem; letter-spacing:.01em;
}
.field{margin-bottom:18px}
.field > span{display:block; font-size:.8rem; color:var(--ink-2); margin-bottom:7px}
.seg{
  display:flex; gap:5px; padding:4px; border-radius:var(--radius-pill);
  background:var(--well); border:1px solid var(--hair); box-shadow:var(--sink);
}
.seg button{
  flex:1; min-height:44px; font:inherit; font-size:.84rem; cursor:pointer;
  border:0; border-radius:var(--radius-pill); background:none; color:var(--ink-2);
  transition:background .3s var(--ease), color .3s var(--ease);
}
.seg button[aria-pressed="true"]{background:var(--accent); color:var(--on-accent); font-weight:600}
.switch{
  display:flex; align-items:center; justify-content:space-between; width:100%;
  min-height:var(--tap); padding:11px 15px; cursor:pointer; font:inherit;
  border-radius:var(--radius); background:var(--well); color:var(--ink);
  border:1px solid var(--hair); box-shadow:var(--sink);
  margin-bottom:9px;
}
.switch .state{font-family:var(--util); font-size:.8rem; color:var(--gilt)}
.switch[aria-pressed="false"] .state{color:var(--ink-2)}
.btn{
  width:100%; min-height:var(--tap); font:inherit; font-size:.92rem; cursor:pointer;
  border-radius:var(--radius-pill); margin-top:4px;
  background:var(--plate); color:var(--ink-2);
  border:1px solid var(--hair); box-shadow:var(--raise);
}
.btn:hover{color:var(--ink); border-color:var(--gilt)}
.btn.go{background:var(--accent); border-color:var(--accent);
  color:var(--on-accent); font-weight:600}
html[data-theme="glare"] .btn.go{border-width:3px}
.lines{
  margin:0 0 14px; padding:14px; border-radius:var(--radius);
  background:var(--well); border:1px solid var(--hair); box-shadow:var(--sink);
  font-family:var(--util); font-size:.78rem; line-height:1.6;
  white-space:pre-wrap; word-break:break-word; color:var(--ink);
}
.fine{font-size:.75rem; color:var(--ink-2); margin:14px 0 0; text-align:center}

/* Tablet and computer: a wider bar, and the roll as a grid of cards. */
@media (min-width:760px){
  .bar{max-width:1180px; padding-left:28px; padding-right:28px}
  .rollinner{max-width:1180px; padding-left:28px; padding-right:28px}
  #vols{display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:12px}
  .vol{margin-bottom:0; min-height:92px}
  .legend{font-size:.95rem}
  body{font-size:17px}
  .vol .name{font-size:1.3rem}
}
@media (min-width:1100px){
  #vols{grid-template-columns:repeat(3, minmax(0,1fr))}
}
.sheet{max-width:560px}
@media (min-width:760px){ .sheet{bottom:auto; top:50%; border-radius:var(--radius-plate); transform:translateY(120vh)}
  .sheet.on{transform:translateY(-50%)} }

@media (prefers-reduced-motion: reduce){
  *{animation-duration:.01ms !important; transition-duration:.01ms !important}
}
</style>
</head>
<body>
<div class="shell">
  <div class="bar">
    <button class="icon" id="back" hidden aria-label="Back to the roll">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <h1 id="title">The Compendium II</h1>
    <button class="icon" id="cog" aria-label="Reading and sound settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.1"/><path d="M12 3.3v2.4M12 18.3v2.4M4.6 7.8l2 1.2M17.4 15l2 1.2M4.6 16.2l2-1.2M17.4 9l2-1.2"/></svg>
    </button>
  </div>

  <section class="view on" id="roll" aria-label="The roll">
    <div class="rollinner">
      <p class="legend" id="legend"></p>
      <div id="vols"></div>
      <p class="fine">Nothing here reaches the network. No accounts, no adverts, no tracking.</p>
    </div>
  </section>

  <section class="view" id="stage" aria-label="Volume">
    <div class="spinner" id="spinner">Opening&hellip;</div>
    <iframe id="frame" title="Volume" sandbox="allow-scripts allow-same-origin allow-popups"></iframe>
  </section>
</div>

<div class="scrim" id="scrim"></div>

<div class="sheet" id="settings" role="dialog" aria-modal="true" aria-labelledby="setTitle" hidden>
  <h2 id="setTitle">Settings</h2>
  <div class="field">
    <span id="modeLabel">Reading mode</span>
    <div class="seg" role="group" aria-labelledby="modeLabel">
      <button data-mode="auto">Auto</button>
      <button data-mode="day">Day</button>
      <button data-mode="glare">Glare</button>
      <button data-mode="night">Night</button>
    </div>
  </div>
  <button class="switch" id="soundSw" aria-pressed="true">Sound<span class="state">on</span></button>
  <button class="switch" id="hapticSw" aria-pressed="true">Haptics<span class="state">on</span></button>
  <button class="btn" id="setClose">Done</button>
  <p class="fine">Auto follows your device. Glare strips colour and shadow for direct sunlight.</p>
</div>

<div class="sheet" id="sharesheet" role="dialog" aria-modal="true" aria-labelledby="shTitle" hidden>
  <h2 id="shTitle">Share</h2>
  <p class="lines" id="shLines"></p>
  <button class="btn go" id="shWa">Send on WhatsApp</button>
  <button class="btn" id="shCopy">Copy</button>
  <button class="btn" id="shClose">Close</button>
</div>

<script>
"use strict";
/* ==================================================================
   §3  The manifest — contract v3 §5.
   Static. The roll renders whatever is here; a volume that fails to
   load leaves a gap rather than breaking the index. Volumes marked
   uncut are placeholders, shown greyed.
   ================================================================== */
const MANIFEST = [
  {slug:"fell",      roman:"I",   title:"Fell",      blurb:"One move. The whole puzzle resolves or it does not.", file:"fell.html"},
  {slug:"mirrorwork",roman:"II",  title:"Mirrorwork",blurb:"Pairs, from memory, against the clock.",     file:"mirrorwork.html"},
  {slug:"riffle",    roman:"III", title:"Riffle",    blurb:"Set every word the rack will give up.",      file:"riffle.html"},
  {slug:"glean",     roman:"IV",  title:"Glean",     blurb:"One line across the field. Take the best haul.", file:"glean.html"},
  {slug:"bight",     roman:"V",   title:"Bight",     blurb:"One loop of rope through every square. Knots say where it bends.", file:"bight.html"},
  {slug:"marquetry", roman:"VI",  title:"Marquetry", blurb:"Thirty veneers, one panel. Set full lines; match the wood.", file:"marquetry.html"},
  {slug:"reeve",     roman:"VII", title:"Reeve",     blurb:"Prove every plot paid or owing. No guessing.", file:"reeve.html"},
  {slug:"shunt",     roman:"VIII",title:"Shunt",     blurb:"Tap a wagon end. It runs until it stops. Free the van.", file:"shunt.html"},
  {slug:"furlong",   roman:"IX",  title:"Furlong",   blurb:"Fence the field into strips. Each number is its strip's size.", file:"furlong.html"}
];

/* §4  Prefs, stored versioned under c2.* — contract v3 §8 */
const DEFAULTS = {mode:"auto", sound:true, haptic:true};
let prefs = Object.assign({}, DEFAULTS);
let active = null;                       /* slug of the volume on stage */
let frag = "";                           /* the part of the hash the volume owns */
/* Inside the Android app the page lives at appassets.androidplatform.net,
   which nobody else can open, so a link built from it is dead on arrival.
   Set PUBLIC_BASE to a hosted copy of this file (for example a GitHub Pages
   URL ending in /) and app shares carry working links. Left empty, app
   shares simply leave the link out. In a browser the page's own URL is used. */
const PUBLIC_BASE = "";
const IN_APP = location.hostname === "appassets.androidplatform.net";
const baseUrl = () => IN_APP ? PUBLIC_BASE : location.origin + location.pathname + location.search;
function splitHash(h){
  const raw = (h || "").replace(/^#/, "");
  if(!raw) return {slug:"", frag:""};
  const i = raw.indexOf("/");
  return i < 0 ? {slug:raw, frag:""} : {slug:raw.slice(0,i), frag:raw.slice(i+1)};
}
let pendingShare = null;

function readRaw(key, fallback){
  try{
    const raw = localStorage.getItem("c2." + key);
    if(!raw) return fallback;
    const o = JSON.parse(raw);
    if(!o || o.v !== 1) return fallback;
    return o.d;
  }catch(e){ return fallback; }
}
function writeRaw(key, value){
  try{ localStorage.setItem("c2." + key, JSON.stringify({v:1, d:value})); return true; }
  catch(e){ return false; }
}

const $ = id => document.getElementById(id);
const THEME_META = {day:"#EFE8F8", glare:"#FFFFFF", night:"#12071F"};

/* ---------- payload: embedded when merged, files when loose ---------- */
function payload(slug){
  const node = document.getElementById("vol-" + slug);
  if(!node) return null;
  /* merge.js escapes the volume's own closing script tags so they cannot
     terminate the host block. Reverse that here: handing the escaped form to
     srcdoc gives the iframe broken script tags and a blank volume.
     Note the wording — writing that tag literally in this comment would end
     this script block too, which is the same bug one level up. */
  return node.textContent.split("<\\/script").join("</script");
}
/* Merged builds carry their volumes inside them. Once one baked block exists,
   the file is a merged build, and an entry with no block is not shippable —
   showing it as cut would give the player a door onto an empty room.
   Checked lazily: the baked blocks sit below this script and are not in the
   DOM while it first runs. */
function merged(){
  return !!document.querySelector('script[type="text/plain"][id^="vol-"]');
}
function openable(v){
  if(!v.file) return false;
  return merged() ? payload(v.slug) !== null : true;
}

/* ---------- prefs ---------- */
function resolveMode(m){
  if(m && m !== "auto") return m;
  try{ return matchMedia("(prefers-color-scheme: dark)").matches ? "night" : "day"; }
  catch(e){ return "day"; }
}
function applyPrefs(save){
  if(["auto","day","glare","night"].indexOf(prefs.mode) < 0) prefs.mode = "auto";
  const resolved = resolveMode(prefs.mode);
  document.documentElement.dataset.theme = resolved;
  const m = document.querySelector('meta[name="theme-color"]');
  if(m) m.setAttribute("content", THEME_META[resolved]);
  for(const b of document.querySelectorAll('.seg button[data-mode]'))
    b.setAttribute("aria-pressed", b.dataset.mode === prefs.mode ? "true" : "false");
  mark($("soundSw"), prefs.sound);
  mark($("hapticSw"), prefs.haptic);
  if(save) writeRaw("prefs", prefs);
  push();
}
function mark(btn, on){
  btn.setAttribute("aria-pressed", on ? "true" : "false");
  btn.querySelector(".state").textContent = on ? "on" : "off";
}
function push(){
  const f = $("frame");
  if(!active || !f.contentWindow) return;
  try{ f.contentWindow.postMessage({c2:1, type:"settings", settings:prefs,
        base:baseUrl(), frag:frag}, "*"); }catch(e){}
}
/* §5 mount: the shell tells the volume what to open, rather than the volume
   deciding for itself. Fell uses it for daily-or-free and board size. */
function mount(opts){
  const f = $("frame");
  if(!active || !f.contentWindow) return;
  try{ f.contentWindow.postMessage({c2:1, type:"mount", opts:opts || {}}, "*"); }catch(e){}
}

/* ---------- the roll ---------- */
function drawRoll(){
  const cut = MANIFEST.filter(openable).length;
  $("legend").textContent = cut + " of " + MANIFEST.length +
    " volumes cut. Everything works offline and keeps your place.";
  const box = $("vols");
  box.innerHTML = "";
  for(const v of MANIFEST){
    const live = openable(v);
    const b = document.createElement("button");
    b.className = "vol" + (live ? "" : " uncut");
    b.type = "button";
    if(!live) b.disabled = true;
    b.innerHTML =
      '<span class="roman" aria-hidden="true">' + v.roman + '</span>' +
      '<span class="text"><span class="name">' + v.title + '</span>' +
      '<span class="blurb">' + (live ? v.blurb : "Not yet cut.") + '</span></span>' +
      (live ? '<svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>' : '');
    b.setAttribute("aria-label", "Volume " + v.roman + ", " + v.title +
      (live ? ". " + v.blurb : ", not yet cut"));
    if(live) b.onclick = ()=> open(v);
    box.appendChild(b);
  }
}

/* ---------- opening and closing a volume ---------- */
function open(v, withFrag){
  active = v.slug;
  frag = withFrag || "";
  $("title").textContent = v.title;
  $("back").hidden = false;
  $("cog").hidden = false;
  $("roll").classList.remove("on");
  $("stage").classList.add("on");
  $("spinner").hidden = false;
  const f = $("frame");
  const inline = payload(v.slug);
  if(inline !== null) f.srcdoc = inline;
  else f.src = v.file;
  try{ history.pushState({slug:v.slug}, "",
        "#" + v.slug + (frag ? "/" + frag : "")); }catch(e){}
}
function close(){
  const f = $("frame");
  try{ if(f.contentWindow) f.contentWindow.postMessage({c2:1, type:"suspend"}, "*"); }catch(e){}
  f.removeAttribute("srcdoc"); f.removeAttribute("src");
  active = null;
  frag = "";
  $("title").textContent = "The Compendium II";
  $("back").hidden = true;
  $("stage").classList.remove("on");
  $("roll").classList.add("on");
  /* Replace, never push: pushing here left the volume's entry behind, so
     the hardware Back button on the roll reopened the volume just closed. */
  try{ history.replaceState({}, "", location.pathname + location.search); }catch(e){}
}
$("frame").addEventListener("load", ()=>{ $("spinner").hidden = true; push(); });

/* ---------- the C2 host side — contract v3 §4 ---------- */
window.addEventListener("message", e=>{
  const d = e.data;
  if(!d || d.c2 !== 1) return;
  if(d.type === "ready"){ $("spinner").hidden = true; push(); mount({mode:"daily", frag:frag}); }
  if(d.type === "share" && Array.isArray(d.lines)) openShare(d.lines);
  /* §9 the volume names its board; the shell puts it in the address bar */
  if(d.type === "frag" && typeof d.frag === "string" && d.slug === active){
    frag = d.frag;
    try{
      if(history.replaceState)
        history.replaceState(null, "", location.pathname + location.search + "#" + active + "/" + frag);
    }catch(e){}
  }
});

/* ---------- sheets ---------- */
let openSheet = null;
function show(id){
  const s = $(id);
  s.hidden = false;
  $("scrim").classList.add("on");
  requestAnimationFrame(()=>s.classList.add("on"));
  openSheet = id;
  const first = s.querySelector("button");
  if(first) first.focus();
}
function hide(){
  if(!openSheet) return;
  const s = $(openSheet);
  s.classList.remove("on");
  $("scrim").classList.remove("on");
  setTimeout(()=>{ s.hidden = true; }, 320);
  openSheet = null;
}
function openShare(lines){
  pendingShare = lines.join("\n");
  $("shLines").textContent = pendingShare;
  show("sharesheet");
}
$("cog").onclick = ()=> show("settings");
$("setClose").onclick = hide;
$("shClose").onclick = hide;
$("scrim").onclick = hide;
$("back").onclick = ()=>{
  /* Opened from the roll: step back through history and let popstate close
     it, so Back on the roll then leaves the app instead of reopening this. */
  if(history.state && history.state.slug) history.back();
  else close();
};
$("soundSw").onclick = ()=>{ prefs.sound = !prefs.sound; applyPrefs(true); };
$("hapticSw").onclick = ()=>{ prefs.haptic = !prefs.haptic; applyPrefs(true); };
for(const b of document.querySelectorAll('.seg button[data-mode]'))
  b.onclick = ()=>{ prefs.mode = b.dataset.mode; applyPrefs(true); };
$("shWa").onclick = ()=>{
  if(!pendingShare) return;
  window.open("https://wa.me/?text=" + encodeURIComponent(pendingShare), "_blank", "noopener");
  hide();
};
$("shCopy").onclick = ()=>{
  if(!pendingShare) return;
  try{ navigator.clipboard.writeText(pendingShare); }catch(e){}
  $("shCopy").textContent = "Copied";
  setTimeout(()=>{ $("shCopy").textContent = "Copy"; }, 1600);
};
document.addEventListener("keydown", e=>{
  if(e.key === "Escape"){ if(openSheet) hide(); else if(active) close(); }
});
window.addEventListener("popstate", ()=>{
  const h = splitHash(location.hash);
  const v = MANIFEST.filter(x=>x.slug === h.slug && openable(x))[0];
  if(v && (v.slug !== active || h.frag !== frag)) open(v, h.frag);
  else if(!v && active) close();
});

/* ---------- boot ---------- */
function start(){
  prefs = Object.assign({}, DEFAULTS, readRaw("prefs", {}));
  applyPrefs(false);
  drawRoll();
  /* A volume link, shared or bookmarked, opens straight into that volume.
     The fragment beyond the slug belongs to the volume and is passed through. */
  const h = splitHash(location.hash);
  if(!h.slug) return;
  const v = MANIFEST.filter(x=>x.slug === h.slug && openable(x))[0];
  if(v) open(v, h.frag);
}
if(document.readyState === "loading")
  document.addEventListener("DOMContentLoaded", start);
else start();
</script>
<script type="text/plain" id="vol-fell"><!DOCTYPE html>
<html lang="en">
<head>

<title>Fell — Compendium II</title>
<style>
/* ═══════════════════════════════════════════════════════════
   VOLUME III · FELL
   Reference implementation of the Compendium II volume contract.
   The other nine get copied from this file, so everything here is
   contract-shaped even where a simpler thing would work.

   Canonical token block — section 2 of the contract. Do not edit
   locally. If a volume needs a token, the block gains it and all
   volumes inherit it.
   ═══════════════════════════════════════════════════════════ */
:root {
  --serif: "Didot", "Bodoni MT", "Playfair Display", Georgia, "Times New Roman", serif;
  --body: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;

  --radius-plate: 18px;
}
html[data-theme="day"] {
  --ground:#EFE8F8; --plate:#F8F4FD; --well:#E5DBF3;
  --ink:#241041; --ink-2:#6B5590; --hair:#7E64AC;
  --accent:#4A1D7A; --on-accent:#FFF8E9; --chip:#3A1A66; --gilt:#8E6110;
  --pip-hi:#8A72B4; --pip-lo:#180830; --pip-glow:rgba(255,255,255,.6);
  --field:
    radial-gradient(120% 90% at 50% -10%, #F5E8FF 0%, rgba(245,232,255,0) 60%),

  --face:#FFFFFF;

  --raise: 0 1px 0 rgba(255,255,255,.7), 0 4px 14px rgba(36,16,65,.10);
  --ok-shadow: inset 1px 1px 3px rgba(36,16,65,.18), 0 0 18px -3px rgba(74,29,122,.50);
  --w-body:400; --w-disp:500;
}
html[data-theme="glare"] {
  --ground:#FFFFFF; --plate:#FFFFFF; --well:#FFFFFF;
  --ink:#000000; --ink-2:#000000; --hair:#000000;
  --accent:#000000; --on-accent:#FFFFFF; --chip:#000000; --gilt:#000000;
  --pip-hi:#000000; --pip-lo:#000000; --pip-glow:transparent;

html[data-theme="night"] {

  --ink:#F6F1FF; --ink-2:#B49BD8; --hair:rgba(240,195,92,.55);
  --accent:#F0C35C; --on-accent:#22093C; --chip:#F0C35C; --gilt:#F0C35C;
  --pip-hi:#FFF0C4; --pip-lo:#A76F14; --pip-glow:rgba(255,255,255,.10);
  --field:
    radial-gradient(120% 90% at 50% -10%, #4A1D7A 0%, rgba(74,29,122,0) 60%),
    radial-gradient(90% 70% at 100% 110%, #7A1D5E 0%, rgba(122,29,94,0) 55%),
    linear-gradient(180deg,#1B0B33 0%,#12071F 100%);
  --h1-fill: linear-gradient(180deg,#FFF8E9,#E7A9D8 90%);
  --wash: rgba(240,195,92,.13); --veil: rgba(18,7,32,.78);
  --face:#F2ECFF;
  --face-ink:#1B0A35;
  --sink: inset 1px 1px 3px rgba(0,0,0,.55), inset -1px -1px 1px rgba(255,255,255,.06);
  --raise: inset 0 1px 0 rgba(255,255,255,.10), 0 6px 20px rgba(0,0,0,.45);
  --ok-shadow: inset 1px 1px 3px rgba(0,0,0,.55), 0 0 22px -3px rgba(240,195,92,.60);
  --w-body:350; --w-disp:400;
}

/* ── Volume ───────────────────────────────────────────────── */

/* The hidden attribute must win. A class rule carrying `display` has the same
   specificity as the browser's own `[hidden]` rule and, coming later, beats it
   — so `el.hidden = true` silently does nothing and the element stays put. An
   overlay that stays put swallows every press behind it. */
[hidden]{display:none !important}
* { box-sizing: border-box; }
html, body {
  margin:0; background:var(--ground); color:var(--ink);
  background-image:var(--field); background-attachment:fixed;
  font-family:var(--body); font-weight:var(--w-body); line-height:1.5;
  -webkit-text-size-adjust:100%;
}
body {
  min-height:100dvh; display:flex; justify-content:center;
  padding-bottom: 24px;
  -webkit-user-select:none; user-select:none;
  -webkit-tap-highlight-color: transparent;
}
/* Only the standalone dev harness reserves room for a bottom bar.
   In the shell, the shell owns that space. */
body.standalone { padding-bottom: calc(var(--tap) + 36px + env(safe-area-inset-bottom)); }
.frame { width:100%; max-width:440px; padding:0 var(--gutter); }

header { padding:30px 0 2px; }
.eyebrow {
  font-family:var(--util); font-size:.6875rem; letter-spacing:.18em;
  text-transform:uppercase; color:var(--ink-2);
}
h1 {
  font-family:var(--serif); font-weight:var(--w-disp);
  font-size:2.75rem; line-height:.95; letter-spacing:.03em; margin:10px 0 10px;
  background:var(--h1-fill); -webkit-background-clip:text; background-clip:text; color:transparent;
}
html[data-theme="glare"] h1 { background:none; color:var(--ink); }
.eyebrow { color:var(--gilt); }
.rubric { margin:0; max-width:33ch; font-size:.9375rem; }
.rubric b { font-weight:700; }

.plate {
  position:relative; margin:22px 0 16px; padding:14px 14px 32px;
  background:var(--plate); border:1px solid var(--hair);
  border-radius:var(--radius-plate); box-shadow:var(--raise);
}
html[data-theme="glare"] .plate { border:3px solid var(--ink); border-radius:0; }

.sizes { display:flex; gap:7px; margin:18px 0 0; }
.sizes button {
  flex:1; min-height:46px; padding:7px 4px; cursor:pointer;
  background:transparent; border:1px solid var(--hair); border-radius:var(--radius);
  color:var(--ink-2); font-family:var(--util); font-size:.75rem; letter-spacing:.1em;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
  transition: background .2s, color .2s, border-color .2s;
}
.sizes button small { font-size:.5625rem; letter-spacing:.14em; text-transform:uppercase; opacity:.7; }
.sizes button[aria-pressed="true"] {
  border-color:var(--gilt); color:var(--ink); background:var(--well);
}
.sizes button:focus-visible { outline:3px solid var(--accent); outline-offset:2px; }
html[data-theme="glare"] .sizes button { border-width:2px; border-radius:0; }
html[data-theme="glare"] .sizes button[aria-pressed="true"] {
  background:var(--ink); color:var(--plate); font-weight:700;
}

.grid {
  position:relative; display:grid; grid-template-columns:repeat(var(--n,5),1fr); gap:7px;
  /* square board: cap the width so the height cannot push the controls out */
  width:max(180px, min(100%, calc(100vh - 320px)));
  width:max(180px, min(100%, calc(100dvh - 320px)));
  margin-inline:auto;
}

.cell {
  position:relative; aspect-ratio:1; padding:0; cursor:pointer;
  background:var(--well); border:1px solid var(--hair);
  border-radius:var(--radius); box-shadow:var(--sink);
  transition: box-shadow .18s, border-color .18s;
}
.cell:not(:disabled):hover { border-color:var(--gilt); }
html[data-theme="glare"] .cell { border:2px solid var(--ink); box-shadow:none; }
.cell:disabled { cursor:default; }
.cell:focus-visible { outline:3px solid var(--accent); outline-offset:3px; }

.cell[data-target="1"]::before {
  content:""; position:absolute; inset:11%;
  border:2px solid var(--ink); border-radius:50%; opacity:.85;
}
html[data-theme="glare"] .cell[data-target="1"]::before { border-width:3px; opacity:1; }
.cell[data-cleared="1"]::after {
  content:""; position:absolute; left:32%; right:32%; top:calc(50% - 1px);
  height:2px; background:var(--ink);
}
.cell[data-unstable="1"] { outline:2px solid var(--ink); outline-offset:-2px; }

.pips {
  position:absolute; inset:18%;
  display:grid; grid-template-columns:repeat(3,1fr); grid-template-rows:repeat(3,1fr);
  place-items:center;
}
/* A pip should read as drilled into the well and filled, the way a die
   does: a light from the upper left, a shaded lower rim, and a hairline
   of ground light where the fill meets the well. */
.pips i {
  width:min(13px,32%); aspect-ratio:1; border-radius:50%; display:block;
  background: radial-gradient(circle at 34% 28%, var(--pip-hi) 0%, var(--chip) 52%, var(--pip-lo) 100%);
  box-shadow: inset 0 -1px 1.5px rgba(0,0,0,.38), 0 1px 0 var(--pip-glow);
}
html[data-theme="glare"] .pips i {
  width:min(13px,32%); background:var(--chip); box-shadow:none;
}
/* Marks the well the reveal pointed at. */
.cell[data-armed="1"] { outline:3px solid var(--accent); outline-offset:-3px; }

.pips[data-n="1"] i:nth-child(1){grid-area:2/2}
.pips[data-n="2"] i:nth-child(1){grid-area:1/1} .pips[data-n="2"] i:nth-child(2){grid-area:3/3}
.pips[data-n="3"] i:nth-child(1){grid-area:1/1} .pips[data-n="3"] i:nth-child(2){grid-area:2/2} .pips[data-n="3"] i:nth-child(3){grid-area:3/3}
.pips[data-n="4"] i:nth-child(1){grid-area:1/1} .pips[data-n="4"] i:nth-child(2){grid-area:1/3} .pips[data-n="4"] i:nth-child(3){grid-area:3/1} .pips[data-n="4"] i:nth-child(4){grid-area:3/3}
.pips[data-n="5"] i:nth-child(1){grid-area:1/1} .pips[data-n="5"] i:nth-child(2){grid-area:1/3} .pips[data-n="5"] i:nth-child(3){grid-area:2/2} .pips[data-n="5"] i:nth-child(4){grid-area:3/1} .pips[data-n="5"] i:nth-child(5){grid-area:3/3}
.pips[data-n="6"] i:nth-child(1){grid-area:1/1} .pips[data-n="6"] i:nth-child(2){grid-area:2/1} .pips[data-n="6"] i:nth-child(3){grid-area:3/1} .pips[data-n="6"] i:nth-child(4){grid-area:1/3} .pips[data-n="6"] i:nth-child(5){grid-area:2/3} .pips[data-n="6"] i:nth-child(6){grid-area:3/3}
.pips[data-n="7"] i:nth-child(1){grid-area:1/1} .pips[data-n="7"] i:nth-child(2){grid-area:2/1} .pips[data-n="7"] i:nth-child(3){grid-area:3/1} .pips[data-n="7"] i:nth-child(4){grid-area:2/2} .pips[data-n="7"] i:nth-child(5){grid-area:1/3} .pips[data-n="7"] i:nth-child(6){grid-area:2/3} .pips[data-n="7"] i:nth-child(7){grid-area:3/3}

.flyer {
  position:absolute; width:min(13px,4.2vw); aspect-ratio:1; border-radius:50%;
  background: radial-gradient(circle at 34% 28%, var(--pip-hi) 0%, var(--chip) 52%, var(--pip-lo) 100%);
  box-shadow: inset 0 -1px 1.5px rgba(0,0,0,.38);
  pointer-events:none; z-index:3;
  transition: transform var(--flight,90ms) cubic-bezier(.33,.9,.5,1), opacity var(--flight,90ms) linear;
  will-change: transform, opacity;
}
html[data-theme="glare"] .flyer { width:min(13px,4.2vw); background:var(--chip); box-shadow:none; }

.legend {
  position:absolute; left:14px; right:14px; bottom:9px;
  display:flex; justify-content:space-between;
  font-family:var(--util); font-size:.625rem; letter-spacing:.16em;
  text-transform:uppercase; color:var(--ink-2);
}

.verdict { min-height:4.4em; margin-bottom:16px; }
.verdict .word {
  font-family:var(--serif); font-size:1.5rem; font-weight:var(--w-disp);
  line-height:1.1; display:block; margin-bottom:4px;
}
.verdict .line {
  font-family:var(--util); font-size:.75rem; letter-spacing:.05em;
  color:var(--ink-2); line-height:1.45;
}
.legend { color:var(--ink-2); }
.shared { margin:9px 0 0; font-family:var(--util); font-size:.6875rem;
  letter-spacing:.06em; color:var(--ink-2); }
.shared

.actions { display:grid; gap:9px; }
.btn {
  min-height:var(--tap); border-radius:var(--radius-pill); cursor:pointer;
  font-family:var(--util); font-size:.75rem; font-weight:700;
  letter-spacing:.16em; text-transform:uppercase; border:1px solid var(--accent);
  display:flex; align-items:center; justify-content:center; gap:9px;
  transition: background .2s, color .2s, transform .18s;
}
.btn[data-rank="primary"] { background:var(--accent); color:var(--on-accent); }
.btn[data-rank="secondary"] { background:transparent; color:var(--gilt); border-color:var(--hair); }
.btn[data-rank="secondary"]:not(:disabled):hover { background:var(--accent); color:var(--on-accent); }
.btn:disabled { opacity:.4; cursor:default; }
.btn svg { width:16px; height:16px; flex:0 0 auto; }
html[data-theme="glare"] .btn { border-width:3px; border-radius:0; }
html[data-theme="glare"] .btn[data-rank="secondary"] { border-color:var(--ink); color:var(--ink); }
.btn:focus-visible { outline:3px solid var(--accent); outline-offset:3px; }

/* ── Standalone dev harness ───────────────────────────────────
   Contract §1: a volume must open and play correctly outside the
   shell. Contract §11: a volume never draws settings controls.
   Both hold — this bar exists only when the volume is top-level,
   which never happens inside the shell.
   ─────────────────────────────────────────────────────────── */
.devbar { display:none; }
body.standalone .devbar {
  position:fixed; left:0; right:0; bottom:0; background:var(--plate);
  border-top:1px solid var(--hair);
  padding:8px var(--gutter) calc(8px + env(safe-area-inset-bottom));
  display:flex; justify-content:center;
}
.devbar-inner { width:100%; max-width:440px; display:flex; gap:8px; align-items:center; }
.modes { display:flex; gap:4px; flex:1; }
.mode, .toggle {
  min-height:42px; background:transparent; border:1px solid var(--hair);
  border-radius:var(--radius); color:var(--ink-2); font-family:var(--util);
  font-size:.625rem; letter-spacing:.12em; text-transform:uppercase; cursor:pointer;
}
.mode { flex:1; }
.toggle { width:42px; flex:0 0 42px; display:grid; place-items:center; padding:0; }
.mode[aria-pressed="true"], .toggle[aria-pressed="true"] {
  background:var(--ink); border-color:var(--ink); color:var(--plate); font-weight:700;
}
.mode:focus-visible, .toggle:focus-visible { outline:3px solid var(--accent); outline-offset:2px; }
.toggle svg { width:20px; height:20px; }
.toggle .off { display:none; }
.toggle[aria-pressed="false"] .off { display:block; }


/* see the note in Glean: short viewport, trimmed chrome, smaller board cap */
@media (max-height:560px){
  .grid{width:max(140px, min(100%, calc(100dvh - 250px)))}
}
/* Tablet portrait: a wider column and larger type. Landscape tablet and
   computer: the board on the left, rubric, sizes, verdict and buttons beside it. */
@media (min-width:700px) and (orientation:portrait){
  .frame{max-width:640px}
  .rubric{max-width:none; font-size:1.05rem}
  .grid{width:max(200px, min(100%, calc(100dvh - 430px)))}
}
@media (min-width:700px) and (orientation:landscape), (min-width:1000px){
  body{align-items:flex-start}
  .frame{max-width:1100px; display:grid; column-gap:32px; align-items:start; padding-top:18px;
    grid-template-columns:minmax(0,1fr) minmax(280px,360px);
    grid-template-rows:repeat(6, auto) 1fr}
  .frame > .plate{grid-column:1; grid-row:1 / -1; margin:0; justify-self:center; width:100%;
    max-width:calc(100dvh - 40px)}
  .frame > :not(.plate){grid-column:2}
  .grid{width:max(200px, min(100%, calc(100dvh - 110px)))}
  .rubric{max-width:none; font-size:1rem}
  .verdict{margin-top:18px}
}
@media (prefers-reduced-motion: reduce) { .flyer { transition:none; } }
</style>
