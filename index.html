   ================================================================== */
:root {
  --serif: "Didot", "Bodoni MT", "Playfair Display", Georgia, "Times New Roman", serif;
  --body: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --util: ui-monospace, "SF Mono", "Cascadia Mono", "Roboto Mono", Menlo, monospace;
  --tap: 52px;
  --gutter: 20px;
  --radius: 10px;
  --radius-pill: 999px;
  --radius-plate: 18px;
}
html[data-theme="day"] {
  --ground:#EFE8F8; --plate:#F8F4FD; --well:#E5DBF3;
  --ink:#241041; --ink-2:#6B5590; --hair:#7E64AC;
  --accent:#4A1D7A; --on-accent:#FFF8E9; --chip:#3A1A66; --gilt:#8E6110;
  --pip-hi:#8A72B4; --pip-lo:#180830; --pip-glow:rgba(255,255,255,.6);
  --field:
    radial-gradient(120% 90% at 50% -10%, #F5E8FF 0%, rgba(245,232,255,0) 60%),
    radial-gradient(90% 70% at 100% 110%, #FFEAD6 0%, rgba(255,234,214,0) 55%),
    linear-gradient(180deg,#F2EBFA 0%,#E7DEF3 100%);
  --h1-fill: linear-gradient(180deg,#2E1350,#7A3A9E 92%);
  --wash: rgba(74,29,122,.10); --veil: rgba(36,16,65,.55);
  --face:#FFFFFF;
  --face-ink:#180830;
  --sink: inset 1px 1px 3px rgba(36,16,65,.18), inset -1px -1px 1px rgba(255,255,255,.85);
  --raise: 0 1px 0 rgba(255,255,255,.7), 0 4px 14px rgba(36,16,65,.10);
  --ok-shadow: inset 1px 1px 3px rgba(36,16,65,.18), 0 0 18px -3px rgba(74,29,122,.50);
  --w-body:400; --w-disp:500;
}
html[data-theme="glare"] {
  --ground:#FFFFFF; --plate:#FFFFFF; --well:#FFFFFF;
  --ink:#000000; --ink-2:#000000; --hair:#000000;
  --accent:#000000; --on-accent:#FFFFFF; --chip:#000000; --gilt:#000000;
  --pip-hi:#000000; --pip-lo:#000000; --pip-glow:transparent;
  --field:#FFFFFF;
  --h1-fill: none;
  --wash: transparent; --veil: rgba(0,0,0,.65);
  --face:#FFFFFF;
  --face-ink:#000000;
  --sink: none; --raise: none; --ok-shadow: none;
  --w-body:600; --w-disp:700;
}
html[data-theme="night"] {
  --ground:#12071F; --plate:#241041; --well:#1B0A35;
  --ink:#F6F1FF; --ink-2:#B49BD8; --hair:rgba(240,195,92,.55);
  --accent:#F0C35C; --on-accent:#22093C; --chip:#F0C35C; --gilt:#F0C35C;
  --pip-hi:#FFF0C4; --pip-lo:#A76F14; --pip-glow:rgba(255,255,255,.10);
  --field:
    radial-gradient(120% 90% at 50% -10%, #4A1D7A 0%, rgba(74,29,122,0) 60%),
    radial-gradient(90% 70% at 100% 110%, #7A1D5E 0%, rgba(122,29,94,0) 55%),
    linear-gradient(180deg,#1B0B33 0%,#12071F 100%);
  --h1-fill: linear-gradient(180deg,#FFF8E9,#E7A9D8 90%);
  --wash: rgba(240,195,92,.13); --veil: rgba(18,7,32,.78);
  --face:#F2ECFF;
  --face-ink:#1B0A35;
  --sink: inset 1px 1px 3px rgba(0,0,0,.55), inset -1px -1px 1px rgba(255,255,255,.06);
  --raise: inset 0 1px 0 rgba(255,255,255,.10), 0 6px 20px rgba(0,0,0,.45);
  --ok-shadow: inset 1px 1px 3px rgba(0,0,0,.55), 0 0 22px -3px rgba(240,195,92,.60);
  --w-body:350; --w-disp:400;
}

/* §2  volume-local geometry only — no colour authored below this line */
:root{ --ease: cubic-bezier(.16,1,.3,1); }
[hidden]{display:none !important}
*{box-sizing:border-box}
html,body{height:100%; margin:0}
body{
  background:var(--ground); color:var(--ink);
  background-image:var(--field); background-attachment:fixed;
  font-family:var(--body); font-weight:var(--w-body);
  font-size:16px; line-height:1.45;
  -webkit-text-size-adjust:100%; -webkit-tap-highlight-color:transparent;
  overflow:hidden; overscroll-behavior:none;
}
.app{
  height:100vh; height:100dvh; max-width:520px; margin:0 auto;
  display:flex; flex-direction:column;
  padding:calc(env(safe-area-inset-top) + 4px) var(--gutter) 0;
}
/* ---------- counters ---------- */
.counters{flex:0 0 auto; display:flex; gap:7px; padding-bottom:12px}
.counter{
  flex:1; min-width:0; padding:8px 4px 9px; border-radius:var(--radius);
  background:var(--well); border:1px solid var(--hair); box-shadow:var(--sink);
  text-align:center;
}
.counter b{
  display:block; font-family:var(--util); font-size:1rem; font-weight:600;
  font-variant-numeric:tabular-nums; letter-spacing:-.03em; color:var(--ink);
  white-space:nowrap; overflow:hidden;
}
.counter span{display:block; font-size:.62rem; color:var(--ink-2); letter-spacing:.04em}
.counter.hot b{color:var(--gilt)}
/* ---------- the plate ---------- */
.plate{
  flex:0 0 auto; position:relative; padding:14px; margin-bottom:12px;
  background:var(--plate); border:1px solid var(--hair);
  border-radius:var(--radius-plate); box-shadow:var(--raise);
}
.boardwrap{
  position:relative; user-select:none; -webkit-user-select:none;
  container-type:inline-size;
  /* the board is square, so capping its width caps its height. --chrome is
     everything stacked above and below it in the current layout. */
  --chrome:330px;
  width:100%;
  width:max(200px, min(100%, calc(100vh - var(--chrome))));
  width:max(200px, min(100%, calc(100dvh - var(--chrome))));
  margin-inline:auto;
}
button:focus-visible{outline:2px solid var(--gilt); outline-offset:3px}
button:focus:not(:focus-visible){outline:none}
/* ---------- readout ---------- */
.read{
  min-height:3.2em; margin:12px 0 2px; text-align:center;
  font-size:.86rem; color:var(--ink-2);
}
.read b{
  display:inline-block; font-family:var(--serif); font-weight:var(--w-disp);
  font-size:1.4rem; letter-spacing:.02em; color:var(--ink); margin-right:.35em;
}
html[data-display="fallback"] .read b{font-weight:700}
.read .sub{display:block; font-size:.82rem}
/* ---------- pills ---------- */
.controls{display:flex; gap:9px; padding-top:10px}
.btn{
  flex:1; min-height:var(--tap); font:inherit; font-size:.9rem; cursor:pointer;
  padding:0 8px; border-radius:var(--radius-pill);
  background:var(--plate); color:var(--ink-2);
  border:1px solid var(--hair); box-shadow:var(--raise);
  transition:transform .12s ease, color .2s, border-color .2s;
}
.btn:hover{color:var(--ink); border-color:var(--gilt)}
.btn:active{transform:translateY(1.5px)}
.btn[disabled]{opacity:.4; cursor:default}
.btn.go{font-weight:600; background:var(--accent); border-color:var(--accent); color:var(--on-accent)}
html[data-theme="glare"] .btn.go{border-width:3px}
/* ---------- strip ---------- */
.strip{
  flex:1 1 auto; min-height:0; overflow-y:auto; overscroll-behavior:contain;
  padding:6px 0 14px; scrollbar-width:thin;
}
.strip::-webkit-scrollbar{width:3px}
.strip::-webkit-scrollbar-thumb{background:var(--hair); border-radius:3px}
.strip-head{display:flex; align-items:center; gap:8px; padding-bottom:10px}
.strip-head p{margin:0; flex:1; min-width:0; font-size:.8rem; color:var(--ink-2)}
.strip-head p strong{color:var(--ink)}
.chip{
  flex:0 0 auto; font:inherit; font-size:.76rem; padding:9px 13px; cursor:pointer;
  border-radius:var(--radius-pill); white-space:nowrap;
  background:var(--plate); color:var(--gilt);
  border:1px solid var(--hair); box-shadow:var(--raise);
}
.chip:hover{border-color:var(--gilt)}
.chip[disabled]{opacity:.4; cursor:default}
.rows{display:flex; flex-direction:column; gap:7px}
.row{
  display:flex; align-items:baseline; gap:10px; padding:9px 12px;
  border-radius:var(--radius); background:var(--well);
  border:1px solid var(--hair); box-shadow:var(--sink);
  font-size:.8rem; color:var(--ink-2);
}
.row b{font-family:var(--util); font-size:.9rem; color:var(--ink); font-variant-numeric:tabular-nums}
.row .grow{flex:1}
.row.crown{border-color:var(--gilt)}
.row.crown b{color:var(--gilt)}
/* ---------- footer ---------- */
footer{
  flex:0 0 auto; display:flex; gap:9px; align-items:center;
  padding:11px 0 calc(env(safe-area-inset-bottom) + 12px);
  border-top:1px solid var(--hair);
}
.seg{
  flex:1; display:flex; gap:5px; padding:4px; border-radius:var(--radius-pill);
  background:var(--well); border:1px solid var(--hair); box-shadow:var(--sink);
}
.seg button{
  flex:1; font:inherit; font-size:.8rem; min-height:40px; padding:0 2px; cursor:pointer;
  border:0; border-radius:var(--radius-pill); background:none; color:var(--ink-2);
  transition:background .3s var(--ease), color .3s var(--ease);
}
.seg button[aria-pressed="true"]{background:var(--accent); color:var(--on-accent); font-weight:600}
.wa{
  flex:0 0 auto; min-height:var(--tap); padding:0 15px; cursor:pointer;
  display:flex; align-items:center; gap:8px;
  font:inherit; font-size:.82rem; border-radius:var(--radius-pill);
  background:var(--plate); color:var(--gilt);
  border:1px solid var(--hair); box-shadow:var(--raise);
}
.wa svg{width:17px; height:17px; fill:none; stroke:currentColor;
  stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round}
.wa[disabled]{opacity:.4; cursor:default}
/* ---------- toast ---------- */
.toast{
  position:fixed; left:50%; z-index:60;
  bottom:calc(env(safe-area-inset-bottom) + 84px);
  transform:translate(-50%,16px) scale(.97);
  max-width:84vw; padding:12px 18px; text-align:center;
  border-radius:var(--radius-plate);
  background:var(--plate); color:var(--ink);
  border:1px solid var(--hair); box-shadow:var(--raise);
  font-size:.84rem; opacity:0; pointer-events:none;
  transition:opacity .3s var(--ease), transform .42s var(--ease);
}
.toast b{font-family:var(--serif); font-weight:var(--w-disp); color:var(--gilt)}
.toast.up{opacity:1; transform:translate(-50%,0) scale(1)}
.sr-only{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:.01ms !important; animation-iteration-count:1 !important;
    transition-duration:.01ms !important}
}

/* ---------- rules sheet ----------
   Rules live in a sheet over the board, not in the scrolling strip, so they
   can always be read in full: bottom sheet on a phone, centred card on a
   tablet or computer. Opens itself the first time a volume is played. */
.rulesbtn{display:inline-flex; align-items:center; gap:6px}
.rulesbtn svg{width:15px; height:15px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round}
.rules{
  position:fixed; inset:0; z-index:80; display:flex; align-items:flex-end; justify-content:center;
  background:var(--veil);
}
.rules-card{
  width:100%; max-width:640px; max-height:92vh; max-height:92dvh; overflow-y:auto; overscroll-behavior:contain;
  background:var(--plate); color:var(--ink); border:1px solid var(--hair); box-shadow:var(--raise);
  border-radius:var(--radius-plate) var(--radius-plate) 0 0;
  padding:22px var(--gutter) calc(env(safe-area-inset-bottom) + 18px);
  animation:rise .32s var(--ease);
}
@keyframes rise{from{transform:translateY(40px); opacity:0} to{transform:none; opacity:1}}
.rules-card h2{
  margin:0 0 4px; font-family:var(--serif); font-weight:var(--w-disp); font-size:1.6rem; line-height:1.15;
}
.rules-card .lede{margin:0 0 16px; color:var(--ink-2); font-size:1rem}
.rules-body{font-size:1.02rem; line-height:1.6}
.rules-body p{margin:0 0 12px}
.rules-body ol{margin:0 0 14px; padding-left:1.3em}
.rules-body li{margin-bottom:8px}
.rules-body b{font-weight:700}
.rules-body .key{display:grid; grid-template-columns:52px 1fr; gap:10px 14px; align-items:center; margin:6px 0 16px}
.rules-body .key > span{font-size:.98rem}
.rules-card .btn{width:100%; margin-top:8px}
html[data-theme="glare"] .rules-body, html[data-theme="glare"] .rules-card .lede{font-weight:600}

/* ---------- layouts ----------
   Phone portrait: one column, board as large as the height allows.
   Tablet portrait: one wider column, larger type.
   Landscape tablet and computer: board on the left, everything else beside it. */
@media (min-width:700px) and (orientation:portrait){
  html{font-size:17px}
  .app{max-width:680px}
  .boardwrap{--chrome:380px}
  .counter b{font-size:1.15rem}
  .counter span{font-size:.7rem}
}
@media (min-width:700px) and (orientation:landscape), (min-width:1000px){
  html{font-size:17px}
  .app{
    max-width:1180px; display:grid; column-gap:28px;
    grid-template-columns:minmax(0,1fr) minmax(300px,380px);
    grid-template-rows:auto minmax(0,1fr) auto;
    padding-top:calc(env(safe-area-inset-top) + 14px);
  }
  .plate{grid-column:1; grid-row:1 / 4; align-self:start; justify-self:center; width:100%;
    max-width:min(760px, calc(100vh - 200px)); max-width:min(760px, calc(100dvh - 200px))}
  .boardwrap{--chrome:230px}
  .counters{grid-column:2; grid-row:1}
  .strip{grid-column:2; grid-row:2}
  footer{grid-column:2; grid-row:3}
  .counter b{font-size:1.15rem}
  .counter span{font-size:.7rem}
  .toast{bottom:36px}
  .rules{align-items:center; padding:24px}
  .rules-card{border-radius:var(--radius-plate); padding-bottom:22px}
}
/* a squat window: trim the chrome so the board keeps its size */
@media (max-height:640px) and (orientation:portrait){
  :root{--tap:44px}
  .counters{padding-bottom:6px}
  .counter{padding:5px 4px 6px}
  .read{min-height:2.4em; margin:8px 0 0}
  .read b{font-size:1.15rem}
  .plate{padding:10px}
  .boardwrap{--chrome:280px}
}
@media (max-height:520px) and (orientation:landscape){
  .boardwrap{--chrome:170px}
  .read{min-height:2.2em; margin:6px 0 0}
  .plate{padding:10px}
}

/* ---------- the manor ---------- */
.grid{display:grid; grid-template-columns:repeat(5,1fr); gap:6px}
.cell{
  position:relative; aspect-ratio:1; padding:0; cursor:pointer;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px;
  border-radius:var(--radius);
  background:var(--well); border:1px solid var(--hair); box-shadow:var(--sink);
  color:var(--ink); font:inherit;
  transition:background .18s var(--ease), color .18s var(--ease), transform .12s var(--ease);
}
.cell .ico{width:42%; height:auto; display:block}
.cell .ico *{fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round}
.cell .ico .dot{fill:currentColor; stroke:none}
.cell .num{
  font-family:var(--serif); font-weight:var(--w-disp); line-height:1;
  font-size:clamp(1rem, 5.2vw, 1.45rem);
  font-size:clamp(1rem, 7.5cqw, 2.8rem);
}
.cell .num.word{font-family:var(--body); font-size:clamp(.62rem, 2.6vw, .78rem); font-size:clamp(.62rem, 3.4cqw, 1.2rem); font-weight:600; letter-spacing:.02em}
html[data-display="fallback"] .cell .num{font-weight:700}
.cell.paid{background:var(--plate); box-shadow:var(--raise)}
.cell.owing{background:var(--accent); color:var(--on-accent); border-color:var(--accent); box-shadow:var(--raise)}
/* a paid plot and an owing plot must part without colour: owing carries a bar */
.cell.owing::before{
  content:""; position:absolute; left:18%; right:18%; bottom:7%; height:3px;
  border-radius:3px; background:currentColor; opacity:.85;
}
.cell.given::after, .cell.slip::after, .cell.wrong::after{
  position:absolute; top:3px; right:5px; font-size:max(.62rem, 2.6cqw); font-family:var(--util); line-height:1;
}
.cell.given::after{content:"\2022"}
.cell.slip::after{content:"?"}
.cell.wrong::after{content:"\00D7"}
.cell.sel{outline:3px solid var(--gilt); outline-offset:2px; z-index:2; transform:scale(1.04)}
.cell.scope{border-color:var(--gilt); box-shadow:0 0 0 2px var(--gilt) inset}
.cell.src{outline:2px dashed var(--gilt); outline-offset:2px}
.cell.nudge{animation:nudge 1.1s var(--ease) 2}
@keyframes nudge{0%,100%{transform:scale(1)} 50%{transform:scale(1.08)}}
html[data-theme="glare"] .cell.sel{outline-width:4px}
.marks{display:flex; gap:9px; padding-top:10px}
.marks .btn{font-size:1rem}
.key .cell{width:52px; cursor:default; pointer-events:none}
.key .cell .num{font-size:1.25rem}
.key .cell .num.word{font-size:.78rem}
</style>
</head>
<body>
<div class="app">
  <div class="counters">
    <div class="counter"><b id="cSet">0/25</b><span>settled</span></div>
    <div class="counter"><b id="cTime">0:00</b><span>time</span></div>
    <div class="counter" id="slipBox"><b id="cSlip">0</b><span>slips</span></div>
    <div class="counter"><b id="cKnot">&ndash;</b><span>knots</span></div>
  </div>
  <section class="plate">
    <div class="boardwrap"><div class="grid" id="grid" role="grid" aria-label="The manor, five by five plots"></div></div>
    <p class="read" id="read" aria-live="polite"></p>
    <div class="marks">
      <button class="btn" id="mPaid" disabled>Paid</button>
      <button class="btn go" id="mOwe" disabled>Owing</button>
    </div>
  </section>
  <section class="strip">
    <div class="strip-head">
      <p id="standing"></p>
      <button class="chip rulesbtn" id="rulesBtn"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.3a2.5 2.5 0 0 1 4.8.9c0 1.7-2.4 2.1-2.4 3.6M12 17h.01"/></svg>How to play</button>
      <button class="chip" id="hint">Nudge</button>
      <button class="chip" id="fresh" hidden>New board</button>
    </div>
    <div class="rows" id="rows"></div>
  </section>
  <footer>
    <div class="seg" role="group" aria-label="Which board">
      <button data-mode="daily" aria-pressed="true">Today</button>
      <button data-mode="free" aria-pressed="false">Free</button>
    </div>
    <button class="wa" id="share" disabled>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 8.9 8.9 0 0 1-3.8-.8L3 20.5l1.4-4.1A8.4 8.4 0 0 1 12 3.1a8.4 8.4 0 0 1 9 8.4z"/><path d="M8.8 9.2c0 3 2.2 5.2 5.2 5.2"/></svg>
      WhatsApp
    </button>
  </footer>
</div>
<div class="rules" id="rules" role="dialog" aria-modal="true" aria-labelledby="rulesTitle" hidden>
  <div class="rules-card">
    <h2 id="rulesTitle">How to play Reeve</h2>
    <p class="lede">Prove every plot paid or owing. No guessing.</p>
    <div class="rules-body">
      <p>Every plot on the manor is either <b>paid</b> or <b>owing</b>. Work out which, using only what the clues prove.</p>
      <ol>
        <li>One plot starts settled. It shows a clue about other plots.</li>
        <li>Tap an open plot, then tap <b>Paid</b> or <b>Owing</b>. Each plot you settle shows its own clue, so the board opens up as you go.</li>
        <li>You may only settle a plot the clues already <b>prove</b>. A guess is turned away and counts as a slip.</li>
        <li>A proven plot marked the wrong way is settled for you, and also counts as a slip.</li>
        <li>Tap a settled plot to outline every plot its clue counts.</li>
      </ol>
      <p><b>The four clues</b></p>
      <div class="key" id="key"></div>
      <p>Owing plots are filled in and carry a bar along the bottom. There is always at least one plot you can prove. <b>Nudge</b> lights one up, at the cost of a slip.</p>
      <p>Monday is gentle. By Sunday you will need to read two clues together to move: the game calls those <b>knots</b>.</p>
    </div>
    <button class="btn go" id="rulesClose">Got it</button>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
"use strict";
window.C2 = (function () {
  "use strict";
  var slug = null, listeners = [];
  var set = { mode: "auto", sound: true, haptic: true };
  /* An srcdoc iframe has no URL of its own, so a volume cannot read or write
     a share fragment directly. The shell owns the address bar and passes the
     fragment down; the volume asks for it, and asks for it to be updated. */
  var ctx = { base: "", frag: "" };
  var embedded = (function () { try { return window.parent !== window; } catch (e) { return false; } })();

  function resolve(m) {
    if (m && m !== "auto") return m;
    try {
      return window.matchMedia("(prefers-color-scheme: dark)").matches ? "night" : "day";
    } catch (e) { return "day"; }
  }
  function apply(s) {
    if (s) { for (var k in s) if (s.hasOwnProperty(k)) set[k] = s[k]; }
    document.documentElement.setAttribute("data-theme", resolve(set.mode));
    listeners.forEach(function (fn) { try { fn(set); } catch (e) {} });
    if (window.VOLUME && window.VOLUME.settingsChanged) {
      try { window.VOLUME.settingsChanged(set); } catch (e) {}
    }
  }
  window.addEventListener("message", function (e) {
    var m = e.data;
    if (!m || m.c2 !== 1) return;
    if (m.type === "settings") {
      if (typeof m.base === "string") ctx.base = m.base;
      if (typeof m.frag === "string") ctx.frag = m.frag;
      apply(m.settings);
    }
    if (m.type === "mount") {
      var o = m.opts || {};
      if (typeof o.frag === "string") ctx.frag = o.frag;
      if (window.VOLUME && window.VOLUME.mount) window.VOLUME.mount(o);
    }
    if (m.type === "suspend") {
      if (window.VOLUME && window.VOLUME.suspend) window.VOLUME.suspend();
      if (api.onPause) api.onPause();
    }

      scope = scope === k ? -1 : k; sel = -1;
      paint();
      if (scope >= 0) read(G.known[k] ? "Owing." : "Paid.", "Its clue: " + sayClue(B.clues[k], B.vals[k]) + ".");
      else read("&nbsp;", "");
      return;
    }
    if (G.done) return;
    sel = sel === k ? -1 : k; scope = -1;
    sndPick(); paint();
    if (sel >= 0) read("Row " + ((k / 5 | 0) + 1) + ", plot " + (k % 5 + 1) + ".", "Paid or owing?");
    else read("&nbsp;", "");
  }
  function mark(v) {
    if (sel < 0 || !G || G.done) return;
    var k = sel;
    startClock();
    if (!proven(k)) {
      G.refused++; if (G.flags[k] !== 3) G.flags[k] = 2;
      sndNo();
      read("Not proven yet.", "Nothing settled so far pins that plot down. Look elsewhere.");
      save(); counters(); paint();
      return;
    }
    var right = v === B.truth[k];
    G.known[k] = B.truth[k];
    if (!right) { G.wrong++; G.flags[k] = 3; }
    else if (G.flags[k] === 0) G.flags[k] = 1;
    if (nudged === k) nudged = -1;
    sel = -1;
    if (right) { sndGood(v); read(v ? "Owing." : "Paid.", "Its clue: " + sayClue(B.clues[k], B.vals[k]) + "."); }
    else { sndNo(); read("Proven " + (B.truth[k] ? "owing." : "paid."), "Settled for you. That counts as a slip."); }
    if (settledCount() === R_S) finish();
    save(); paint(); counters();
  }
  function nudge() {
    if (!G || G.done) return;
    var f = rEasy(G.known, consFrom(G.known));
    if (!f.length) f = rForced(G.known, consFrom(G.known)) || [];
    if (!f.length) return;
    var k = f[0].cell;
    G.hints++; if (G.flags[k] === 0) G.flags[k] = 2;
    nudged = k; sel = k; scope = -1;
    startClock(); save(); paint(); counters();
    read("This one can be proven.", "Read the clues that count it. A nudged plot counts as a slip.");
  }
  function finish() {
    G.done = true;
    stopClock();
    if (G.daily && G.date === today()) {
      stats.plays++;
      var clean = !G.hints && !G.refused && !G.wrong;
      if (clean) stats.clean++;
      if (stats.lastDaily !== G.date) {
        stats.streak = stats.lastDaily === yesterdayOf(G.date) ? stats.streak + 1 : 1;
        stats.lastDaily = G.date;
      }
      C2.write("stats", stats);
    }
    sndDone(); finishRead(); standing();
    $("share").disabled = false;
  }
  function slips() { return G.hints + G.refused + G.wrong; }
  function finishRead() {
    var s = slips();
    read("Settled.", "All 25 plots in " + clock(G.elapsed) + (s ? ", with " + s + (s === 1 ? " slip." : " slips.") : ", clean."));
  }

  /* ── clock: runs only while the board is on screen and unfinished ── */
  function startClock() {
    if (tick || G.done) return;
    startedAt = Date.now() - G.elapsed;
    tick = setInterval(function () { G.elapsed = Date.now() - startedAt; $("cTime").textContent = clock(G.elapsed); }, 500);
  }
  function stopClock() {
    if (!tick) return;
    clearInterval(tick); tick = null;
    G.elapsed = Date.now() - startedAt;
    save();
  }

  /* ── paint ─────────────────────────────────────────── */
  function paint() {
    var inScope = {};
    if (scope >= 0) rConstraint(B.clues[scope], scope, 0).cells.forEach(function (x) { inScope[x] = 1; });
    for (var k = 0; k < R_S; k++) {
      var el = cells[k], v = G.known[k], cls = "cell";
      if (v === 0) cls += " paid"; else if (v === 1) cls += " owing";
      if (G.flags[k] === 4) cls += " given";
      else if (v >= 0 && G.flags[k] === 2) cls += " slip";
      else if (G.flags[k] === 3) cls += " wrong";
      if (k === sel) cls += " sel";
      if (inScope[k]) cls += " scope";
      if (k === scope) cls += " src";
      if (k === nudged) cls += " nudge";
      el.className = cls;
      el.innerHTML = v >= 0 ? face(B.clues[k], B.vals[k]) : "";
      el.setAttribute("aria-label", "Row " + ((k / 5 | 0) + 1) + " plot " + (k % 5 + 1) + ", " +
        (v < 0 ? "open" : (v ? "owing" : "paid") + ", " + sayClue(B.clues[k], B.vals[k])));
    }
    var can = sel >= 0 && !G.done;
    $("mPaid").disabled = !can; $("mOwe").disabled = !can;
    $("hint").disabled = G.done;
  }
  function counters() {
    $("cSet").textContent = settledCount() + "/25";
    $("cTime").textContent = clock(G.elapsed);
    $("cSlip").textContent = String(slips());
    $("slipBox").classList.toggle("hot", slips() === 0 && settledCount() > 1);
    $("cKnot").textContent = String(B.hard);
  }
  function standing() {
    $("standing").innerHTML = mode === "daily"
      ? "Today&rsquo;s manor, <strong>" + pretty(G.date) + "</strong>"
      : "Free board <strong>" + B.seed.toString(36) + "</strong>";
    $("fresh").hidden = mode !== "free";
    var rows = [["Daily streak", String(stats.streak), stats.streak > 1 ? "crown" : ""],
                ["Clean dailies", stats.clean + " of " + stats.plays, ""],
                ["Knots on this board", String(B.hard), ""]];
    $("rows").innerHTML = rows.map(function (r) {
      return "<div class='row " + r[2] + "'><span class='grow'>" + r[0] + "</span><b>" + r[1] + "</b></div>";
    }).join("");
    var segs = document.querySelectorAll(".seg button");
    for (var k = 0; k < segs.length; k++) segs[k].setAttribute("aria-pressed", String(segs[k].dataset.mode === mode));
  }
  function read(word, line) { $("read").innerHTML = "<b>" + word + "</b><span class='sub'>" + line + "</span>"; }
  var toastTimer;
  function toast(msg) {
    var t = $("toast"); t.innerHTML = msg; t.classList.add("up");
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.classList.remove("up"); }, 2600);
  }

  /* ── storage: one slot for today's daily, one for the current free board ── */
  function save() {
    if (!G) return;
    C2.write(G.daily ? "day" : "free", G);
  }
  function loadDaily() {
    mode = "daily";
    var d = today(), s = C2.read("day", null);
    var seed = seedFor(SLUG, d), rung = WEEK[new Date().getDay()];
    C2.setFrag("");
    generate(seed, rung[0], rung[1], function (c) {
      present(c, (s && s.date === d && s.seed === seed && s.known && s.known.length === R_S) ? s : null);
    });
  }
  function loadFree(seed) {
    mode = "free";
    var s = C2.read("free", null);
    if (seed === undefined) seed = (s && !s.done) ? s.seed : (Math.random() * 4294967296) >>> 0;
    C2.setFrag("b=" + seed.toString(36));
    generate(seed, FREE[0], FREE[1], function (c) {
      present(c, (s && s.seed === seed && s.known && s.known.length === R_S) ? s : null);
    });
  }

  /* ── share: the grid shows how you played, never the answer ── */
  function share() {
    if (!G || !G.done) return;
    var EM = ["\u2B1B", "\uD83D\uDFE9", "\uD83D\uDFE8", "\uD83D\uDFE5", "\u2B1C"], lines = [];
    lines.push("Reeve \u00b7 " + (G.daily ? pretty(G.date) : "free board"));
    for (var r = 0; r < 5; r++) {
      var row = "";
      for (var c = 0; c < 5; c++) row += EM[G.flags[r * 5 + c]] || EM[0];
      lines.push(row);
    }
    var s = slips();
    lines.push("Settled in " + clock(G.elapsed) + " \u00b7 " + B.hard + (B.hard === 1 ? " knot" : " knots") +
               " \u00b7 " + (s ? s + (s === 1 ? " slip" : " slips") : "clean"));
    if (G.daily && stats.streak > 1) lines.push("Streak " + stats.streak);
    var url = C2.link(G.daily ? "" : "b=" + B.seed.toString(36));
    lines.push(G.daily ? "Today\u2019s manor is the same for everyone." : "Same board, your turn:");
    if (url) lines.push(url);
    C2.share(lines);
  }

  /* ── wiring ────────────────────────────────────────── */
  $("mPaid").addEventListener("click", function () { mark(0); });
  $("mOwe").addEventListener("click", function () { mark(1); });
  $("hint").addEventListener("click", nudge);
  $("fresh").addEventListener("click", function () { C2.write("free", null); loadFree((Math.random() * 4294967296) >>> 0); });
  $("share").addEventListener("click", share);
  Array.prototype.forEach.call(document.querySelectorAll(".seg button"), function (b) {
    b.addEventListener("click", function () {
      if (b.dataset.mode === mode) return;
      stopClock(); save();
      if (b.dataset.mode === "daily") loadDaily(); else loadFree();
    });
  });
  document.addEventListener("keydown", function (e) {
    if (!G || rules.isOpen()) return;
    var d = { ArrowUp: -5, ArrowDown: 5, ArrowLeft: -1, ArrowRight: 1 }[e.key];
    if (d !== undefined) {
      e.preventDefault();
      var at = sel >= 0 ? sel : (scope >= 0 ? scope : 12), to = at + d;
      if ((d === 1 && at % 5 === 4) || (d === -1 && at % 5 === 0) || to < 0 || to >= R_S) return;
      sel = to; scope = -1; paint(); cells[to].focus();
      return;
    }
    var k = e.key.toLowerCase();
    if (k === "p") mark(0); else if (k === "o") mark(1);
  });
  document.addEventListener("visibilitychange", function () { if (document.hidden && G) stopClock(); });

  function boot(o) {
    var f = (o && typeof o.frag === "string") ? o.frag : C2.frag();
    var m = /(?:^|\/)b=([0-9a-z]+)$/.exec(f || "");
    if (booted && !m) return;
    booted = true;
    if (m) { loadFree(parseInt(m[1], 36) >>> 0); if (o) toast("Someone sent you this board. Same plots, same clues."); }
    else loadDaily();
  }
  C2.register({
    slug: SLUG, numeral: "VII", name: "Reeve",
    line: "Prove every plot paid or owing. No guessing.",
    mark: '<rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 12h16M12 4v16"/>',
    daily: true,
    mount: boot,
    suspend: function () { if (G) stopClock(); }
  });
  /* after register: the shim keys storage by slug */
  var rules = vkRules(C2);
  if (!embedded) boot(null);
  else setTimeout(function () { if (!booted) boot(null); }, 900);
})();
<\/script>
</body>
</html>
</script>
<script type="text/plain" id="vol-shunt"><!DOCTYPE html>
<html lang="en-GB" data-theme="day">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Shunt</title>
<style>
/* ==================================================================
   SHUNT — tap a wagon end and it runs until it hits something.
   §1  CANONICAL TOKEN BLOCK. Do not author local overrides.
   ================================================================== */
:root {
  --serif: "Didot", "Bodoni MT", "Playfair Display", Georgia, "Times New Roman", serif;
  --body: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --util: ui-monospace, "SF Mono", "Cascadia Mono", "Roboto Mono", Menlo, monospace;
  --tap: 52px;
  --gutter: 20px;
  --radius: 10px;
  --radius-pill: 999px;
  --radius-plate: 18px;
}
html[data-theme="day"] {
  --ground:#EFE8F8; --plate:#F8F4FD; --well:#E5DBF3;
  --ink:#241041; --ink-2:#6B5590; --hair:#7E64AC;
  --accent:#4A1D7A; --on-accent:#FFF8E9; --chip:#3A1A66; --gilt:#8E6110;
  --pip-hi:#8A72B4; --pip-lo:#180830; --pip-glow:rgba(255,255,255,.6);
  --field:
    radial-gradient(120% 90% at 50% -10%, #F5E8FF 0%, rgba(245,232,255,0) 60%),
    radial-gradient(90% 70% at 100% 110%, #FFEAD6 0%, rgba(255,234,214,0) 55%),
    linear-gradient(180deg,#F2EBFA 0%,#E7DEF3 100%);
  --h1-fill: linear-gradient(180deg,#2E1350,#7A3A9E 92%);
  --wash: rgba(74,29,122,.10); --veil: rgba(36,16,65,.55);
  --face:#FFFFFF;
  --face-ink:#180830;
  --sink: inset 1px 1px 3px rgba(36,16,65,.18), inset -1px -1px 1px rgba(255,255,255,.85);
  --raise: 0 1px 0 rgba(255,255,255,.7), 0 4px 14px rgba(36,16,65,.10);
  --ok-shadow: inset 1px 1px 3px rgba(36,16,65,.18), 0 0 18px -3px rgba(74,29,122,.50);
  --w-body:400; --w-disp:500;
}
html[data-theme="glare"] {
  --ground:#FFFFFF; --plate:#FFFFFF; --well:#FFFFFF;
  --ink:#000000; --ink-2:#000000; --hair:#000000;
  --accent:#000000; --on-accent:#FFFFFF; --chip:#000000; --gilt:#000000;
  --pip-hi:#000000; --pip-lo:#000000; --pip-glow:transparent;
  --field:#FFFFFF;
  --h1-fill: none;
  --wash: transparent; --veil: rgba(0,0,0,.65);
  --face:#FFFFFF;
  --face-ink:#000000;
  --sink: none; --raise: none; --ok-shadow: none;
  --w-body:600; --w-disp:700;
}
html[data-theme="night"] {
  --ground:#12071F; --plate:#241041; --well:#1B0A35;
  --ink:#F6F1FF; --ink-2:#B49BD8; --hair:rgba(240,195,92,.55);
  --accent:#F0C35C; --on-accent:#22093C; --chip:#F0C35C; --gilt:#F0C35C;
  --pip-hi:#FFF0C4; --pip-lo:#A76F14; --pip-glow:rgba(255,255,255,.10);
  --field:
    radial-gradient(120% 90% at 50% -10%, #4A1D7A 0%, rgba(74,29,122,0) 60%),
    radial-gradient(90% 70% at 100% 110%, #7A1D5E 0%, rgba(122,29,94,0) 55%),
    linear-gradient(180deg,#1B0B33 0%,#12071F 100%);
  --h1-fill: linear-gradient(180deg,#FFF8E9,#E7A9D8 90%);
  --wash: rgba(240,195,92,.13); --veil: rgba(18,7,32,.78);
  --face:#F2ECFF;
  --face-ink:#1B0A35;
  --sink: inset 1px 1px 3px rgba(0,0,0,.55), inset -1px -1px 1px rgba(255,255,255,.06);
  --raise: inset 0 1px 0 rgba(255,255,255,.10), 0 6px 20px rgba(0,0,0,.45);
  --ok-shadow: inset 1px 1px 3px rgba(0,0,0,.55), 0 0 22px -3px rgba(240,195,92,.60);
  --w-body:350; --w-disp:400;
}

/* §2  volume-local geometry only — no colour authored below this line */
:root{ --ease: cubic-bezier(.16,1,.3,1); }
[hidden]{display:none !important}
*{box-sizing:border-box}
html,body{height:100%; margin:0}
body{
  background:var(--ground); color:var(--ink);
  background-image:var(--field); background-attachment:fixed;
  font-family:var(--body); font-weight:var(--w-body);
  font-size:16px; line-height:1.45;
  -webkit-text-size-adjust:100%; -webkit-tap-highlight-color:transparent;
  overflow:hidden; overscroll-behavior:none;
}
.app{
  height:100vh; height:100dvh; max-width:520px; margin:0 auto;
  display:flex; flex-direction:column;
  padding:calc(env(safe-area-inset-top) + 4px) var(--gutter) 0;
}
/* ---------- counters ---------- */
.counters{flex:0 0 auto; display:flex; gap:7px; padding-bottom:12px}
.counter{
  flex:1; min-width:0; padding:8px 4px 9px; border-radius:var(--radius);
  background:var(--well); border:1px solid var(--hair); box-shadow:var(--sink);
  text-align:center;
}
.counter b{
  display:block; font-family:var(--util); font-size:1rem; font-weight:600;
  font-variant-numeric:tabular-nums; letter-spacing:-.03em; color:var(--ink);
  white-space:nowrap; overflow:hidden;
}
.counter span{display:block; font-size:.62rem; color:var(--ink-2); letter-spacing:.04em}
.counter.hot b{color:var(--gilt)}
/* ---------- the plate ---------- */
.plate{
  flex:0 0 auto; position:relative; padding:14px; margin-bottom:12px;
  background:var(--plate); border:1px solid var(--hair);
  border-radius:var(--radius-plate); box-shadow:var(--raise);
}
.boardwrap{
  position:relative; user-select:none; -webkit-user-select:none;
  container-type:inline-size;
  /* the board is square, so capping its width caps its height. --chrome is
     everything stacked above and below it in the current layout. */
  --chrome:330px;
  width:100%;
  width:max(200px, min(100%, calc(100vh - var(--chrome))));
  width:max(200px, min(100%, calc(100dvh - var(--chrome))));
  margin-inline:auto;
}
button:focus-visible{outline:2px solid var(--gilt); outline-offset:3px}
button:focus:not(:focus-visible){outline:none}
/* ---------- readout ---------- */
.read{
  min-height:3.2em; margin:12px 0 2px; text-align:center;
  font-size:.86rem; color:var(--ink-2);
}
.read b{
  display:inline-block; font-family:var(--serif); font-weight:var(--w-disp);
  font-size:1.4rem; letter-spacing:.02em; color:var(--ink); margin-right:.35em;
}
html[data-display="fallback"] .read b{font-weight:700}
.read .sub{display:block; font-size:.82rem}
/* ---------- pills ---------- */
.controls{display:flex; gap:9px; padding-top:10px}
.btn{
  flex:1; min-height:var(--tap); font:inherit; font-size:.9rem; cursor:pointer;
  padding:0 8px; border-radius:var(--radius-pill);
  background:var(--plate); color:var(--ink-2);
  border:1px solid var(--hair); box-shadow:var(--raise);
  transition:transform .12s ease, color .2s, border-color .2s;
}
.btn:hover{color:var(--ink); border-color:var(--gilt)}
.btn:active{transform:translateY(1.5px)}
.btn[disabled]{opacity:.4; cursor:default}
.btn.go{font-weight:600; background:var(--accent); border-color:var(--accent); color:var(--on-accent)}
html[data-theme="glare"] .btn.go{border-width:3px}
/* ---------- strip ---------- */
.strip{
  flex:1 1 auto; min-height:0; overflow-y:auto; overscroll-behavior:contain;
  padding:6px 0 14px; scrollbar-width:thin;
}
.strip::-webkit-scrollbar{width:3px}
.strip::-webkit-scrollbar-thumb{background:var(--hair); border-radius:3px}
.strip-head{display:flex; align-items:center; gap:8px; padding-bottom:10px}
.strip-head p{margin:0; flex:1; min-width:0; font-size:.8rem; color:var(--ink-2)}
.strip-head p strong{color:var(--ink)}
.chip{
  flex:0 0 auto; font:inherit; font-size:.76rem; padding:9px 13px; cursor:pointer;
  border-radius:var(--radius-pill); white-space:nowrap;
  background:var(--plate); color:var(--gilt);
  border:1px solid var(--hair); box-shadow:var(--raise);
}
.chip:hover{border-color:var(--gilt)}
.chip[disabled]{opacity:.4; cursor:default}
.rows{display:flex; flex-direction:column; gap:7px}
.row{
  display:flex; align-items:baseline; gap:10px; padding:9px 12px;
  border-radius:var(--radius); background:var(--well);
  border:1px solid var(--hair); box-shadow:var(--sink);
  font-size:.8rem; color:var(--ink-2);
}
.row b{font-family:var(--util); font-size:.9rem; color:var(--ink); font-variant-numeric:tabular-nums}
.row .grow{flex:1}
.row.crown{border-color:var(--gilt)}
.row.crown b{color:var(--gilt)}
/* ---------- footer ---------- */
footer{
  flex:0 0 auto; display:flex; gap:9px; align-items:center;
  padding:11px 0 calc(env(safe-area-inset-bottom) + 12px);
  border-top:1px solid var(--hair);
}
.seg{
  flex:1; display:flex; gap:5px; padding:4px; border-radius:var(--radius-pill);
  background:var(--well); border:1px solid var(--hair); box-shadow:var(--sink);
}
.seg button{
  flex:1; font:inherit; font-size:.8rem; min-height:40px; padding:0 2px; cursor:pointer;
  border:0; border-radius:var(--radius-pill); background:none; color:var(--ink-2);
  transition:background .3s var(--ease), color .3s var(--ease);
}
.seg button[aria-pressed="true"]{background:var(--accent); color:var(--on-accent); font-weight:600}
.wa{
  flex:0 0 auto; min-height:var(--tap); padding:0 15px; cursor:pointer;
  display:flex; align-items:center; gap:8px;
  font:inherit; font-size:.82rem; border-radius:var(--radius-pill);
  background:var(--plate); color:var(--gilt);
  border:1px solid var(--hair); box-shadow:var(--raise);
}
.wa svg{width:17px; height:17px; fill:none; stroke:currentColor;
  stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round}
.wa[disabled]{opacity:.4; cursor:default}
/* ---------- toast ---------- */
.toast{
  position:fixed; left:50%; z-index:60;
  bottom:calc(env(safe-area-inset-bottom) + 84px);
  transform:translate(-50%,16px) scale(.97);
  max-width:84vw; padding:12px 18px; text-align:center;
  border-radius:var(--radius-plate);
  background:var(--plate); color:var(--ink);
  border:1px solid var(--hair); box-shadow:var(--raise);
  font-size:.84rem; opacity:0; pointer-events:none;
  transition:opacity .3s var(--ease), transform .42s var(--ease);
}
.toast b{font-family:var(--serif); font-weight:var(--w-disp); color:var(--gilt)}
.toast.up{opacity:1; transform:translate(-50%,0) scale(1)}
.sr-only{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:.01ms !important; animation-iteration-count:1 !important;
    transition-duration:.01ms !important}
}

/* ---------- rules sheet ----------
   Rules live in a sheet over the board, not in the scrolling strip, so they
   can always be read in full: bottom sheet on a phone, centred card on a
   tablet or computer. Opens itself the first time a volume is played. */
.rulesbtn{display:inline-flex; align-items:center; gap:6px}
.rulesbtn svg{width:15px; height:15px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round}
.rules{
  position:fixed; inset:0; z-index:80; display:flex; align-items:flex-end; justify-content:center;
  background:var(--veil);
}
.rules-card{
  width:100%; max-width:640px; max-height:92vh; max-height:92dvh; overflow-y:auto; overscroll-behavior:contain;
  background:var(--plate); color:var(--ink); border:1px solid var(--hair); box-shadow:var(--raise);
  border-radius:var(--radius-plate) var(--radius-plate) 0 0;
  padding:22px var(--gutter) calc(env(safe-area-inset-bottom) + 18px);
  animation:rise .32s var(--ease);
}
@keyframes rise{from{transform:translateY(40px); opacity:0} to{transform:none; opacity:1}}
.rules-card h2{
  margin:0 0 4px; font-family:var(--serif); font-weight:var(--w-disp); font-size:1.6rem; line-height:1.15;
}
.rules-card .lede{margin:0 0 16px; color:var(--ink-2); font-size:1rem}
.rules-body{font-size:1.02rem; line-height:1.6}

.rules-body ol{margin:0 0 14px; padding-left:1.3em}

.rules-body b{font-weight:700}
.rules-body .key{display:grid; grid-template-columns:52px 1fr; gap:10px 14px; align-items:center; margin:6px 0 16px}
.rules-body .key > span{font-size:.98rem}
.rules-card .btn{width:100%; margin-top:8px}
html[data-theme="glare"] .rules-body, html[data-theme="glare"] .rules-card .lede{font-weight:600}

/* ---------- layouts ----------
   Phone portrait: one column, board as large as the height allows.
   Tablet portrait: one wider column, larger type.
   Landscape tablet and computer: board on the left, everything else beside it. */
@media (min-width:700px) and (orientation:portrait){
  html{font-size:17px}
  .app{max-width:680px}
  .boardwrap{--chrome:380px}
  .counter b{font-size:1.15rem}
  .counter span{font-size:.7rem}
}
@media (min-width:700px) and (orientation:landscape), (min-width:1000px){
  html{font-size:17px}
  .app{
    max-width:1180px; display:grid; column-gap:28px;
    grid-template-columns:minmax(0,1fr) minmax(300px,380px);
    grid-template-rows:auto minmax(0,1fr) auto;
    padding-top:calc(env(safe-area-inset-top) + 14px);
  }
  .plate{grid-column:1; grid-row:1 / 4; align-self:start; justify-self:center; width:100%;
    max-width:min(760px, calc(100vh - 200px)); max-width:min(760px, calc(100dvh - 200px))}
  .boardwrap{--chrome:230px}
  .counters{grid-column:2; grid-row:1}
  .strip{grid-column:2; grid-row:2}
  footer{grid-column:2; grid-row:3}
  .counter b{font-size:1.15rem}
  .counter span{font-size:.7rem}
  .toast{bottom:36px}
  .rules{align-items:center; padding:24px}
  .rules-card{border-radius:var(--radius-plate); padding-bottom:22px}
}
/* a squat window: trim the chrome so the board keeps its size */
@media (max-height:640px) and (orientation:portrait){
  :root{--tap:44px}
  .counters{padding-bottom:6px}
  .counter{padding:5px 4px 6px}
  .read{min-height:2.4em; margin:8px 0 0}
  .read b{font-size:1.15rem}
  .plate{padding:10px}
  .boardwrap{--chrome:280px}
}
@media (max-height:520px) and (orientation:landscape){
  .boardwrap{--chrome:170px}
  .read{min-height:2.2em; margin:6px 0 0}
  .plate{padding:10px}
}

/* ---------- the yard ---------- */
.boardwrap{padding-right:16px}
.yard{
  position:relative; width:100%; aspect-ratio:1; border-radius:var(--radius);
  background:var(--well); border:2px solid var(--hair); box-shadow:var(--sink);
  overflow:visible; touch-action:manipulation;
}
/* the sleepers: a faint 6x6 ruling so the tracks can be read */
.yard::before{
  content:""; position:absolute; inset:0; border-radius:inherit; pointer-events:none; opacity:.35;
  background-image:
    linear-gradient(to right, var(--hair) 1px, transparent 1px),
    linear-gradient(to bottom, var(--hair) 1px, transparent 1px);
  background-size:calc(100% / 6) calc(100% / 6);
}
/* the exit: a break in the right-hand fence at row three */
.exit{
  position:absolute; right:-18px; top:calc(100% / 6 * 2); height:calc(100% / 6);
  width:18px; display:grid; place-items:center; color:var(--gilt); pointer-events:none;
}
.exit::before{
  content:""; position:absolute; left:-2px; top:3px; bottom:3px; width:4px; background:var(--plate);
}
.exit svg{width:14px; height:14px; position:relative; fill:none; stroke:currentColor; stroke-width:2.4;
  stroke-linecap:round; stroke-linejoin:round}
.wagon{
  position:absolute; padding:3px; cursor:pointer; border:0; background:none; font:inherit;
  transition:left .2s var(--ease), top .2s var(--ease), opacity .3s;
}
.wagon .body{
  width:100%; height:100%; border-radius:8px; display:flex; align-items:center; justify-content:space-between;
  padding:0 5px; background:var(--face); color:var(--face-ink);
  border:1.5px solid var(--hair); box-shadow:var(--raise);
}
.wagon.v .body{flex-direction:column; padding:5px 0}
.wagon .chev{width:13px; height:13px; width:max(13px, 4cqw); height:max(13px, 4cqw); flex:0 0 auto; fill:none; stroke:currentColor; stroke-width:2.6;
  stroke-linecap:round; stroke-linejoin:round; opacity:.8}
.wagon .chev.off{opacity:.12}
.wagon.van .body{background:var(--accent); border-color:var(--accent); color:var(--on-accent)}
.wagon.van .lamp{width:9px; height:9px; width:max(9px, 2.4cqw); height:max(9px, 2.4cqw); border-radius:50%; background:currentColor; flex:0 0 auto}
html[data-theme="glare"] .wagon .body{border-width:2.5px}
.wagon.hintA .chev.a, .wagon.hintB .chev.b{opacity:1; color:var(--gilt); animation:nudge 1s var(--ease) 3}
.wagon.hintA .body, .wagon.hintB .body{border-color:var(--gilt); border-width:3px}
.wagon.van.hintA .chev.a, .wagon.van.hintB .chev.b{color:var(--on-accent)}
@keyframes nudge{0%,100%{transform:scale(1)} 50%{transform:scale(1.5)}}
.wagon.gone{opacity:0}
.wagon.bump .body{animation:bump .22s var(--ease)}
@keyframes bump{0%,100%{transform:none} 50%{transform:scale(.96)}}

<body>
<div class="app">
  <div class="counters">
    <div class="counter"><b id="cMoves">0</b><span>moves</span></div>
    <div class="counter"><b id="cPar">&ndash;</b><span>par</span></div>
    <div class="counter"><b id="cBest">&ndash;</b><span>best here</span></div>
    <div class="counter"><b id="cStreak">0</b><span>streak</span></div>
  </div>
  <section class="plate">
    <div class="boardwrap">
      <div class="yard" id="yard" aria-label="The yard, six by six">
        <div class="exit" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 12h13M13 6l6 6-6 6"/></svg></div>
      </div>
    </div>
    <p class="read" id="read" aria-live="polite"></p>
    <div class="controls">
      <button class="btn" id="undo">Undo</button>
      <button class="btn" id="reset">Reset</button>
      <button class="btn" id="hint">Hint</button>
    </div>
  </section>
  <section class="strip">
    <div class="strip-head">
      <p id="standing"></p>
      <button class="chip rulesbtn" id="rulesBtn"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.3a2.5 2.5 0 0 1 4.8.9c0 1.7-2.4 2.1-2.4 3.6M12 17h.01"/></svg>How to play</button>
      <button class="chip" id="fresh" hidden>New yard</button>
    </div>
    <div class="rows" id="rows"></div>
  </section>
  <footer>
    <div class="seg" role="group" aria-label="Which yard">
      <button data-mode="daily" aria-pressed="true">Today</button>
      <button data-mode="free" aria-pressed="false">Free</button>
    </div>
    <button class="wa" id="share" disabled>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 8.9 8.9 0 0 1-3.8-.8L3 20.5l1.4-4.1A8.4 8.4 0 0 1 12 3.1a8.4 8.4 0 0 1 9 8.4z"/><path d="M8.8 9.2c0 3 2.2 5.2 5.2 5.2"/></svg>
      WhatsApp
    </button>
  </footer>
</div>
<div class="rules" id="rules" role="dialog" aria-modal="true" aria-labelledby="rulesTitle" hidden>
  <div class="rules-card">
    <h2 id="rulesTitle">How to play Shunt</h2>
    <p class="lede">Tap a wagon end. It runs until it stops. Free the van.</p>
    <div class="rules-body">
      <p>Get the <b>brake van</b> (the filled wagon with a lamp) out through the gap in the right-hand fence.</p>
      <ol>
        <li>Each wagon runs along its own track only: across, or up and down. It can never turn.</li>
        <li><b>Tap the end of a wagon</b> you want it to move towards. It runs until it hits another wagon or the fence. It cannot stop part-way.</li>
        <li>An end with a faint arrow is blocked, so tapping it does nothing.</li>
        <li>When nothing stands between the van and the gap, tap the van&rsquo;s right end and it runs out. That tap counts as a move.</li>
      </ol>
      <p><b>Par</b> is the fewest taps that can possibly do it. Finish in par without a hint and you earn a star.</p>
      <p><b>Undo</b> and <b>Reset</b> are free. <b>Hint</b> lights up the next best end to tap, but costs the star. If the van can no longer be freed, the game tells you it is jammed.</p>
      <p>Monday is a short shunt. Sunday is a long one.</p>
    </div>
    <button class="btn go" id="rulesClose">Got it</button>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

var S_N = 6, S_ROW = 2;                    // 6x6 yard, exit on the right of row 2

/* Volume kit: the rules sheet. Shared by Reeve, Shunt, Furlong, Bight and

function vkRules(C2){

      close = document.getElementById("rulesClose"), last = null;
  function open(){
    last = document.activeElement;

(function () {
  "use strict";

  /* Par ranges by weekday, index 0 Sunday. Fitted to measured yield: a

  var embedded = (function () { try { return window.parent !== window; } catch (e) { return false; } })();
  var yard = $("yard"), els = [];
  var Y = null, G = null, mode = "daily", loadToken = 0, booted = false, busy = false, hintAt = null;
  var stats = C2.read("stats", null) || { plays: 0, atPar: 0, streak: 0, lastDaily: null };

  function today() {
    var d = new Date();

  }

    d.setDate(d.getDate() - 1);

  }
  function pretty(s) {
    var p = s.split("-"), d = new Date(+p[0], +p[1] - 1, +p[2]);

  }

  /* ── sound ─────────────────────────────────────────── */
  var AC = null;
  function note(f, dur, gain, type) {
    if (!C2.sound()) return;

  /* a run lands with a clunk pitched by its length: long runs land lower */

  var sndBack = function () { note(262, 0.05, 0.035); C2.haptic(4); };

    var fs = star ? [392, 523.25, 659.25, 783.99, 1046.5] : [392, 523.25, 659.25];
    fs.forEach(function (f, i) { setTimeout(function () { note(f, 0.28, 0.05, "sine"); }, i * 90); });
    C2.haptic([20, 60, 20, 60, 30]);
  };

  /* ── state ─────────────────────────────────────────── */
  function current() {
    var st = Y.st.slice();
    for (var i = 0; i < G.hist.length; i++) {
      var m = G.hist[i];
      if (m[0] === 0 && m[1] === 1 && sClear(Y.P, st)) break;   // the run out ends the game

    }
    return st;
  }
  function fresh(daily) {
    return { date: today(), daily: daily, seed: Y.seed, lo: Y.lo, hi: Y.hi, hist: [], done: false, hints: 0, best: 0 };
  }

  /* ── generation ────────────────────────────────────── */
  function generate(seed, lo, hi, done) {
    var token = ++loadToken, rng = rngFrom(seed), tries = 0, a = lo, z = hi;
    function slice() {
      if (token !== loadToken) return;
      var t0 = Date.now();
      while (Date.now() - t0 < 30) {
        tries++;
        var c = sCandidate(rng, a, z);
        if (c) { c.seed = seed; c.lo = lo; c.hi = hi; return done(c); }
        if (tries === CAP) { rng = rngFrom(seed); a = 3; z = 99; }
      }
      read("&hellip;", "Marshalling the yard. " + tries + " layouts tried.");
      setTimeout(slice, 0);
    }
    read("&hellip;", "Marshalling the yard.");
    slice();
  }

  /* ── drawing ───────────────────────────────────────── */
  var CH = { l: '<path d="M15 5l-7 7 7 7"/>', r: '<path d="M9 5l7 7-7 7"/>',
             u: '<path d="M5 15l7-7 7 7"/>', d: '<path d="M5 9l7 7 7-7"/>' };
  function chev(dir, cls) { return '<svg class="chev ' + cls + '" viewBox="0 0 24 24" aria-hidden="true">' + CH[dir] + "</svg>"; }
  function build() {
    Array.prototype.slice.call(yard.querySelectorAll(".wagon")).forEach(function (n) { n.remove(); });
    els = Y.P.map(function (q, p) {
      var b = document.createElement("button");
      b.type = "button";
      b.className = "wagon " + (q.h ? "h" : "v") + (p === 0 ? " van" : "");
      var u = 100 / S_N;
      if (q.h) { b.style.width = q.len * u + "%"; b.style.height = u + "%"; b.style.top = q.fix * u + "%"; }
      else { b.style.height = q.len * u + "%"; b.style.width = u + "%"; b.style.left = q.fix * u + "%"; }
      b.innerHTML = '<span class="body">' + chev(q.h ? "l" : "u", "a") +
                    (p === 0 ? '<span class="lamp"></span>' : "") + chev(q.h ? "r" : "d", "b") + "</span>";

        var r = b.getBoundingClientRect(), dir;
        if (e.detail === 0) dir = 1;                       // keyboard: Enter runs forward, Shift+Enter back

      var b = els[p];
      if (q.h) b.style.left = st[p] * u + "%"; else b.style.top = st[p] * u + "%";
      var back = sDest(Y.P, st, g, p, -1) !== st[p];
      var fwd = sDest(Y.P, st, g, p, 1) !== st[p] || (p === 0 && sClear(Y.P, st));

      b.querySelector(".chev.b").classList.toggle("off", !fwd);

    $("cPar").textContent = String(Y.par);

      : "Free yard <strong>" + Y.seed.toString(36) + "</strong>";

    place(now); counters(); save();
    if (!sSolve(Y.P, now)) read("Jammed.", "Nothing can free the van from here. Undo or reset.");

  }

    els[0].classList.add("gone");
    var first = !G.best;
    if (!G.best || n < G.best || (n === G.best && G.bestHints && !G.hints)) { G.best = n; G.bestHints = G.hints; }

    $("reset").textContent = "Run again";
  }

    if (!G) return;

  }

  $("reset").addEventListener("click", reset);

    b.addEventListener("click", function () {

  function boot(o) {
    var f = (o && typeof o.frag === "string") ? o.frag : C2.frag();

    slug: SLUG, numeral: "VIII", name: "Shunt",
    line: "Tap a wagon end. It runs until it stops. Free the van.",
    mark: '<rect x="3" y="9" width="10" height="6" rx="1.5"/><path d="M16 12h5M18 9l3 3-3 3"/>',
    daily: true,

})();

}
.counter b{
  display:block; font-family:var(--util); font-size:1rem; font-weight:600;
  font-variant-numeric:tabular-nums; letter-spacing:-.03em; color:var(--ink);
  white-space:nowrap; overflow:hidden;
}
.counter span{display:block; font-size:.62rem; color:var(--ink-2); letter-spacing:.04em}
.counter.hot b{color:var(--gilt)}
/* ---------- the plate ---------- */
.plate{
  flex:0 0 auto; position:relative; padding:14px; margin-bottom:12px;
  background:var(--plate); border:1px solid var(--hair);
  border-radius:var(--radius-plate); box-shadow:var(--raise);
}
.boardwrap{
  position:relative; user-select:none; -webkit-user-select:none;
  container-type:inline-size;
  /* the board is square, so capping its width caps its height. --chrome is
     everything stacked above and below it in the current layout. */
  --chrome:330px;
  width:100%;
  width:max(200px, min(100%, calc(100vh - var(--chrome))));
  width:max(200px, min(100%, calc(100dvh - var(--chrome))));
  margin-inline:auto;
}
button:focus-visible{outline:2px solid var(--gilt); outline-offset:3px}
button:focus:not(:focus-visible){outline:none}
/* ---------- readout ---------- */
.read{
  min-height:3.2em; margin:12px 0 2px; text-align:center;
  font-size:.86rem; color:var(--ink-2);
}
.read b{
  display:inline-block; font-family:var(--serif); font-weight:var(--w-disp);
  font-size:1.4rem; letter-spacing:.02em; color:var(--ink); margin-right:.35em;
}
html[data-display="fallback"] .read b{font-weight:700}
.read .sub{display:block; font-size:.82rem}
/* ---------- pills ---------- */
.controls{display:flex; gap:9px; padding-top:10px}
.btn{
  flex:1; min-height:var(--tap); font:inherit; font-size:.9rem; cursor:pointer;
  padding:0 8px; border-radius:var(--radius-pill);
  background:var(--plate); color:var(--ink-2);
  border:1px solid var(--hair); box-shadow:var(--raise);
  transition:transform .12s ease, color .2s, border-color .2s;
}
.btn:hover{color:var(--ink); border-color:var(--gilt)}
.btn:active{transform:translateY(1.5px)}
.btn[disabled]{opacity:.4; cursor:default}
.btn.go{font-weight:600; background:var(--accent); border-color:var(--accent); color:var(--on-accent)}
html[data-theme="glare"] .btn.go{border-width:3px}
/* ---------- strip ---------- */
.strip{
  flex:1 1 auto; min-height:0; overflow-y:auto; overscroll-behavior:contain;
  padding:6px 0 14px; scrollbar-width:thin;
}
.strip::-webkit-scrollbar{width:3px}
.strip::-webkit-scrollbar-thumb{background:var(--hair); border-radius:3px}
.strip-head{display:flex; align-items:center; gap:8px; padding-bottom:10px}
.strip-head p{margin:0; flex:1; min-width:0; font-size:.8rem; color:var(--ink-2)}
.strip-head p strong{color:var(--ink)}
.chip{
  flex:0 0 auto; font:inherit; font-size:.76rem; padding:9px 13px; cursor:pointer;
  border-radius:var(--radius-pill); white-space:nowrap;
  background:var(--plate); color:var(--gilt);
  border:1px solid var(--hair); box-shadow:var(--raise);
}
.chip:hover{border-color:var(--gilt)}
.chip[disabled]{opacity:.4; cursor:default}
.rows{display:flex; flex-direction:column; gap:7px}
.row{
  display:flex; align-items:baseline; gap:10px; padding:9px 12px;
  border-radius:var(--radius); background:var(--well);
  border:1px solid var(--hair); box-shadow:var(--sink);
  font-size:.8rem; color:var(--ink-2);
}
.row b{font-family:var(--util); font-size:.9rem; color:var(--ink); font-variant-numeric:tabular-nums}
.row .grow{flex:1}
.row.crown{border-color:var(--gilt)}
.row.crown b{color:var(--gilt)}
/* ---------- footer ---------- */
footer{
  flex:0 0 auto; display:flex; gap:9px; align-items:center;
  padding:11px 0 calc(env(safe-area-inset-bottom) + 12px);
  border-top:1px solid var(--hair);
}
.seg{
  flex:1; display:flex; gap:5px; padding:4px; border-radius:var(--radius-pill);
  background:var(--well); border:1px solid var(--hair); box-shadow:var(--sink);
}
.seg button{
  flex:1; font:inherit; font-size:.8rem; min-height:40px; padding:0 2px; cursor:pointer;
  border:0; border-radius:var(--radius-pill); background:none; color:var(--ink-2);
  transition:background .3s var(--ease), color .3s var(--ease);
}
.seg button[aria-pressed="true"]{background:var(--accent); color:var(--on-accent); font-weight:600}
.wa{
  flex:0 0 auto; min-height:var(--tap); padding:0 15px; cursor:pointer;
  display:flex; align-items:center; gap:8px;
  font:inherit; font-size:.82rem; border-radius:var(--radius-pill);
  background:var(--plate); color:var(--gilt);
  border:1px solid var(--hair); box-shadow:var(--raise);
}
.wa svg{width:17px; height:17px; fill:none; stroke:currentColor;
  stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round}
.wa[disabled]{opacity:.4; cursor:default}
/* ---------- toast ---------- */
.toast{
  position:fixed; left:50%; z-index:60;
  bottom:calc(env(safe-area-inset-bottom) + 84px);
  transform:translate(-50%,16px) scale(.97);
  max-width:84vw; padding:12px 18px; text-align:center;
  border-radius:var(--radius-plate);
  background:var(--plate); color:var(--ink);
  border:1px solid var(--hair); box-shadow:var(--raise);
  font-size:.84rem; opacity:0; pointer-events:none;
  transition:opacity .3s var(--ease), transform .42s var(--ease);
}
.toast b{font-family:var(--serif); font-weight:var(--w-disp); color:var(--gilt)}
.toast.up{opacity:1; transform:translate(-50%,0) scale(1)}
.sr-only{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:.01ms !important; animation-iteration-count:1 !important;
    transition-duration:.01ms !important}
}

/* ---------- rules sheet ----------
   Rules live in a sheet over the board, not in the scrolling strip, so they
   can always be read in full: bottom sheet on a phone, centred card on a
   tablet or computer. Opens itself the first time a volume is played. */
.rulesbtn{display:inline-flex; align-items:center; gap:6px}
.rulesbtn svg{width:15px; height:15px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round}
.rules{
  position:fixed; inset:0; z-index:80; display:flex; align-items:flex-end; justify-content:center;
  background:var(--veil);
}
.rules-card{
  width:100%; max-width:640px; max-height:92vh; max-height:92dvh; overflow-y:auto; overscroll-behavior:contain;
  background:var(--plate); color:var(--ink); border:1px solid var(--hair); box-shadow:var(--raise);
  border-radius:var(--radius-plate) var(--radius-plate) 0 0;
  padding:22px var(--gutter) calc(env(safe-area-inset-bottom) + 18px);
  animation:rise .32s var(--ease);
}
@keyframes rise{from{transform:translateY(40px); opacity:0} to{transform:none; opacity:1}}
.rules-card h2{
  margin:0 0 4px; font-family:var(--serif); font-weight:var(--w-disp); font-size:1.6rem; line-height:1.15;
}
.rules-card .lede{margin:0 0 16px; color:var(--ink-2); font-size:1rem}
.rules-body{font-size:1.02rem; line-height:1.6}
.rules-body p{margin:0 0 12px}
.rules-body ol{margin:0 0 14px; padding-left:1.3em}
.rules-body li{margin-bottom:8px}
.rules-body b{font-weight:700}
.rules-body .key{display:grid; grid-template-columns:52px 1fr; gap:10px 14px; align-items:center; margin:6px 0 16px}
.rules-body .key > span{font-size:.98rem}
.rules-card .btn{width:100%; margin-top:8px}
html[data-theme="glare"] .rules-body, html[data-theme="glare"] .rules-card .lede{font-weight:600}

/* ---------- layouts ----------
   Phone portrait: one column, board as large as the height allows.
   Tablet portrait: one wider column, larger type.
   Landscape tablet and computer: board on the left, everything else beside it. */
@media (min-width:700px) and (orientation:portrait){
  html{font-size:17px}
  .app{max-width:680px}
  .boardwrap{--chrome:380px}
  .counter b{font-size:1.15rem}
  .counter span{font-size:.7rem}
}
@media (min-width:700px) and (orientation:landscape), (min-width:1000px){
  html{font-size:17px}
  .app{
    max-width:1180px; display:grid; column-gap:28px;
    grid-template-columns:minmax(0,1fr) minmax(300px,380px);
    grid-template-rows:auto minmax(0,1fr) auto;
    padding-top:calc(env(safe-area-inset-top) + 14px);
  }
  .plate{grid-column:1; grid-row:1 / 4; align-self:start; justify-self:center; width:100%;
    max-width:min(760px, calc(100vh - 200px)); max-width:min(760px, calc(100dvh - 200px))}
  .boardwrap{--chrome:230px}
  .counters{grid-column:2; grid-row:1}
  .strip{grid-column:2; grid-row:2}
  footer{grid-column:2; grid-row:3}
  .counter b{font-size:1.15rem}
  .counter span{font-size:.7rem}
  .toast{bottom:36px}
  .rules{align-items:center; padding:24px}
  .rules-card{border-radius:var(--radius-plate); padding-bottom:22px}
}
/* a squat window: trim the chrome so the board keeps its size */
@media (max-height:640px) and (orientation:portrait){
  :root{--tap:44px}
  .counters{padding-bottom:6px}
  .counter{padding:5px 4px 6px}
  .read{min-height:2.4em; margin:8px 0 0}
  .read b{font-size:1.15rem}
  .plate{padding:10px}
  .boardwrap{--chrome:280px}
}
@media (max-height:520px) and (orientation:landscape){
  .boardwrap{--chrome:170px}
  .read{min-height:2.2em; margin:6px 0 0}
  .plate{padding:10px}
}


/* ---------- the field: three stacked grids share one geometry ---------- */
.field{position:relative; width:100%; aspect-ratio:1; touch-action:none}
.field > .layer{position:absolute; inset:0; display:grid; gap:3px}
.plot{border-radius:5px; background:var(--well); border:1px solid var(--hair); box-shadow:var(--sink)}
.strip-r{border-radius:7px; margin:1px; pointer-events:none; position:relative}
.strip-r.ok{background:var(--face); border:2px solid var(--accent); box-shadow:var(--raise)}
.strip-r.ok.alt{background:var(--plate)}
.strip-r.bad{background:var(--wash); border:2px dashed var(--ink-2)}
.strip-r.hinted::after{content:""; position:absolute; inset:4px; border:1.5px dotted var(--gilt); border-radius:5px}
.strip-r.ghost{background:var(--wash); border:2.5px solid var(--gilt); display:grid; place-items:center; z-index:3}
.strip-r.ghost em{font-style:normal; font-family:var(--util); font-weight:700; font-size:max(.75rem, 3.6cqw);
  color:var(--ink); background:var(--plate); padding:2px 7px; border-radius:6px; border:1px solid var(--hair)}
.spot{background:none; border:0; padding:0; margin:0; display:grid; place-items:center; color:var(--ink); cursor:pointer; position:relative; z-index:2}
.spot span{font-family:var(--serif); font-weight:var(--w-disp); line-height:1;
  font-size:clamp(1rem, 5vw, 1.6rem); font-size:clamp(1rem, calc(52cqw / var(--n)), 3rem)}
html[data-display="fallback"] .spot span{font-weight:700}
.spot.anchor::before{content:""; position:absolute; inset:2px; border-radius:6px; border:3px solid var(--gilt); background:var(--wash)}
.spot.anchor span{position:relative}
.controls .btn{flex:1}
.rules-body .demo{display:grid; grid-template-columns:repeat(4,1fr); gap:3px; width:150px; aspect-ratio:2; margin:4px 0 14px}

</style>
</head>
<body>
<div class="app">
  <div class="counters">
    <div class="counter" id="cCoverBox"><b id="cCover">0%</b><span>fenced</span></div>
    <div class="counter" id="cTimeBox"><b id="cTime">0:00</b><span>time</span></div>
    <div class="counter" id="cHintBox"><b id="cHint">0</b><span>hints</span></div>
    <div class="counter" id="cSizeBox"><b id="cSize">&ndash;</b><span>field</span></div>
  </div>
  <section class="plate" id="plate">
    <div class="boardwrap">
      <div class="field" id="field" aria-label="The field">
        <div class="layer" id="base" aria-hidden="true"></div>
        <div class="layer" id="lay" aria-hidden="true"></div>
        <div class="layer" id="top"></div>
      </div>
    </div>
    <p class="read" id="read" aria-live="polite"></p>
    <div class="controls">
      <button class="btn" id="clear">Clear</button>
      <button class="btn" id="hint">Hint</button>
    </div>
  </section>
  <section class="strip">
    <div class="strip-head">
      <p id="standing"></p>
      <button class="chip rulesbtn" id="rulesBtn"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.3a2.5 2.5 0 0 1 4.8.9c0 1.7-2.4 2.1-2.4 3.6M12 17h.01"/></svg>How to play</button>
      <button class="chip" id="fresh" hidden>New field</button>
    </div>
    <div class="rows" id="rows"></div>
  </section>
  <footer>
    <div class="seg" role="group" aria-label="Which board">
      <button data-mode="daily" aria-pressed="true">Today</button>
      <button data-mode="free" aria-pressed="false">Free</button>
    </div>
    <button class="wa" id="share" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 8.9 8.9 0 0 1-3.8-.8L3 20.5l1.4-4.1A8.4 8.4 0 0 1 12 3.1a8.4 8.4 0 0 1 9 8.4z"/><path d="M8.8 9.2c0 3 2.2 5.2 5.2 5.2"/></svg> WhatsApp</button>
  </footer>
</div>
<div class="rules" id="rules" role="dialog" aria-modal="true" aria-labelledby="rulesTitle" hidden>
  <div class="rules-card">
    <h2 id="rulesTitle">How to play Furlong</h2>
    <p class="lede">Fence the field into strips. Each number is its strip&rsquo;s size.</p>
    <div class="rules-body">
      <p>Split the whole field into rectangular <b>strips</b>.</p>
      <ol>
        <li>Every strip must hold <b>exactly one number</b>.</li>
        <li>That number is the strip&rsquo;s <b>size</b>: how many squares it covers. A 6 could be 2 by 3, 3 by 2, 1 by 6 or 6 by 1.</li>
        <li>Strips cover every square and never overlap.</li>
      </ol>
      <p><b>To lay a strip</b>, drag from one corner to the opposite corner. Or tap one corner, then tap the other. The size shows while you drag.</p>
      <p><b>To lift a strip</b>, tap it. Laying a strip over others replaces them.</p>
      <p>A strip that breaks a rule is drawn dashed. When every strip is solid and the field is full, you have it. There is only one answer, and it can always be found by reasoning.</p>
      <p>The field grows through the week: 6 by 6 early on, 8 by 8 at the weekend. <b>Hint</b> lays one correct strip for you.</p>
    </div>
    <button class="btn go" id="rulesClose">Got it</button>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
"use strict";
window.C2 = (function () {
  "use strict";
  var slug = null, listeners = [];
  var set = { mode: "auto", sound: true, haptic: true };
  /* An srcdoc iframe has no URL of its own, so a volume cannot read or write
     a share fragment directly. The shell owns the address bar and passes the
     fragment down; the volume asks for it, and asks for it to be updated. */
  var ctx = { base: "", frag: "" };
  var embedded = (function () { try { return window.parent !== window; } catch (e) { return false; } })();

  function resolve(m) {
    if (m && m !== "auto") return m;

    } catch (e) { return "day"; }
  }
  function apply(s) {
    if (s) { for (var k in s) if (s.hasOwnProperty(k)) set[k] = s[k]; }
    document.documentElement.setAttribute("data-theme", resolve(set.mode));
    listeners.forEach(function (fn) { try { fn(set); } catch (e) {} });
    if (window.VOLUME && window.VOLUME.settingsChanged) {
      try { window.VOLUME.settingsChanged(set); } catch (e) {}
    }
  }
  window.addEventListener("message", function (e) {
    var m = e.data;
    if (!m || m.c2 !== 1) return;
    if (m.type === "settings") {
      if (typeof m.base === "string") ctx.base = m.base;
      if (typeof m.frag === "string") ctx.frag = m.frag;
      apply(m.settings);
    }
    if (m.type === "mount") {
      var o = m.opts || {};
      if (typeof o.frag === "string") ctx.frag = o.frag;
      if (window.VOLUME && window.VOLUME.mount) window.VOLUME.mount(o);
    }
    if (m.type === "suspend") {
      if (window.VOLUME && window.VOLUME.suspend) window.VOLUME.suspend();
      if (api.onPause) api.onPause();
    }
  });

  var api = {
    register: function (v) {
      slug = v.slug;
      window.VOLUME = v;
      apply(readRaw("prefs", null));
      if (embedded) parent.postMessage({ c2: 1, type: "ready", slug: slug }, "*");
      else document.body && document.body.classList.add("standalone");
      return api;
    },
    settings: function () { return set; },
    mode: function () { return resolve(set.mode); },
    onSettings: function (fn) { listeners.push(fn); return api; },
    read: function (key, fallback) { return readRaw("v." + slug + "." + key, fallback); },
    write: function (key, value) { return writeRaw("v." + slug + "." + key, value); },
    haptic: function (pattern) {
      if (!set.haptic) return;
      try { navigator.vibrate && navigator.vibrate(pattern); } catch (e) {}
    },
    sound: function () { return !!set.sound; },
    /* The fragment this volume was opened with, if any. */
    frag: function () {

      var h = location.hash.replace(/^#/, "");
      return h.indexOf("/") > -1 ? h.slice(h.indexOf("/") + 1) : h;
    },
    /* A full, shareable URL that reopens this volume at this fragment. */
    link: function (frag) {

      if (location.protocol !== "http:" && location.protocol !== "https:") return "";
      return location.origin + location.pathname + "#" + frag;
    },
    /* Keep the address bar in step, so a refresh returns the same board. */
    setFrag: function (frag) {
      ctx.frag = frag;
      if (embedded) { parent.postMessage({ c2: 1, type: "frag", slug: slug, frag: frag }, "*"); return; }
      try {

      } catch (e) {}
    },
    share: function (lines) {
      if (embedded) parent.postMessage({ c2: 1, type: "share", slug: slug, lines: lines }, "*");
      else window.open("https://wa.me/?text=" + encodeURIComponent(lines.join("\n")), "_blank", "noopener");
    },

  };

    try {
      var raw = localStorage.getItem("c2." + key);
      if (!raw) return fallback;
      var o = JSON.parse(raw);
      if (!o || o.v !== 1) return fallback;
      return o.d;
    } catch (e) { return fallback; }
  }
  function writeRaw(key, value) {
    try { localStorage.setItem("c2." + key, JSON.stringify({ v: 1, d: value })); return true; }
    catch (e) { return false; }
  }
  return api;
})();

/* Contract §7 — seeded randomness. Canonical. A daily board must be identical
   on every device, so the seed comes from the slug and the date, never from
   Math.random. */
function seedFor(slug, date) {
  var s = slug + "|" + date, h = 2166136261 >>> 0;
  for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
  return h >>> 0;
}
function rngFrom(seed) {
  return function () {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    var t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };

/* Furlong core: split the field into rectangular strips, each holding one
   number equal to its area. */
var F_N = 6;
function fSize(n){ F_N = n; }
/* Every rectangle of the given area that covers cell `at`, stays on the
   field and holds no other numbered cell. */
function fCands(clueAt, at, area){
  var out = [], r0 = (at / F_N) | 0, c0 = at % F_N;
  for (var w = 1; w <= area; w++) {
    if (area % w) continue;
    var h = area / w;
    if (w > F_N || h > F_N) continue;
    for (var top = r0 - h + 1; top <= r0; top++) for (var left = c0 - w + 1; left <= c0; left++) {
      if (top < 0 || left < 0 || top + h > F_N || left + w > F_N) continue;
      var ok = true, cells = [];
      for (var r = top; r < top + h && ok; r++) for (var c = left; c < left + w; c++) {
        var i = r * F_N + c;
        if (i !== at && clueAt[i]) { ok = false; break; }
        cells.push(i);
      }
      if (ok) out.push({ r: top, c: left, w: w, h: h, cells: cells });
    }
  }
  return out;
}
/* Random tiling, filled from the first empty cell in reading order. */
function fTile(rng, maxA){
  var S = F_N * F_N, own = new Int16Array(S).fill(-1), rects = [];
  for (var at = 0; at < S; at++) {
    if (own[at] >= 0) continue;
    var r0 = (at / F_N) | 0, c0 = at % F_N, opts = [];
    for (var h = 1; h <= F_N - r0; h++) for (var w = 1; w <= F_N - c0; w++) {
      var a = w * h; if (a < 2 || a > maxA) continue;
      var ok = true;
      for (var r = r0; r < r0 + h && ok; r++) for (var c = c0; c < c0 + w; c++) if (own[r * F_N + c] >= 0) { ok = false; break; }
      if (ok) opts.push([w, h]);
    }
    if (!opts.length) return null;
    var pick = opts[(rng() * opts.length) | 0], id = rects.length, cells = [];
    for (var rr = r0; rr < r0 + pick[1]; rr++) for (var cc = c0; cc < c0 + pick[0]; cc++) { own[rr * F_N + cc] = id; cells.push(rr * F_N + cc); }
    rects.push({ r: r0, c: c0, w: pick[0], h: pick[1], cells: cells });
  }
  return rects;
}
/* Human-style solve using two rules, repeated: a number with one rectangle
   left takes it; a cell only one rectangle can still cover takes that one.

function fLogic(clues){

/* Exact count of solutions, stopping at `limit`. */

function fCandidate(rng){
  var maxA = F_N <= 6 ? 8 : 10;

/* Volume kit: the rules sheet. Shared by Reeve, Shunt, Furlong, Bight and
   Marquetry. The sheet opens itself the first time a volume is played. */
function vkRules(C2){
  var sheet = document.getElementById("rules"), btn = document.getElementById("rulesBtn"),
      close = document.getElementById("rulesClose"), last = null;
  function open(){
    last = document.activeElement;
    sheet.hidden = false;
    var card = sheet.querySelector(".rules-card");
    card.scrollTop = 0;
    try { close.focus({ preventScroll: true }); } catch (e) { close.focus(); }
    card.scrollTop = 0;
  }
  function shut(){
    sheet.hidden = true;
    C2.write("taught", true);
    if (last && last.focus) last.focus();
  }
  btn.addEventListener("click", open);
  close.addEventListener("click", shut);
  sheet.addEventListener("click", function (e) { if (e.target === sheet) shut(); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !sheet.hidden) { e.stopPropagation(); shut(); } }, true);
  if (!C2.read("taught", false)) setTimeout(open, 250);

}

/* ── shared helpers for the volumes built on this kit ───────────── */
function vkToday() {

  var p = s.split("-"), d = new Date(+p[0], +p[1] - 1, +p[2]);

function vkChord() {

  C2.haptic([20, 60, 20, 60, 30]);
}
function vkRead(word, line) {
  document.getElementById("read").innerHTML = "<b>" + word + "</b><span class='sub'>" + line + "</span>";
}
var vkToastTimer;
function vkToast(msg) {
  var t = document.getElementById("toast"); t.innerHTML = msg; t.classList.add("up");
  clearTimeout(vkToastTimer); vkToastTimer = setTimeout(function () { t.classList.remove("up"); }, 2600);
}
function vkSeg(mode) {
  var segs = document.querySelectorAll(".seg button");
  for (var k = 0; k < segs.length; k++) segs[k].setAttribute("aria-pressed", String(segs[k].dataset.mode === mode));
}
function vkRows(rows) {
  document.getElementById("rows").innerHTML = rows.map(function (r) {
    return "<div class='row " + (r[2] || "") + "'><span class='grow'>" + r[0] + "</span><b>" + r[1] + "</b></div>";

}
var vkEmbedded = (function () { try { return window.parent !== window; } catch (e) { return false; } })();
/* A ticking clock that only runs while the board is on screen and unfinished. */
function vkClockKeeper(el, get, set) {

    start: function () {

(function () {
  "use strict";

  var WEEK = [[8, 14, 99], [6, 3, 5], [6, 6, 8], [7, 5, 7], [7, 8, 10], [8, 8, 10], [8, 11, 13]];
  var FREE = [7, 6, 9];
  var CAP = 60000;
  var $ = function (id) { return document.getElementById(id); };

  var B = null, G = null, mode = "daily", loadToken = 0, booted = false;
  var anchor = -1, drag = null, cellsTop = [];
  var stats = C2.read("stats", null) || { plays: 0, clean: 0, streak: 0, lastDaily: null };
  var clock = vkClockKeeper($("cTime"), function () { return G ? G.elapsed : 0; }, function (v) { if (G) G.elapsed = v; });

  /* ── generation ─────────────────────────────────────── */
  function generate(seed, n, lo, hi, done) {
    var token = ++loadToken, rng = rngFrom(seed), tries = 0;
    fSize(n);

      if (token !== loadToken) return;

        if (tries === CAP) { rng = rngFrom(seed); lo = 0; hi = 99; }
